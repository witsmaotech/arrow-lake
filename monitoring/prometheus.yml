# Prometheus Configuration for DIntelliHub
# Monitors all services for health and performance metrics

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'dintellihub-local'
    environment: 'development'

# Alertmanager configuration (optional, for future use)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: []

# Rule files (optional, for future alerting rules)
# rule_files:
#   - "alerts/*.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # LanceDB Vector Database Service
  - job_name: 'lancedb'
    static_configs:
      - targets: ['lancedb-service:8765']
        labels:
          service: 'lancedb'
          component: 'vector-database'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Daft Data Processing Service
  - job_name: 'daft'
    static_configs:
      - targets: ['daft-service:8000']
        labels:
          service: 'daft'
          component: 'data-processing'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # PostgreSQL Database (requires postgres_exporter, placeholder)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
        labels:
          service: 'postgres'
          component: 'metadata-db'
    metrics_path: '/metrics'
    scrape_interval: 30s

  # MinIO Object Storage
  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
        labels:
          service: 'minio'
          component: 'object-storage'
    metrics_path: '/minio/v2/metrics/cluster'
    scrape_interval: 30s

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
          component: 'visualization'
    metrics_path: '/metrics'
    scrape_interval: 30s
