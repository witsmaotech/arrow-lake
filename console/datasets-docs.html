<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>文档数据集 · Arrow Lake Console</title>
<link rel="stylesheet" href="assets/tokens.css"/>
<link rel="stylesheet" href="assets/app.css"/>
<link rel="stylesheet" href="assets/console.css"/>
</head>
<body>
<div id="app">
<main class="main"><div class="page">
  <div class="h-sec between">
    <div><h1>文档数据集</h1><div class="desc">文档/图像/视频摄入产生的非结构化数据集 · chunk·embed·FTS·KG 工作区</div></div>
    <div class="flex"><a class="btn btn-ghost btn-sm" href="datasets-data.html" title="结构化/容器数据集">▦ 表格数据集 →</a><a class="btn btn-primary btn-sm" href="ingest-docs.html"><i class="placeholder" data-ic="plus"></i> 摄入</a></div>
  </div>
  <div class="panel flush">
    <div class="panel-h"><i class="placeholder" data-ic="search"></i><h3>数据集</h3><span class="sub" id="cnt">—</span><span class="actions">
            <button class="btn btn-ghost btn-sm" id="refresh"><i class="placeholder" data-ic="refresh"></i></button></span></div>
    <div style="overflow-x:auto"><table class="tbl">
      <thead><tr><th>数据集</th><th>描述</th><th class="num">行数</th><th class="num">大小</th><th>列 / 向量</th><th>索引</th><th>KG</th><th class="num">版本</th><th>创建</th><th>更新</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div id="pager" class="flex" style="gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line-soft);justify-content:flex-end"></div>
  </div>
</div></main>
</div>
<script src="assets/console-layout.js"></script>
<script type="module">
import { request } from "./src/api.js";
import { isLoggedIn } from "./src/auth.js";
import { runExport } from "./src/export.js";
import { toast } from "./src/ui/toast.js";
import { confirmDialog } from "./src/ui/modal.js";

if (!isLoggedIn()) location.href = "login.html";
const { renderShell, icon } = window;
renderShell({ active: "datasets-docs", crumb: "<b>文档数据集</b>" });
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// 导出需 EDITOR(/datasets/{n}/export role=EDITOR)
const canEdit = (() => {
  try {
    const tok = localStorage.getItem("al_access") || "";
    const payload = JSON.parse(atob(tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
    return ["EDITOR", "ADMIN"].includes(String(payload.role || "EDITOR").toUpperCase());
  } catch (_) { return false; }
})();
async function doExport(name, btn) {
  try {
    toast(`导出 ${name}(parquet) 已提交,后台异步处理…`, "info");
    if (btn) btn.disabled = true;
    await runExport(name, { format: "parquet" });
    toast(`导出完成:${name}.parquet`, "ok");
  } catch (e) {
    toast("导出失败:" + (e?.detail || e?.message || e), "warn", 5000);
  } finally { if (btn) btn.disabled = false; }
}
// 删除需 EDITOR(DELETE /datasets/{n} role=EDITOR);级联清除派生资产(KG/KA/索引/catalog元数据/ACL/模板绑定)+ 二次确认 + 本地移除避免整表 reload 丢分页
async function doDelete(name, btn) {
  if (!(await confirmDialog({ title: "删除数据集", message: `确认删除「${name}」?将一并清除其关联的知识图谱、KA 转储、向量/全文索引、权限与模板绑定。历史任务/RAG 记录保留。此操作不可恢复。`, danger: true, confirmText: "删除" }))) return;
  try {
    if (btn) btn.disabled = true;
    await request("DELETE", `/datasets/${encodeURIComponent(name)}?cascade=true`);
    toast(`已删除:${name}`, "ok");
    STATE.all = STATE.all.filter((d) => d.name !== name);
    renderPage();
  } catch (e) {
    toast("删除失败:" + (e?.detail || e?.message || e), "danger", 5000);
  } finally { if (btn) btn.disabled = false; }
}

const fmtSize = (b) => {
  if (b == null || isNaN(b)) return "—";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0, n = Number(b);
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(n < 10 && i > 0 ? 1 : 0)} ${u[i]}`;
};
const fmtDate = (s) => {
  if (!s) return "—";
  const d = new Date(s);
  if (isNaN(d)) return String(s).slice(0, 16);
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const STATE = { all: [], page: 1, pageSize: 10 };
// kind 徽标(W4.2 表格/文本分家):容器=多表数据集,文档=摄入管线特征列
const kindBadge = (d) => '<span class="tag info" title="文档型(非结构化)">📄 文档</span>';
// 描述:优先人工 description(ingest 时填),否则基于元数据自动摘要
function descOf(d) {
  if (d.description && d.description.trim()) return d.description.trim();
  const tags = [];
  if (d.has_kg) tags.push("知识图谱");
  if (d.has_vector_index && d.has_fts_index) tags.push("RAG 检索");
  else if (d.has_vector_index) tags.push("向量检索");
  else if (d.has_fts_index) tags.push("全文检索");
  if (!tags.length) tags.push("文档集");
  const parts = [`${(d.num_rows ?? 0).toLocaleString()} 行`];
  if (d.vector_dim) parts.push(`${d.vector_dim}d`);
  return tags.join(" + ") + " · " + parts.join(" · ");
}
function rowOf(d) {
  const idx = `${d.has_vector_index ? '<span class="tag teal">向量</span>' : ""}${d.has_fts_index ? '<span class="tag info">FTS</span>' : ""}` || '<span class="muted">—</span>';
  const cols = `${d.num_columns ?? 0} 列${d.vector_dim ? ` · <span class="mono" style="color:var(--teal-bright)">${d.vector_dim}d</span>` : ""}`;
  return `<tr>
    <td><a href="dataset-detail.html?ds=${encodeURIComponent(d.name)}" style="color:var(--fg-hi);font-weight:600">${icon("database")} ${esc(d.name)}</a>${kindBadge(d) ? " " + kindBadge(d) : ""}</td>
    <td style="color:var(--fg-lo);font-size:.78rem">${esc(descOf(d))}</td>
    <td class="num">${(d.num_rows ?? 0).toLocaleString()}</td>
    <td class="num mono">${fmtSize(d.size_bytes)}</td>
    <td>${cols}</td>
    <td>${idx}</td>
    <td>${d.has_kg ? `<a href="kg.html?ds=${encodeURIComponent(d.name)}" class="tag teal" title="查看知识图谱">KG</a>` : '<span class="muted">—</span>'}</td>
    <td class="num mono">${d.version ?? "—"}</td>
    <td class="num mono" style="color:var(--fg-lo)">${fmtDate(d.created_at)}</td>
    <td class="num mono" style="color:var(--fg-lo)">${fmtDate(d.updated_at)}</td>
    <td style="white-space:nowrap">${canEdit ? `<button class="btn btn-icon btn-ghost btn-sm" data-export="${esc(d.name)}" title="异步导出 Parquet(202 任务 + 下载)">⬇</button>` : ""}${canEdit && !d.name.startsWith("_") && !d.name.startsWith("sys_") ? `<button class="btn btn-icon btn-ghost btn-sm" data-delete="${esc(d.name)}" style="color:var(--danger)" title="删除数据集(不可恢复)">🗑</button>` : ""}<a href="dataset-detail.html?ds=${encodeURIComponent(d.name)}" class="btn btn-icon btn-ghost btn-sm" aria-label="进入">${icon("arrowR")}</a></td>
  </tr>`;
}
function renderPage() {
  const all = STATE.all.filter((d) => (d.kind || "structured") === "document"), total = all.length, ps = STATE.pageSize;
  const totalPages = Math.max(1, Math.ceil(total / ps));
  if (STATE.page > totalPages) STATE.page = totalPages;
  const start = (STATE.page - 1) * ps;
  const page = all.slice(start, start + ps);
  $("#cnt").textContent = `${total} 个`;
  $("#rows").innerHTML = total ? page.map(rowOf).join("") : `<tr><td colspan="11" class="muted" style="padding:28px;text-align:center">无文档数据集 — 去 <a href="ingest-docs.html" style="color:var(--teal-bright)">摄入</a></td></tr>`;
  const p = STATE.page;
  $("#pager").innerHTML = total ? `
    <span class="muted" style="font-size:.78rem">第 ${p}/${totalPages} 页 · 共 ${total}</span>
    <button class="btn btn-ghost btn-sm" data-go="${p - 1}" ${p <= 1 ? "disabled" : ""}>‹ 上一页</button>
    <button class="btn btn-ghost btn-sm" data-go="${p + 1}" ${p >= totalPages ? "disabled" : ""}>下一页 ›</button>
    <select class="select" id="pageSizeSel" style="width:auto;font-size:.78rem">${[10, 20, 50].map((n) => `<option value="${n}"${n === ps ? " selected" : ""}>${n} / 页</option>`).join("")}</select>` : "";
  $("#pager").querySelectorAll("[data-go]").forEach((b) => { if (!b.disabled) b.addEventListener("click", () => { STATE.page = +b.dataset.go; renderPage(); }); });
  const sel = $("#pageSizeSel"); if (sel) sel.addEventListener("change", () => { STATE.pageSize = +sel.value; STATE.page = 1; renderPage(); });
  $("#rows").querySelectorAll("[data-export]").forEach((b) => b.addEventListener("click", () => doExport(b.dataset.export, b)));
  $("#rows").querySelectorAll("[data-delete]").forEach((b) => b.addEventListener("click", () => doDelete(b.dataset.delete, b)));
}
async function load() {
  $("#rows").innerHTML = `<tr><td colspan="11" class="muted" style="padding:28px;text-align:center">加载中…</td></tr>`;
  $("#pager").innerHTML = "";
  try {
    const data = await request("GET", "/datasets?limit=1000");
    // 默认按时间倒序(最新在前):优先 updated_at,缺失回退 created_at
    const tsOf = (d) => { const t = d.updated_at || d.created_at; if (!t) return 0; const n = new Date(t).getTime(); return isNaN(n) ? 0 : n; };
    STATE.all = (data?.datasets || []).slice().sort((a, b) => tsOf(b) - tsOf(a));
    STATE.page = 1;
    renderPage();
  } catch (e) {
    const msg = e?.detail || e?.message || String(e);
    $("#rows").innerHTML = `<tr><td colspan="11" style="padding:28px;text-align:center;color:var(--danger)">加载失败:${esc(msg)}<br/><button class="btn btn-ghost btn-sm" id="retry" style="margin-top:10px">重试</button></td></tr>`;
    $("#retry")?.addEventListener("click", load);
    toast("数据集加载失败:" + msg, "warn", 4000);
  }
}
load();
$("#refresh")?.addEventListener("click", load);
</script>
</body>
</html>
