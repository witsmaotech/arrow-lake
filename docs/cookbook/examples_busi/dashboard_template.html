<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>芜湖城市生命线 · 端到端监测仪表盘</title>
<style>
:root{
  --bg:#070b16;--bg2:#0d1424;--card:#121b30;--card2:#0f1626;--border:#1f2c47;
  --accent:#00e0ff;--accent2:#3b82f6;--accent3:#a855f7;--ok:#22d3a7;--warn:#fbbf24;
  --text:#e6edf7;--muted:#7388a8;--dim:#4a5a7a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
body{background:
  radial-gradient(1200px 600px at 80% -10%,rgba(0,224,255,.08),transparent 60%),
  radial-gradient(900px 500px at 0% 0%,rgba(168,85,247,.07),transparent 55%),
  var(--bg);
  min-height:100vh;padding:28px 22px 60px}
.mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace}
.wrap{max-width:1380px;margin:0 auto}

/* header */
header{position:relative;padding:26px 30px 22px;border:1px solid var(--border);border-radius:16px;background:linear-gradient(135deg,rgba(0,224,255,.06),rgba(168,85,247,.05)),var(--card);overflow:hidden;margin-bottom:22px}
header::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(0,224,255,.12),transparent);transform:translateX(-100%);animation:scan 6s linear infinite}
@keyframes scan{to{transform:translateX(100%)}}
.eyebrow{font-size:12px;letter-spacing:.3em;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
h1{font-size:28px;font-weight:700;letter-spacing:-.01em;background:linear-gradient(90deg,#fff,#9fdfff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin-top:6px;font-size:14px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(34,211,167,.12);border:1px solid rgba(34,211,167,.35);color:var(--ok);font-size:12px;margin-left:8px;vertical-align:middle}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;margin-bottom:22px}
@media(max-width:1100px){.metrics{grid-template-columns:repeat(4,1fr)}}
@media(max-width:560px){.metrics{grid-template-columns:repeat(2,1fr)}}
.metric{padding:16px 14px;border:1px solid var(--border);border-radius:12px;background:linear-gradient(180deg,var(--card),var(--card2));position:relative;overflow:hidden;transition:.25s}
.metric:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,224,255,.12)}
.metric::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:.6}
.metric .v{font-size:26px;font-weight:700;color:#fff;letter-spacing:-.02em}
.metric .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.metric .k{font-size:12px;color:var(--muted);margin-top:4px}

/* pipeline */
.pipeline{display:flex;align-items:center;gap:4px;padding:18px 22px;border:1px solid var(--border);border-radius:14px;background:var(--card);margin-bottom:22px;flex-wrap:wrap}
.pl-step{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(34,211,167,.08);border:1px solid rgba(34,211,167,.3)}
.pl-step .n{width:22px;height:22px;border-radius:50%;background:var(--ok);color:#062;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.pl-step .t{font-size:13px;font-weight:600}
.pl-step .d{font-size:11px;color:var(--muted)}
.pl-arrow{color:var(--dim);font-size:14px}

/* main grid */
.main{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;margin-bottom:22px}
@media(max-width:980px){.main{grid-template-columns:1fr}}
.panel{border:1px solid var(--border);border-radius:14px;background:var(--card);overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);background:var(--card2)}
.panel-h h2{font-size:15px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px}
.panel-h h2::before{content:"";width:3px;height:14px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:2px}
.panel-h .meta{font-size:12px;color:var(--muted)}
#cy{width:100%;height:440px;background:radial-gradient(circle at 50% 50%,#0a1120,#060a14)}

/* tabs */
.tabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--border);background:var(--card2)}
.tab{padding:12px 16px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:.2s;font-weight:500}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.qa-list{padding:14px 18px;max-height:440px;overflow-y:auto}
.qa{padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--card2);margin-bottom:12px}
.qa .q{font-weight:600;color:#fff;font-size:14px;margin-bottom:8px;display:flex;gap:8px}
.qa .q .qt{color:var(--accent);font-size:11px;padding:2px 7px;border-radius:6px;background:rgba(0,224,255,.12);font-weight:600;height:fit-content}
.qa .a{color:var(--text);font-size:13px;line-height:1.65;white-space:pre-wrap}
.qa .cite{margin-top:8px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.qa .cite code{background:rgba(0,224,255,.1);color:var(--accent);padding:1px 6px;border-radius:4px}

/* search */
.search{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px 18px}
@media(max-width:700px){.search{grid-template-columns:1fr}}
.sr{padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--card2)}
.sr .kw{display:inline-block;font-size:12px;color:var(--accent);background:rgba(0,224,255,.1);padding:3px 10px;border-radius:6px;margin-bottom:8px;font-weight:600}
.sr .ex{font-size:12px;color:var(--muted);line-height:1.55}

/* findings */
.findings{padding:16px 18px;display:grid;gap:10px}
.fd{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--border);border-radius:10px;background:var(--card2);font-size:13px}
.fd .x{color:var(--warn)}
.fd .t{color:var(--text);font-weight:500}
.fd .f{color:var(--ok);font-family:'JetBrains Mono',monospace;font-size:12px}

footer{text-align:center;color:var(--dim);font-size:12px;margin-top:28px;padding-top:20px;border-top:1px solid var(--border)}
.legend{display:flex;gap:12px;padding:8px 18px 14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.fallback{padding:18px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">ARROW LAKE · v1.8.6 END-TO-END</div>
    <h1 id="title">芜湖城市生命线安全工程 · 端到端监测仪表盘</h1>
    <div class="sub" id="sub"></div>
    <span class="badge"><span class="dot"></span> 全链路 PASS</span>
  </header>

  <section class="metrics" id="metrics"></section>
  <section class="pipeline" id="pipeline"></section>

  <section class="main">
    <div class="panel">
      <div class="panel-h"><h2>知识图谱 · per-dataset 子图</h2><span class="meta" id="graphMeta"></span></div>
      <div id="cy"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel">
      <div class="panel-h"><h2>RAG / GraphRAG 问答</h2><span class="meta">qwen2.5:14b</span></div>
      <div class="tabs">
        <div class="tab active" data-tab="rag">纯向量 RAG</div>
        <div class="tab" data-tab="graphrag">GraphRAG (KG 增强)</div>
      </div>
      <div class="qa-list" id="qaList"></div>
    </div>
  </section>

  <section class="panel" style="margin-bottom:22px">
    <div class="panel-h"><h2>检索召回样例</h2><span class="meta">FTS · 向量 · 混合</span></div>
    <div class="search" id="search"></div>
  </section>

  <section class="panel">
    <div class="panel-h"><h2>真实测试踩坑与修复</h2><span class="meta">5 项</span></div>
    <div class="findings" id="findings"></div>
  </section>

  <footer>Arrow Lake v1.8.6 · per-dataset KG 隔离 · bge-m3 + qwen2.5:14b + HugeGraph · 生成于构建时</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script>
const DATA = {{DATA_JSON}};
const PAL = ['#00e0ff','#3b82f6','#a855f7','#22d3a7','#fbbf24','#f472b6','#60a5fa','#34d399'];

/* meta */
document.getElementById('sub').textContent =
  `数据集 ${DATA.meta.dataset} · ${DATA.meta.pages} 页 PDF → ${DATA.meta.chunks} 块 · bge-m3 1024维 · ${DATA.meta.version}`;

/* metrics */
document.getElementById('metrics').innerHTML = DATA.metrics.map(m=>`
  <div class="metric"><div class="v mono">${m.v}<small>${m.u||''}</small></div><div class="k">${m.k}</div></div>`).join('');

/* pipeline */
const pl = document.getElementById('pipeline');
pl.innerHTML = DATA.pipeline.map((s,i)=>`
  ${i?`<span class="pl-arrow">▶</span>`:''}
  <div class="pl-step"><div class="n">${i+1}</div><div><div class="t">${s.n}</div><div class="d mono">${s.d}</div></div></div>
`).join('');

/* tabs */
const lists = {rag: DATA.rag, graphrag: DATA.graphrag};
function renderQA(key){
  const lst = lists[key]||[];
  document.getElementById('qaList').innerHTML = lst.map(q=>`
    <div class="qa">
      <div class="q"><span class="qt">${key==='rag'?'RAG':'GraphRAG'}</span><span>${q.q||''}</span></div>
      <div class="a">${(q.a||'').slice(0,400)}${(q.a||'').length>400?'…':''}</div>
      ${q.cite!=null?`<div class="cite">📎 引用 <code>${q.cite}</code> 条上下文 chunk</div>`:''}
    </div>`).join('') || '<div class="fallback">无数据</div>';
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');renderQA(t.dataset.tab);
});
renderQA('rag');

/* search */
document.getElementById('search').innerHTML = (DATA.search||[]).map(s=>`
  <div class="sr"><span class="kw">${s.kw}</span><div class="ex">${(s.sample||'').slice(0,140)}…</div></div>`).join('') || '<div class="fallback">无检索数据</div>';

/* findings */
document.getElementById('findings').innerHTML = (DATA.findings||[]).map(f=>`
  <div class="fd"><span class="x">⚠</span><span class="t">${f.t}</span><span class="f">→ ${f.f}</span></div>`).join('');

/* graph (cytoscape) */
const g = DATA.graph||{nodes:[],edges:[]};
document.getElementById('graphMeta').textContent = `${g.count?g.count.nodes:0} 节点 · ${g.count?g.count.edges:0} 边`;
const labels = g.labels||[];
document.getElementById('legend').innerHTML = labels.map((l,i)=>
  `<span><i style="background:${PAL[i%PAL.length]}"></i>${l}</span>`).join('');
const labelColor = {};labels.forEach((l,i)=>labelColor[l]=PAL[i%PAL.length]);

if(window.cytoscape && g.nodes.length){
  const cy = cytoscape({
    container: document.getElementById('cy'),
    elements: [
      ...g.nodes.map(n=>({data:{id:n.id,name:n.display_name||n.name,label:n.label}})),
      ...g.edges.map((e,i)=>({data:{id:'e'+i,source:e.source,target:e.target}}))
    ],
    style:[
      {selector:'node',style:{'background-color':'#1a2540','border-color':ele=>labelColor[ele.data('label')]||'#00e0ff','border-width':2,'width':22,'height':22,'label':'data(name)','font-size':9,'color':'#cfe2f3','text-valign':'bottom','text-margin-y':3,'text-wrap':'ellipsis','text-max-width':70}},
      {selector:'edge',style:{'width':1,'line-color':'#243049','line-opacity':0.7,'curve-style':'bezier','target-arrow-color':'#2a3650','target-arrow-shape':'triangle','arrow-scale':0.6}}
    ],
    layout:{name:'cose',animate:true,animationDuration:600,nodeRepulsion:8000,idealEdgeLength:80,gravity:0.35,padding:20},
    wheelSensitivity:0.2
  });
  cy.on('tap','node',evt=>{const n=evt.target;cy.elements().style('opacity',0.2);n.style('opacity',1);n.neighborhood().style('opacity',1)});
  cy.on('tap',evt=>{if(evt.target===cy){cy.elements().style('opacity',1)}});
}else{
  document.getElementById('cy').innerHTML='<div class="fallback">图谱数据不可用（Cytoscape 未加载或无数据）。子图节点样例：<br>'+g.nodes.slice(0,8).map(n=>n.name).join(' · ')+'</div>';
}
</script>
</body>
</html>
