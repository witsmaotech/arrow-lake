<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RAG · Arrow Lake Console</title>
<link rel="stylesheet" href="assets/tokens.css"/>
<link rel="stylesheet" href="assets/app.css"/>
<link rel="stylesheet" href="assets/console.css"/>
<style>
  .cfg-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;padding:12px 14px;background:var(--ink-900);border:1px solid var(--line-soft);border-radius:var(--r-md)}
  .cfg-bar .field{margin:0;min-width:0}
  .cfg-bar select,.cfg-bar input{height:34px}
  .thread{max-height:60vh;overflow:auto;padding:4px 2px}
  .bubble{padding:12px 14px;border-radius:var(--r-md);font-size:.88rem;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .bubble.q{background:var(--ink-850);border:1px solid var(--line-soft);margin-left:60px}
  .bubble.a{background:var(--ink-900);border:1px solid var(--teal-soft,var(--line));color:var(--fg-hi);white-space:normal}
  .bubble.a.md h1,.bubble.a.md h2,.bubble.a.md h3,.bubble.a.md h4{margin:.5em 0 .2em;color:var(--fg-hi);line-height:1.3}
  .bubble.a.md h1{font-size:1.05rem}.bubble.a.md h2{font-size:1rem}.bubble.a.md h3{font-size:.92rem}.bubble.a.md h4{font-size:.84rem}
  .bubble.a.md p{margin:.35em 0}
  .bubble.a.md ul,.bubble.a.md ol{margin:.35em 0 .35em 1.4em}
  .bubble.a.md li{margin:.12em 0}
  .bubble.a.md code{font-family:var(--font-mono);font-size:.78rem;background:var(--ink-950);padding:1px 5px;border-radius:var(--r-sm);border:1px solid var(--line-soft)}
  .bubble.a.md pre{background:var(--ink-950);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px;overflow:auto;margin:.4em 0}
  .bubble.a.md pre code{background:none;border:none;padding:0}
  .bubble.a.md strong{font-weight:600}
  .bubble.a.md em{color:var(--fg-md)}
  .bubble.a.md blockquote{border-left:3px solid var(--teal-soft,var(--line));padding-left:10px;margin:.4em 0;color:var(--fg-md)}
  .bubble.a.md hr{border:none;border-top:1px solid var(--line-soft);margin:.6em 0}
  .bubble.a.md table{border-collapse:collapse;margin:6px 0;font-size:.8rem;width:auto;max-width:100%}
  .bubble.a.md th,.bubble.a.md td{border:1px solid var(--line);padding:3px 8px;text-align:left}
  .bubble.a.md th{background:var(--ink-850);color:var(--teal-bright)}
  /* 可折叠历史 turn(对齐 kg.html:问题作标题,点击折叠/展开) */
  .turn{border-top:1px dashed var(--line-soft);padding:8px 0 0;margin-top:8px}
  .turn:first-child{border-top:none;margin-top:0}
  .turn-head{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.78rem;color:var(--fg-mid);font-family:var(--font-mono);padding:2px 0}
  .turn-head:hover{color:var(--teal-bright)}
  .turn-q{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .turn-body{margin-top:4px}
  .turn.collapsed .turn-body{display:none}
  .tg{width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;display:inline-block;transition:transform .15s}
  .turn.collapsed .tg{transform:rotate(0)}
  .turn:not(.collapsed) .tg{transform:rotate(90deg)}
  .role-ic{width:13px;height:13px;vertical-align:-2px;margin-right:5px;opacity:.85;stroke:currentColor;fill:none}
  .assistant-mark{font-size:.7rem;font-family:var(--font-mono);color:var(--fg-lo);margin:8px 0 4px;display:flex;align-items:center}
  /* typing 动画(请求中) */
  .typing{display:inline-flex;gap:3px;align-items:center;padding:6px 0}
  .typing i{width:5px;height:5px;border-radius:50%;background:var(--fg-lo);animation:tb 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}
  .typing i:nth-child(3){animation-delay:.4s}
  @keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
  /* 示例问题 chip(空态) */
  .ex-chip{display:inline-block;font-size:.74rem;padding:4px 10px;border-radius:999px;border:1px dashed var(--line);color:var(--fg-mid);cursor:pointer;margin:3px;transition:all .15s}
  .ex-chip:hover{color:var(--teal-bright);border-color:var(--teal-bright);border-style:solid}
  /* 引用卡片(可点击展开/收起原文,对齐 kg cite 的"可点击"交互) */
  .cites{margin-top:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
  .cite{border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:8px 10px;background:var(--ink-950);cursor:pointer;transition:border-color .15s}
  .cite:hover{border-color:var(--teal-bright)}
  .cite-head{display:flex;gap:8px;align-items:center;margin-bottom:4px}
  .cite-score{font-family:var(--font-mono);font-size:.68rem;padding:1px 6px;border-radius:var(--r-sm);background:var(--ink-900);color:var(--teal-bright);border:1px solid var(--line-soft)}
  .cite-meta{font-family:var(--font-mono);font-size:.66rem;color:var(--fg-lo)}
  .cite-text{font-size:.74rem;color:var(--fg-md);line-height:1.5;max-height:60px;overflow:auto;transition:max-height .2s}
  .cite.expanded .cite-text{max-height:400px}
  .stat{font-family:var(--font-mono);font-size:.7rem;color:var(--fg-lo);margin-top:6px}
  .empty{padding:40px 0;text-align:center;color:var(--fg-lo)}
</style>
</head>
<body>
<div id="app">
<main class="main"><div class="page">
  <div class="h-sec between">
    <div><h1>RAG 问答</h1><div class="desc">检索 → 重排 → LLM 答 + 引用 · 持久会话跨刷新续接</div></div>
    <div class="flex" style="gap:8px;align-items:center">
      <span class="tag info" id="sessTag" style="font-family:var(--font-mono)">无会话</span>
      <button class="btn btn-ghost btn-sm" id="newSess">新会话</button>
    </div>
  </div>

  <div class="cfg-bar">
    <div class="field" style="flex:1.4"><label>数据集</label><select class="select" id="ds"></select></div>
    <div class="field" style="flex:1.2"><label>检索策略</label><select class="select" id="strategy"><option value="">默认</option><option value="fts">FTS</option><option value="vector">向量</option><option value="hybrid">混合</option></select></div>
    <div class="field" style="flex:1.4"><label>模板</label><select class="select" id="template"><option value="">默认</option></select></div>
    <div class="field" style="flex:.5"><label>top_k</label><input class="input mono" id="topK" type="number" min="1" value="6"/></div>
  </div>

  <div class="panel flush" style="margin-top:var(--s4)">
    <div class="panel-h"><i class="placeholder" data-ic="search"></i><h3>会话</h3><span class="sub" id="turnMeta">—</span></div>
    <div class="panel-b">
      <div class="thread" id="thread"><div class="empty">选数据集 → 提问开始(答案来自真实 LLM,引用来自检索+重排)</div></div>
      <div class="flex" style="gap:8px;margin-top:var(--s3)">
        <input class="input" id="question" placeholder="针对该数据集提问…" style="flex:1"/>
        <button class="btn btn-primary btn-sm" id="askBtn">提问</button>
        <button class="btn btn-ghost btn-sm" data-fav="rag" title="收藏到我的工作区(需 personal token)">收藏</button>
      </div>
    </div>
  </div>

  <div class="panel flush" id="kgSubPanel" style="margin-top:var(--s4);display:none">
    <div class="panel-h"><i class="placeholder" data-ic="share-nodes"></i><h3>相关实体子图(KG)</h3><span class="sub" id="kgSubMeta">—</span></div>
    <div class="panel-b"><div id="kgSub" style="height:320px;border:1px solid var(--line-soft);border-radius:var(--r-md);background:var(--ink-900)"></div></div>
  </div>
</div></main>
</div>

<script src="assets/console-layout.js"></script>
<script src="vendor/vis-network.bundle.min.js"></script>
<script type="module">
import { request, refreshToken, API_BASE } from "./src/api.js";
import { isLoggedIn, getAccessToken, getApiKey } from "./src/auth.js";
import { toast } from "./src/ui/toast.js";
import { renderKgSubgraph } from "./src/kg-subgraph.js";
import "./src/favorite.js";  // [data-fav] 自动绑收藏入口

if (!isLoggedIn()) location.href = "login.html";
const { renderShell } = window;
renderShell({ active: "rag", crumb: '<b>RAG</b>' });
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const SESS_KEY = "al_rag_session";
const EX_QUESTIONS = ["这个数据集主要讲什么？", "总结关键内容和要点", "有哪些核心主题？", "列举几个关键信息"];
let turns = [];
let session = null; // {session_id, ds}
let askAbort = null; // AbortController(取消当前查询)

function curDs() { return $("#ds").value; }

async function loadDatasets() {
  try {
    const data = await request("GET", "/datasets");
    const all = data?.datasets || [];
    // 只列可 RAG 的:有检索索引(FTS/向量)+ 即有文本可检索;系统表/图片表无索引 → 过滤掉
    const raggable = all.filter(d => d.has_vector_index || d.has_fts_index);
    const preset = new URL(location.href).searchParams.get("ds");
    const tag = (d) => (d.has_vector_index && d.has_fts_index) ? "向量+FTS" : d.has_vector_index ? "向量" : "FTS";
    $("#ds").innerHTML = `<option value="">— 选择数据集(${raggable.length}/${all.length} 可 RAG)—</option>` + raggable.map(d => `<option value="${esc(d.name)}"${d.name === preset ? " selected" : ""}>${esc(d.name)} · ${tag(d)}</option>`).join("");
    if (preset && !raggable.some(d => d.name === preset)) toast(`数据集「${preset}」无检索索引,不可 RAG(已过滤)`, "warn", 4000);
    restoreSession();
  } catch (e) { toast("数据集列表加载失败:" + (e?.detail || e?.message || e), "warn"); }
}
async function loadTemplates() {
  try {
    const r = await request("GET", "/rag/templates");
    const ts = r?.templates || [];
    $("#template").innerHTML = `<option value="">默认</option>` + ts.map(t => `<option value="${esc(t.name)}" title="${esc(t.description)}">${esc(t.name)} · ${esc(t.type)}</option>`).join("");
  } catch (_) { /* 模板可选,失败不阻塞 */ }
}

function restoreSession() {
  try { session = JSON.parse(localStorage.getItem(SESS_KEY) || "null"); } catch (_) { session = null; }
  if (session && session.ds && session.session_id) {
    if (curDs() && session.ds !== curDs()) session = null; // 数据集不匹配则丢弃
    if (session) { $("#ds").value = session.ds; loadHistory(); }
  }
  renderSessionTag();
}
function renderSessionTag() {
  $("#sessTag").textContent = session?.session_id ? `会话 ${session.session_id.slice(0, 8)} · ${turns.length} 轮` : "无会话";
  $("#turnMeta").textContent = `${turns.length} 轮`;
}
function saveSession() {
  if (session) localStorage.setItem(SESS_KEY, JSON.stringify(session));
  else localStorage.removeItem(SESS_KEY);
  renderSessionTag();
}
$("#newSess").addEventListener("click", () => { session = null; turns = []; saveSession(); renderThread(); toast("已开新会话", "ok"); });
$("#ds").addEventListener("change", () => { session = null; turns = []; saveSession(); renderThread(); }); // 切数据集重置会话

async function loadHistory() {
  if (!session?.session_id) return;
  try {
    const r = await request("GET", `/rag/history/${encodeURIComponent(session.session_id)}`);
    turns = (r?.turns || []).map(t => ({
      q: t.question || t.q || "",
      a: t.answer || t.a || "",
      citations: t.citations || [],
      retrieval_count: t.retrieval_count,
      latency_ms: t.latency_ms,
    }));
    renderThread();
  } catch (_) { /* 历史失败静默 */ }
}

// 极简 markdown 渲染(escape-first → XSS 安全,无外部依赖/CDN,逐行块级解析):
// 支持 ```代码块```、`行内代码`、# 标题、-/* 列表、N. 有序列表、> 引用、--- 分割线、|表格|、**粗体**、*斜体*、段落。
// 逐行解析 → 列表/代码块/引用/表格不再依赖前后空行,真实 LLM 输出可靠渲染。
function renderMd(src) {
  if (!src) return "(无回答)";
  let s = esc(src);
  const blocks = [], inls = [];
  // 抽离围栏代码块 / 行内代码 → \x00 哨兵占位符(与正文不冲突),最后统一还原
  s = s.replace(/```[^\n`]*\n?([\s\S]*?)```/g, (_m, c) => { blocks.push(c.replace(/\n$/, "")); return `\x00B${blocks.length - 1}\x00`; });
  s = s.replace(/`([^`\n]+)`/g, (_m, c) => { inls.push(c); return `\x00I${inls.length - 1}\x00`; });
  const lines = s.split("\n");
  const out = [];
  let para = [];
  const flush = () => { if (para.length) { out.push(`<p class="md-p">${para.join("<br>")}</p>`); para = []; } };
  const isUl = (l) => /^\s*[-*+]\s+/.test(l);
  const isOl = (l) => /^\s*\d+[.)]\s+/.test(l);
  const isTableRow = (l) => /^\s*\|.*\|\s*$/.test(l);
  const isTableSep = (l) => /^\s*\|[\s:|-]+\|\s*$/.test(l);
  const parseRow = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (!line.trim()) { flush(); continue; }
    const cb = line.match(/^\x00B(\d+)\x00$/);
    if (cb) { flush(); out.push(`<pre class="md-pre"><code>${blocks[+cb[1]]}</code></pre>`); continue; }
    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { flush(); out.push(`<h${h[1].length + 1} class="md-h">${h[2]}</h${h[1].length + 1}>`); continue; }
    if (/^&gt;\s?/.test(line)) { flush(); const q = []; while (i < lines.length && /^&gt;\s?/.test(lines[i])) { q.push(lines[i].replace(/^&gt;\s?/, "")); i++; } out.push(`<blockquote class="md-bq">${q.join("<br>")}</blockquote>`); i--; continue; }
    if (isUl(line)) { flush(); const it = []; while (i < lines.length && isUl(lines[i])) { it.push(`<li>${lines[i].replace(/^\s*[-*+]\s+/, "")}</li>`); i++; } out.push(`<ul class="md-ul">${it.join("")}</ul>`); i--; continue; }
    if (isOl(line)) { flush(); const it = []; while (i < lines.length && isOl(lines[i])) { it.push(`<li>${lines[i].replace(/^\s*\d+[.)]\s+/, "")}</li>`); i++; } out.push(`<ol class="md-ol">${it.join("")}</ol>`); i--; continue; }
    // 表格:首行 |...|,次行 |---| 分隔 → 吃连续表格行(对齐 kg.html renderMd 表格能力)
    if (isTableRow(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      flush();
      const head = parseRow(line); i += 2;
      const body = [];
      while (i < lines.length && isTableRow(lines[i])) { body.push(parseRow(lines[i])); i++; }
      i--; // 外层 for 会 i++,回退一格
      out.push(`<table><thead><tr>${head.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flush(); out.push(`<hr class="md-hr"/>`); continue; }
    para.push(line);
  }
  flush();
  let html = out.join("");
  // 兜底:代码块占位符若未独占一行,降级为行内代码(不再泄漏哨兵)
  html = html.replace(/\x00B(\d+)\x00/g, (_m, b) => `<code class="md-code">${blocks[+b]}</code>`);
  html = html.replace(/\x00I(\d+)\x00/g, (_m, k) => `<code class="md-code">${inls[+k]}</code>`);
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
  return html || "(无回答)";
}

function renderThread() {
  if (!turns.length) {
    $("#thread").innerHTML = `<div class="empty">选数据集 → 提问开始(答案来自真实 LLM,引用来自检索+重排)</div><div style="text-align:center">${EX_QUESTIONS.map(q => `<span class="ex-chip" data-q="${esc(q)}">${esc(q)}</span>`).join("")}</div>`;
    renderSessionTag(); return;
  }
  $("#thread").innerHTML = turns.map((t, i) => `
    <div class="turn ${t.collapsed ? "collapsed" : ""}" data-idx="${i}">
      <div class="turn-head">${window.icon ? window.icon("user", "role-ic") : ""}<span class="tg"></span><span class="turn-q">${esc(t.q)}</span></div>
      <div class="turn-body">
        <div class="assistant-mark">${window.icon ? window.icon("sparkles", "role-ic") : ""}ASSISTANT</div>
        <div class="bubble a md">${t.pending ? `<span class="typing"><i></i><i></i><i></i></span>` : renderMd(t.a)}</div>
        ${t.citations?.length ? `<div class="cites">${t.citations.map((c, j) => `
          <div class="cite" title="点击展开/收起原文">
            <div class="cite-head"><span class="cite-score">#${j + 1} · ${typeof c.score === "number" ? c.score.toFixed(3) : esc(c.score ?? "—")}</span><span class="cite-meta">chunk ${esc(c.chunk_index)} · ${esc(c.row_id)}</span></div>
            <div class="cite-text">${esc((c.text_excerpt || "").slice(0, 600))}</div>
          </div>`).join("")}</div>` : ""}
        <div class="stat">检索 ${t.retrieval_count ?? (t.citations?.length || 0)} 条${t.latency_ms ? ` · ${(t.latency_ms / 1000).toFixed(2)}s` : ""}</div>
      </div>
    </div>`).join("");
  $("#thread").scrollTop = $("#thread").scrollHeight;
  renderSessionTag();
}

// 委托:turn-head 折叠 / cite 点击展开原文 / ex-chip 填入示例问题
$("#thread").addEventListener("click", (e) => {
  const head = e.target.closest(".turn-head");
  if (head) { const tn = head.parentElement; const idx = +tn.dataset.idx; tn.classList.toggle("collapsed"); if (turns[idx]) turns[idx].collapsed = tn.classList.contains("collapsed"); return; }
  const cite = e.target.closest(".cite"); if (cite) { cite.classList.toggle("expanded"); return; }
  const ex = e.target.closest(".ex-chip"); if (ex) { $("#question").value = ex.dataset.q; $("#question").focus(); }
});

$("#askBtn").addEventListener("click", () => { if (askAbort) { askAbort.abort(); return; } ask(); });
$("#question").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!askAbort) ask(); } });

async function ask() {
  const ds = curDs(); if (!ds) return toast("先选数据集", "warn");
  const question = $("#question").value.trim(); if (!question) return toast("输入问题", "warn");
  const btn = $("#askBtn"); btn.textContent = "取消";
  askAbort = new AbortController();
  if (turns.length) turns[turns.length - 1].collapsed = true; // 新提问时收起上一条(历史折叠)
  turns.push({ q: question, a: "", citations: [], retrieval_count: 0, pending: true, collapsed: false });
  $("#question").value = "";
  renderThread();
  try {
    const body = {
      question, dataset_name: ds,
      retrieval_strategy: $("#strategy").value || null,
      template_name: $("#template").value || null,
      top_k: parseInt($("#topK").value, 10) || null,
      session_id: session?.session_id || null,
    };
    // 流式 SSE(/rag/query/stream):content 增量输出,避免整体等待 LLM 生成(~45s)
    const makeHeaders = () => { const h = { "Content-Type": "application/json" }; const t = getAccessToken(); if (t) h["Authorization"] = `Bearer ${t}`; const k = getApiKey(); if (k) h["X-API-Key"] = k; return h; };
    let resp = await fetch(`${API_BASE}/rag/query/stream`, { method: "POST", headers: makeHeaders(), signal: askAbort.signal, body: JSON.stringify(body) });
    if (resp.status === 401) { try { await refreshToken(); resp = await fetch(`${API_BASE}/rag/query/stream`, { method: "POST", headers: makeHeaders(), signal: askAbort.signal, body: JSON.stringify(body) }); } catch (e) { throw { detail: "登录已过期,请重新登录" }; } }
    if (!resp.ok) { const t = await resp.text().catch(() => ""); throw { detail: (t || resp.statusText).slice(0, 300) }; }
    const last = turns[turns.length - 1];
    last.a = "";
    const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n\n"); buf = parts.pop();
      for (const part of parts) {
        const ev = (part.match(/^event: (.+)$/m) || [, "content"])[1];
        const data = JSON.parse((part.match(/^data: (.+)$/m) || [, "{}"])[1]);
        if (ev === "citations") { last.citations = Array.isArray(data) ? data : []; }
        else if (ev === "content") { last.pending = false; last.a += data.data || ""; }
        else if (ev === "done") { last.retrieval_count = data.retrieval_count ?? last.citations.length; last.latency_ms = data.latency_ms ?? data.latency; if (data.session_id) { session = { session_id: data.session_id, ds }; saveSession(); } }
        else if (ev === "error") { last.pending = false; last.a = "❌ " + (data.error || "流式错误"); }
        renderThread();
      }
    }
    last.pending = false;
    if (!last.a) last.a = "(无回答)";
    renderThread();
    $("#kgSubPanel").style.display = "";
    $("#kgSubMeta").textContent = "基于问题的实体子图";
    renderKgSubgraph($("#kgSub"), { dataset: ds, query: question, limit: 30 });
  } catch (e) {
    const last = turns[turns.length - 1];
    last.pending = false;
    if (askAbort?.signal.aborted) { last.a = "（已取消）"; }
    else { const msg = String(e?.detail || e?.message || e).slice(0, 200); last.a = "❌ 查询失败:" + msg; toast("RAG 查询失败", "danger"); }
    renderThread();
  } finally { askAbort = null; btn.disabled = false; btn.textContent = "提问"; }
}

loadDatasets(); loadTemplates();
window.applyIcons && applyIcons(document);
</script>
</body>
</html>
