{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "arrow-lake.fullname" . }}
  labels:
    {{- include "arrow-lake.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "arrow-lake.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Ray pods to access API server
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ray
      ports:
        - port: {{ .Values.observability.metricsPort }}
          protocol: TCP
    # Allow monitoring stack (Prometheus) to scrape metrics
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: {{ .Values.observability.metricsPort }}
          protocol: TCP
    {{- if .Values.networkPolicy.allowExternal }}
    # Allow external traffic if enabled
    - from: []
      ports:
        - port: {{ .Values.observability.metricsPort }}
          protocol: TCP
    {{- end }}
  egress:
    # Allow outbound to storage (MinIO / S3)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 9000
          protocol: TCP
    # Allow DNS resolution
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
