storage:
  backend: s3
  s3_endpoint: ""  # use default AWS S3
  s3_region: "us-east-1"

compute:
  gpu_enabled: true
  num_workers: 8

observability:
  metrics_enabled: true
  metrics_port: 8000
  log_level: WARNING

quality:
  enabled: true
  filter_mode: all
  schema_validation: strict
  dead_letter_enabled: true
  text_min_chars: 1
  image_min_width: 128
  image_min_height: 128
