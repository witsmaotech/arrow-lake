name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check arrow_lake/ tests/

      - name: Ruff format check
        run: uv run ruff format --check arrow_lake/ tests/

      - name: MyPy type check
        run: uv run mypy arrow_lake/ --ignore-missing-imports

      - name: Security scan (bandit)
        run: uv run bandit -r arrow_lake/ -ll

      - name: Validate compose configs
        working-directory: deploy
        run: |
          for combo in "" "dev" "gpu" "monitoring" "hugegraph"; do
            echo "=== Validating: $combo ==="
            if [ -z "$combo" ]; then
              docker compose config --quiet
            else
              docker compose -f docker-compose.yml -f docker-compose.${combo}.yml --profile ${combo%%.*} config --quiet
            fi
          done

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --cov=arrow_lake --cov-report=term-missing --cov-fail-under=80

      - name: Run integration tests (CPU only)
        run: uv run pytest tests/integration/ -v --tb=short -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

