<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>清洗整理 · Arrow Lake Console</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css"/>
<link rel="stylesheet" href="assets/app.css"/>
<link rel="stylesheet" href="assets/console.css"/>
<style>
  .tidy-layout{display:grid;grid-template-columns:260px 1fr;gap:var(--s4);align-items:start}
  .tidy-side{display:flex;flex-direction:column;gap:var(--s3)}
  .op-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line-soft);border-radius:var(--r-md);background:var(--ink-900);cursor:pointer;font-size:.82rem;color:var(--fg-md);transition:all .14s;text-align:left;width:100%;font-family:inherit;position:relative}
  .op-btn:hover{border-color:var(--teal-bright);color:var(--fg-hi)}
  .op-btn.active{border-color:var(--teal-bright);background:rgba(20,184,166,.08);color:var(--fg-hi)}
  .op-btn.enabled::after{content:"";position:absolute;top:11px;right:12px;width:7px;height:7px;border-radius:50%;background:var(--teal-bright);box-shadow:0 0 6px var(--teal-bright)}
  .op-btn .op-ic{width:26px;height:26px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--ink-800);flex-shrink:0;color:var(--teal-bright);cursor:pointer}
  .op-btn .op-ic:hover{background:var(--teal-bright);color:var(--ink-950)}
  .op-btn .op-ic svg{width:15px;height:15px}
  .op-btn .op-t{font-weight:600;display:block;font-size:.8rem}
  .op-btn .op-s{font-size:.66rem;color:var(--fg-lo);display:block;margin-top:1px}
  .op-grp-title{font-size:.66rem;color:var(--fg-lo);text-transform:uppercase;letter-spacing:.05em;margin:8px 2px 4px}
  .cfg-row{display:grid;gap:6px;margin-bottom:10px}
  .cfg-row label{font-size:.68rem;color:var(--fg-lo);text-transform:uppercase;letter-spacing:.04em}
  .res-tbl{width:100%;border-collapse:collapse;font-size:.76rem}
  .res-tbl th{text-align:left;padding:7px 9px;background:var(--ink-850);color:var(--fg-lo);font-weight:600;border-bottom:1px solid var(--line);font-size:.66rem;text-transform:uppercase;letter-spacing:.04em}
  .res-tbl td{padding:7px 9px;border-bottom:1px solid var(--line-soft);color:var(--fg-md);vertical-align:top;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag-pos{color:var(--teal-bright)}.tag-neg{color:var(--danger)}.tag-warn{color:var(--warn)}.tag-neu{color:var(--fg-lo)}
  .bar-track{height:7px;background:var(--ink-850);border-radius:4px;overflow:hidden}
  .bar-track>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal-bright),var(--info));width:40%;transition:width .3s}
  @media(max-width:1024px){.tidy-layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
<main class="main"><div class="page">
  <div class="h-sec between">
    <div><h1>清洗整理</h1><div class="desc">结构化数据 → 画像诊断 / 变换 / 规则校验 / 过滤 → <b>更新写回</b>(接 <code>/quality/*</code> + <code>/clean</code>)</div></div>
    <div class="flex">
      <label class="flex" style="gap:6px;align-items:center;font-size:.76rem;color:var(--fg-md);cursor:pointer"><input type="checkbox" id="writeBack" style="accent-color:var(--teal-bright)"> 写回</label>
      <button class="btn btn-primary btn-sm" id="runPipe"><i class="placeholder" data-ic="play"></i> 运行管道</button>
    </div>
  </div>

  <div class="panel flush" style="margin-bottom:var(--s4)">
    <div class="panel-h"><i class="placeholder" data-ic="database"></i><h3>数据源</h3><span class="sub" id="dsMeta">—</span></div>
    <div class="panel-b" style="padding:12px">
      <select class="select" id="dsSel" style="width:100%;max-width:440px"><option value="">加载数据集…</option></select>
    </div>
  </div>

  <div class="tidy-layout">
    <aside class="tidy-side">
      <div class="panel flush">
        <div class="panel-h"><h3 style="margin:0">算子</h3><span class="sub">点行配置 · 变换类点图标启用</span></div>
        <div class="panel-b" id="opList" style="padding:8px;display:flex;flex-direction:column;gap:5px"></div>
      </div>
    </aside>
    <div class="col">
      <div class="panel flush">
        <div class="panel-h"><h3 id="opTitle" style="margin:0">数据画像</h3><span class="sub" id="opSub">列级统计</span><span class="actions"><button class="btn btn-primary btn-sm" id="runOp"><i class="placeholder" data-ic="play"></i> 运行</button></span></div>
        <div class="panel-b" id="cfgArea" style="padding:14px"></div>
      </div>
      <div class="panel flush" style="margin-top:var(--s4)">
        <div class="panel-h"><h3 style="margin:0">结果</h3><span class="actions"><span class="muted mono" id="resMeta" style="font-size:.7rem">待运行</span></span></div>
        <div class="panel-b" id="resArea" style="padding:14px;min-height:80px"><div class="muted" style="text-align:center;padding:20px">选择算子并运行,查看真实结果</div></div>
      </div>
    </div>
  </div>
</div></main>
</div>
<script src="assets/console-layout.js"></script>
<script type="module">
import { request } from "./src/api.js";
import { isLoggedIn } from "./src/auth.js";
import { toast } from "./src/ui/toast.js";

if (!isLoggedIn()) location.href = "login.html";
const { renderShell } = window;
renderShell({ active: "tidy", crumb: "<b>清洗整理</b>" });
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ds = () => $("#dsSel").value || new URLSearchParams(location.search).get("ds") || "";
const enabled = new Set();

// 算子图标(内联 svg,console-layout 图标集不够)
const IC = {
  profile: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  cast: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6L4 12l5 6M15 6l5 6-5 6"/></svg>',
  missing: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  dedup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  outlier: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>',
  column: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="9" width="6" height="6" rx="1"/><rect x="16" y="4" width="6" height="6" rx="1"/><rect x="16" y="14" width="6" height="6" rx="1"/><path d="M8 12h4V7h4M12 12v5h4"/></svg>',
  map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7v5l9 9 5-5-9-9z"/><circle cx="7.5" cy="7.5" r="1"/></svg>',
  normalize: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></svg>',
  validate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  filter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>',
};

// 10 算子:g=diag(检测只读,quality 端点) / tx(变换可写回,clean 端点)
const OPS = [
  { id: "profile", g: "diag", t: "数据画像", s: "列级统计 · 质量分", ic: "profile",
    cfg: `<div class="muted" style="font-size:.78rem;line-height:1.6">扫描每列:推断类型 / 缺失率 / 唯一值 / 最小最大 / 直方图。不改数据,先诊断。<br>对应 <code>GET /quality/profile</code>。</div>` },
  { id: "report", g: "diag", t: "质量报告", s: "整体质量评分", ic: "profile",
    cfg: `<div class="muted" style="font-size:.78rem;line-height:1.6">整体质量报告(默认 filter 集)。对应 <code>GET /quality/report</code>。</div>` },
  { id: "dedup", g: "diag", t: "去重检测", s: "主键/内容重复", ic: "dedup",
    cfg: `<div class="cfg-row" style="grid-template-columns:1fr 1fr"><div><label>策略</label><select class="select" data-k="strategy"><option value="">默认</option><option value="exact">exact</option><option value="content">content</option></select></div>
      <div><label>动作</label><select class="select" data-k="action"><option value="">报告</option><option value="reject">reject</option><option value="flag">flag</option></select></div></div>
      <div class="muted" style="font-size:.74rem">检测重复行(只读)。对应 <code>POST /quality/deduplicate</code>。</div>` },
  { id: "validate", g: "diag", t: "规则校验", s: "断言式质检", ic: "validate",
    cfg: `<div class="cfg-row"><label>规则(JSON 数组)</label><textarea class="input mono" data-k="rules" style="min-height:96px;font-size:.72rem">[
  {"name":"amount_pos","column":"amount","check":"range","params":{"min":0},"action":"flag","message":"金额应非负"},
  {"name":"status_enum","column":"status","check":"regex","params":{"pattern":"shipped|pending|completed"},"action":"flag","message":"status 非法"}
]</textarea></div>
      <div class="muted" style="font-size:.74rem">check ∈ length|range|regex|duplicate;action ∈ reject|flag|remove。对应 <code>POST /quality/rules</code>。</div>` },
  { id: "filter", g: "diag", t: "过滤检测", s:"按条件查", ic: "filter",
    cfg: `<div class="cfg-row" style="grid-template-columns:2fr 1fr"><div><label>active_filters</label><input class="input mono" data-k="active_filters" placeholder="如 amount_range"></div>
      <div><label>mode</label><select class="select" data-k="mode"><option value="all">all</option><option value="any">any</option></select></div></div>
      <div class="muted" style="font-size:.74rem">检测符合 filter 的行(只读)。对应 <code>POST /quality/filter</code>。</div>` },
  { id: "cast", g: "tx", t: "类型规整", s: "串→日期/数字", ic: "cast",
    cfg: `<div class="cfg-row" style="grid-template-columns:1fr 1fr"><div><label>列</label><input class="input mono" data-k="column" value="amount"></div>
      <div><label>目标类型</label><select class="select" data-k="dtype"><option>DOUBLE</option><option>INTEGER</option><option>DATE</option><option>VARCHAR</option><option>BOOLEAN</option></select></div></div>
      <div class="muted" style="font-size:.74rem">对应 clean step <code>cast</code>。</div>` },
  { id: "missing", g: "tx", t: "缺失值", s: "填充空值", ic: "missing",
    cfg: `<div class="cfg-row" style="grid-template-columns:1fr 1fr"><div><label>列</label><input class="input mono" data-k="column" value="amount"></div>
      <div><label>填充值</label><input class="input mono" data-k="value" value="0"></div></div>
      <div class="muted" style="font-size:.74rem">对应 clean step <code>fillna</code>(COALESCE)。</div>` },
  { id: "outlier", g: "tx", t: "异常值过滤", s: "范围删行(写回)", ic: "outlier",
    cfg: `<div class="cfg-row" style="grid-template-columns:1fr 1fr 1fr"><div><label>列</label><input class="input mono" data-k="column" value="amount"></div>
      <div><label>op</label><select class="select" data-k="op"><option>></option><option>>=</option><option>&lt;</option><option>&lt;=</option><option>=</option><option>!=</option></select></div>
      <div><label>阈值</label><input class="input mono" data-k="value" value="100000"></div></div>
      <div class="muted" style="font-size:.74rem">删除满足条件的行(outlier)。作为 clean <code>filter</code> 写回生效。</div>` },
  { id: "column", g: "tx", t: "列操作", s: "拆分/合并/改名/删", ic: "column",
    cfg: `<div class="cfg-row"><label>操作</label><select class="select" id="colOp"><option value="split">拆分 split</option><option value="concat">合并 concat</option><option value="rename">改名 rename</option><option value="drop">删除 drop</option></select></div>
      <div class="cfg-row" style="grid-template-columns:1fr 1fr"><div><label>列</label><input class="input mono" data-k="column" value="customer"></div>
      <div><label>参数</label><input class="input mono" data-k="params" value="sep=/ index=1 as=contact"></div></div>
      <div class="muted" style="font-size:.74rem">split:sep/index/as;concat:columns=a,b/as;rename:to=新名;drop:仅填列。</div>` },
  { id: "map", g: "tx", t: "值映射", s: "枚举统一", ic: "map",
    cfg: `<div class="cfg-row"><label>列</label><input class="input mono" data-k="column" value="status"></div>
      <div class="cfg-row"><label>mapping(JSON)</label><textarea class="input mono" data-k="mapping" style="min-height:64px;font-size:.72rem">{"已发货":"shipped","SHIPPED":"shipped","已完成":"completed"}</textarea></div>
      <div class="cfg-row"><label>default</label><input class="input mono" data-k="default" value="unknown"></div>` },
  { id: "normalize", g: "tx", t: "标准化", s: "trim/lower/regex", ic: "normalize",
    cfg: `<div class="cfg-row" style="grid-template-columns:1fr 1fr"><div><label>列</label><input class="input mono" data-k="column" value="region"></div>
      <div><label>操作</label><select class="select" data-k="nop"><option value="trim">trim 去空白</option><option value="lower">lower 小写</option><option value="upper">upper 大写</option><option value="regex">regex_replace</option></select></div></div>
      <div class="cfg-row" id="regexRow" style="display:none;grid-template-columns:1fr 1fr"><div><label>pattern</label><input class="input mono" data-k="pattern" value="\\s+"></div>
      <div><label>replacement</label><input class="input mono" data-k="replacement" value=" "></div></div>` },
];

let activeId = "profile";

function renderOpList() {
  const groups = { diag: "诊断·检测(只读)", tx: "变换(可写回)" };
  $("#opList").innerHTML = Object.keys(groups).map((g) => {
    const items = OPS.filter((o) => o.g === g);
    return `<div class="op-grp-title">${groups[g]}</div>` + items.map((o) => `
      <button class="op-btn ${o.id === activeId ? "active" : ""} ${enabled.has(o.id) ? "enabled" : ""}" data-op="${o.id}">
        <span class="op-ic">${IC[o.ic] || IC.profile}</span>
        <span><span class="op-t">${o.t}</span><span class="op-s">${o.s}</span></span>
      </button>`).join("");
  }).join("");
  $("#opList").querySelectorAll(".op-btn").forEach((b) => b.addEventListener("click", (e) => {
    const op = OPS.find((o) => o.id === b.dataset.op);
    if (e.target.closest(".op-ic") && op.g === "tx") {
      const id = b.dataset.op;
      enabled.has(id) ? enabled.delete(id) : enabled.add(id);
      renderOpList();
      return;
    }
    activeId = b.dataset.op;
    renderOpList();
    renderCfg();
  }));
}

function renderCfg() {
  const op = OPS.find((o) => o.id === activeId);
  $("#opTitle").textContent = op.t;
  $("#opSub").textContent = op.s;
  $("#cfgArea").innerHTML = op.cfg;
  if (op.id === "normalize") {
    const sel = $("#cfgArea [data-k=nop]");
    const row = $("#regexRow");
    sel?.addEventListener("change", () => { row.style.display = sel.value === "regex" ? "grid" : "none"; });
  }
}

function cfgVals() {
  const v = {};
  $("#cfgArea").querySelectorAll("[data-k]").forEach((el) => {
    const k = el.dataset.k;
    if (k === "rules" || k === "mapping") { try { v[k] = JSON.parse(el.value); } catch (_) { v[k] = el.value; } }
    else v[k] = el.value;
  });
  return v;
}

function num(v) { const n = Number(v); return isNaN(n) ? v : n; }
function parseKv(s) { const o = {}; String(s || "").split(/\s+/).forEach((t) => { const [k, ...r] = t.split("="); if (k) o[k] = r.join("="); }); return o; }

// 变换算子 → clean steps/filters
function buildTxReq(opId) {
  const v = cfgVals();
  const col = v.column;
  if (opId === "cast") return { steps: [{ type: "cast", column: col, params: { dtype: v.dtype } }] };
  if (opId === "missing") return { steps: [{ type: "fillna", column: col, params: { value: num(v.value) } }] };
  if (opId === "outlier") return { steps: [], filters: [{ column: col, op: v.op, value: num(v.value) }] };
  if (opId === "column") {
    const p = parseKv(v.params);
    const cop = $("#colOp").value;
    if (cop === "split") return { steps: [{ type: "split", column: col, params: { sep: p.sep || "/", index: Number(p.index || 1), as: p.as } }] };
    if (cop === "concat") return { steps: [{ type: "concat", params: { columns: (p.columns || col).split(",").map((s) => s.trim()), sep: p.sep || " ", as: p.as } }] };
    if (cop === "rename") return { steps: [{ type: "rename", column: col, params: { to: p.to } }] };
    if (cop === "drop") return { steps: [{ type: "drop", column: col }] };
  }
  if (opId === "map") return { steps: [{ type: "case", column: col, params: { mapping: v.mapping || {}, default: v.default } }] };
  if (opId === "normalize") {
    if (v.nop === "regex") return { steps: [{ type: "regex_replace", column: col, params: { pattern: v.pattern, replacement: v.replacement } }] };
    return { steps: [{ type: v.nop, column: col }] };
  }
  return { steps: [] };
}

async function runDiag(id, name) {
  if (id === "profile") return request("GET", `/datasets/${encodeURIComponent(name)}/quality/profile`);
  if (id === "report") return request("GET", `/datasets/${encodeURIComponent(name)}/quality/report`);
  if (id === "dedup") { const v = cfgVals(); return request("POST", `/datasets/${encodeURIComponent(name)}/quality/deduplicate`, { body: { strategy: v.strategy || null, action: v.action || null } }); }
  if (id === "validate") { const v = cfgVals(); return request("POST", `/datasets/${encodeURIComponent(name)}/quality/rules`, { body: { rules: Array.isArray(v.rules) ? v.rules : [] } }); }
  if (id === "filter") { const v = cfgVals(); return request("POST", `/datasets/${encodeURIComponent(name)}/quality/filter`, { body: { active_filters: v.active_filters || "", mode: v.mode || "all" } }); }
}

function escTbl(rows, cols) {
  if (!rows || !rows.length) return `<div class="muted" style="padding:14px;text-align:center">无数据</div>`;
  const ks = cols.length ? cols : Object.keys(rows[0]);
  return `<div style="overflow-x:auto"><table class="res-tbl"><thead><tr>${ks.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${ks.map((c) => `<td title="${esc(r[c])}">${esc(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function renderDiag(id, data) {
  if (id === "profile") {
    const d = data?.data || {};
    $("#dsMeta").textContent = `${d.total_rows ?? "?"} 行 · ${d.total_columns ?? "?"} 列 · 质量 ${d.overall_quality_score ?? "?"}`;
    return `<div class="muted" style="font-size:.74rem;margin-bottom:8px">${esc(d.dataset_name)} · ${d.total_rows} 行 · 质量分 ${d.overall_quality_score}</div>` + escTbl(d.columns || [], ["name", "dtype", "null_percentage", "unique_count", "min_value", "max_value"]);
  }
  if (id === "validate") {
    const rs = data?.results || [];
    const head = `<div class="muted" style="font-size:.74rem;margin-bottom:8px">应用 ${data?.applied_rules ?? 0} 条 · 影响 ${data?.total_affected_rows ?? 0} 行</div>`;
    return head + (rs.length ? escTbl(rs, ["rule_name", "action", "affected_count", "message"]) : `<div class="muted" style="padding:14px;text-align:center">无违反</div>`);
  }
  // report / dedup / filter → report dict
  const r = data?.report || data || {};
  return `<pre style="background:var(--ink-950);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;font-family:var(--font-mono);font-size:.72rem;color:var(--fg-md);overflow:auto;white-space:pre-wrap;max-height:420px">${esc(JSON.stringify(r, null, 2))}</pre>`;
}

function renderClean(data, wb) {
  const head = `<div class="muted" style="font-size:.74rem;margin-bottom:8px">输入 ${data?.input_rows ?? "?"} → 输出 ${data?.output_rows ?? "?"} 行${wb ? ` · <span class="tag-pos">已写回</span>` : " · 预览(未写回)"}</div>`;
  return head + escTbl(data?.preview || [], data?.columns || []);
}

async function runOp() {
  const name = ds();
  if (!name) { toast("先选数据集", "warn"); return; }
  const op = OPS.find((o) => o.id === activeId);
  const wb = $("#writeBack").checked;
  $("#resMeta").textContent = "运行中…";
  $("#resArea").innerHTML = `<div class="bar-track"><i></i></div>`;
  try {
    let html;
    if (op.g === "diag") {
      const data = await runDiag(op.id, name);
      html = renderDiag(op.id, data);
      $("#resMeta").textContent = `${op.t} ✓`;
    } else {
      const body = buildTxReq(op.id);
      body.write_back = wb;
      const data = await request("POST", `/datasets/${encodeURIComponent(name)}/clean`, { body });
      html = renderClean(data, wb);
      $("#resMeta").textContent = `${op.t} ${wb ? "· 已写回" : "· 预览"}`;
    }
    $("#resArea").innerHTML = html;
    toast(`${op.t} 完成${wb && op.g === "tx" ? "(已写回 " + name + ")" : ""}`, "ok");
  } catch (e) {
    const msg = e?.detail || e?.message || String(e);
    $("#resArea").innerHTML = `<div style="padding:14px;color:var(--danger)">失败:${esc(msg)}<br/><button class="btn btn-ghost btn-sm" id="retry" style="margin-top:8px">重试</button></div>`;
    $("#retry")?.addEventListener("click", runOp);
    $("#resMeta").textContent = "失败";
    toast(op.t + " 失败:" + msg, "warn", 4000);
  }
}

$("#runOp").addEventListener("click", runOp);

// 运行管道:所有启用的变换算子 → 一次 /clean(write_back)
$("#runPipe").addEventListener("click", async () => {
  const name = ds();
  if (!name) { toast("先选数据集", "warn"); return; }
  if (enabled.size === 0) { toast("先启用至少一个变换算子(点算子图标)", "warn", 4000); return; }
  const wb = $("#writeBack").checked;
  const steps = [], filters = [];
  const ids = [...enabled];
  const savedActive = activeId;
  for (const id of ids) { activeId = id; renderCfg(); const r = buildTxReq(id); steps.push(...(r.steps || [])); filters.push(...(r.filters || [])); }
  activeId = savedActive; renderOpList(); renderCfg();
  $("#resMeta").textContent = "运行管道…";
  $("#resArea").innerHTML = `<div class="bar-track"><i></i></div>`;
  try {
    const data = await request("POST", `/datasets/${encodeURIComponent(name)}/clean`, { body: { steps, filters, write_back: wb } });
    $("#resArea").innerHTML = `<div class="muted" style="font-size:.74rem;margin-bottom:8px">管道 ${ids.length} 算子 · 输入 ${data?.input_rows} → 输出 ${data?.output_rows}${wb ? ` · <span class="tag-pos">已写回 ${esc(name)}</span>` : " · 预览"}</div>` + escTbl(data?.preview || [], data?.columns || []);
    $("#resMeta").textContent = `管道 ✓ ${ids.length} 算子`;
    toast(`管道完成(${ids.length} 算子)${wb ? " · 已写回" : ""}`, "ok");
  } catch (e) {
    const msg = e?.detail || e?.message || String(e);
    $("#resArea").innerHTML = `<div style="padding:14px;color:var(--danger)">管道失败:${esc(msg)}</div>`;
    $("#resMeta").textContent = "失败";
    toast("管道失败:" + msg, "warn", 4000);
  }
});

async function loadDatasets() {
  try {
    const data = await request("GET", "/datasets?limit=1000");
    const list = data?.datasets || [];
    const cur = new URLSearchParams(location.search).get("ds");
    $("#dsSel").innerHTML = list.length
      ? list.map((d) => `<option value="${esc(d.name)}"${d.name === cur ? " selected" : ""}>${esc(d.name)} · ${(d.num_rows ?? 0).toLocaleString()} 行</option>`).join("")
      : `<option value="">(无数据集)</option>`;
    if ($("#dsSel").value) $("#dsMeta").textContent = `已选:${$("#dsSel").value}`;
    $("#dsSel").addEventListener("change", () => { $("#dsMeta").textContent = $("#dsSel").value ? `已选:${$("#dsSel").value}` : "—"; });
  } catch (e) {
    toast("数据集列表加载失败:" + (e?.detail || e?.message), "warn", 4000);
    $("#dsMeta").textContent = "数据集加载失败";
  }
}

renderOpList();
renderCfg();
loadDatasets();
</script>
</body>
</html>
