# ==============================================================================
# MS4 标注闭环(W1.1 / F4.1)— Label Studio CE,独立 profile(不进默认栈)
#
# ⚠️ 红线(设计 v1.1 §0):LS 是 transient 工作区,非 SoT——标注真值落
# Lance ADL;本容器可随时销毁重建。与 ingest/query 热路径零耦合(DR6)。
#
# 启动(叠加 prod_minimal,同项目共享网络/MinIO):
#   docker compose --project-directory deploy -p arrow-lake \
#     -f docker-compose.prod_minimal.yml -f docker-compose.annotation.yml \
#     --profile annotation up -d label-studio
# 默认栈(`-f docker-compose.prod_minimal.yml up`)不启动 LS(profile 隔离)。
#
# 认证(D1):首次部署经 LS UI(127.0.0.1:8085)手动创建 admin 账号 →
# Account & Settings → Personal Access Token → 写入 deploy/.env 的
# LABEL_STUDIO_API_TOKEN(W2 dispatch 用;凭据不入 compose)。
# ==============================================================================

services:
  label-studio:
    image: heartexlabs/label-studio:1.13.1   # S1 评审定版
    container_name: arrow-lake-label-studio
    init: true                                # reap healthcheck 孤儿(速查坑)
    ports:
      - "127.0.0.1:8085:8080"                 # 内网段,不暴露公网(DR6 旁路)
    environment:
      LABEL_STUDIO_HOST: localhost
      # S3 source storage(脱敏任务文件经 MinIO 中转;W2 接 source storage 时用)
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in deploy/.env}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/.env}
      S3_BUCKET: arrow-lake-annotation        # 独立桶,与主数据桶物理隔离(S7)
      # LS 容器只连内部 minio,不走代理(gravitino 死代理教训)
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    volumes:
      - ls-data:/label-studio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - arrow-lake-net

volumes:
  ls-data:

networks:
  arrow-lake-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16   # 与 prod_minimal 同网段(叠加时同一定义幂等合并)
