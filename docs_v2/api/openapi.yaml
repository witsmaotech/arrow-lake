components:
  schemas:
    AclDeleteResponse:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        dataset:
          type: string
          title: Dataset
        role:
          type: string
          title: Role
        deleted:
          type: boolean
          title: Deleted
          default: false
      type: object
      required:
      - dataset
      - role
      title: AclDeleteResponse
      description: Response for deleting an ACL.
    AclEntry:
      properties:
        role:
          type: string
          title: Role
        visible_columns:
          items:
            type: string
          type: array
          title: Visible Columns
          default: []
        row_filter:
          type: string
          title: Row Filter
          default: ''
      type: object
      required:
      - role
      title: AclEntry
      description: A single ACL entry.
    AclListResponse:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        dataset:
          type: string
          title: Dataset
        acls:
          items:
            $ref: '#/components/schemas/AclEntry'
          type: array
          title: Acls
      type: object
      required:
      - dataset
      title: AclListResponse
      description: Response for listing ACLs on a dataset.
    AclSetResponse:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        dataset:
          type: string
          title: Dataset
        role:
          type: string
          title: Role
      type: object
      required:
      - dataset
      - role
      title: AclSetResponse
      description: Response for setting an ACL.
    AuditExportResponse:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        export:
          additionalProperties: true
          type: object
          title: Export
      type: object
      required:
      - export
      title: AuditExportResponse
    AuditQueryResponse:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        entries:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Entries
      type: object
      required:
      - entries
      title: AuditQueryResponse
    AuditRecordRequest:
      properties:
        event_type:
          type: string
          minLength: 1
          title: Event Type
        dataset_name:
          type: string
          title: Dataset Name
          default: ''
        actor:
          type: string
          title: Actor
          default: system
        lance_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Lance Version
        metaflow_run_id:
          type: string
          title: Metaflow Run Id
          default: ''
        metaflow_tags:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Metaflow Tags
        payload:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Payload
      type: object
      required:
      - event_type
      title: AuditRecordRequest
    AuditRecordResponse:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        audit_id:
          type: string
          title: Audit Id
      type: object
      required:
      - audit_id
      title: AuditRecordResponse
    AuditVerifyResponse:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        intact:
          type: boolean
          title: Intact
      type: object
      required:
      - intact
      title: AuditVerifyResponse
    BackupInfoResponse:
      properties:
        backup_id:
          type: string
          title: Backup Id
        created_at:
          type: string
          title: Created At
        datasets:
          items:
            type: string
          type: array
          title: Datasets
        blob_prefixes:
          items:
            type: string
          type: array
          title: Blob Prefixes
        total_size_bytes:
          type: integer
          title: Total Size Bytes
        status:
          type: string
          title: Status
      type: object
      required:
      - backup_id
      - created_at
      - datasets
      - blob_prefixes
      - total_size_bytes
      - status
      title: BackupInfoResponse
      description: Response model for backup metadata.
    BackupListResponse:
      properties:
        backups:
          items:
            $ref: '#/components/schemas/BackupInfoResponse'
          type: array
          title: Backups
        count:
          type: integer
          title: Count
      type: object
      required:
      - backups
      - count
      title: BackupListResponse
      description: Response model for listing backups.
    Body_upload_files_api_v1_datasets__name__upload_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          maxItems: 20
          title: Files
      type: object
      required:
      - files
      title: Body_upload_files_api_v1_datasets__name__upload_post
    CleanupResponse:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        deleted_count:
          type: integer
          title: Deleted Count
          default: 0
      type: object
      title: CleanupResponse
      description: Response for upload blob cleanup.
    CreateBackupRequest:
      properties:
        dataset_names:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Dataset Names
          description: Datasets to backup
        blob_prefixes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Blob Prefixes
          description: S3 prefixes to backup
        backup_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Backup Id
          description: Custom backup ID
      type: object
      title: CreateBackupRequest
      description: Request body for creating a backup.
    DaftExplodeStep:
      properties:
        columns:
          items:
            type: string
          type: array
          minItems: 1
          title: Columns
      type: object
      required:
      - columns
      title: DaftExplodeStep
      description: Explode list column(s) into rows.
    DaftFilterStep:
      properties:
        column:
          type: string
          title: Column
        op:
          type: string
          enum:
          - eq
          - ne
          - gt
          - gte
          - lt
          - lte
          - is_null
          - is_not_null
          title: Op
        value:
          title: Value
      type: object
      required:
      - column
      - op
      title: DaftFilterStep
      description: Filter rows by column conditions.
    DaftGroupByStep:
      properties:
        columns:
          items:
            type: string
          type: array
          minItems: 1
          title: Columns
        agg:
          type: string
          enum:
          - sum
          - mean
          - count
          - min
          - max
          - stddev
          - var
          title: Agg
          default: sum
      type: object
      required:
      - columns
      title: DaftGroupByStep
      description: Group by columns then aggregate.
    DaftJoinStep:
      properties:
        dataset:
          type: string
          title: Dataset
        'on':
          type: string
          title: 'On'
        how:
          type: string
          enum:
          - inner
          - left
          - outer
          title: How
          default: inner
      type: object
      required:
      - dataset
      - 'on'
      title: DaftJoinStep
      description: Join with another dataset.
    DaftPivotStep:
      properties:
        group_by:
          type: string
          title: Group By
        pivot_col:
          type: string
          title: Pivot Col
        value_col:
          type: string
          title: Value Col
        agg_fn:
          type: string
          enum:
          - sum
          - mean
          - count
          - min
          - max
          - first
          - last
          title: Agg Fn
          default: sum
      type: object
      required:
      - group_by
      - pivot_col
      - value_col
      title: DaftPivotStep
      description: Pivot column into wide format.
    DaftQueryRequest:
      properties:
        columns:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Columns
        sort:
          anyOf:
          - $ref: '#/components/schemas/DaftSortStep'
          - type: 'null'
        filters:
          anyOf:
          - items:
              $ref: '#/components/schemas/DaftFilterStep'
            type: array
          - type: 'null'
          title: Filters
        groupby:
          anyOf:
          - $ref: '#/components/schemas/DaftGroupByStep'
          - type: 'null'
        join:
          anyOf:
          - $ref: '#/components/schemas/DaftJoinStep'
          - type: 'null'
        sql:
          anyOf:
          - $ref: '#/components/schemas/DaftSqlStep'
          - type: 'null'
        pivot:
          anyOf:
          - $ref: '#/components/schemas/DaftPivotStep'
          - type: 'null'
        explode:
          anyOf:
          - $ref: '#/components/schemas/DaftExplodeStep'
          - type: 'null'
        sample:
          anyOf:
          - $ref: '#/components/schemas/DaftSampleStep'
          - type: 'null'
        distinct:
          type: boolean
          title: Distinct
          default: false
        offset:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Offset
        limit:
          type: integer
          minimum: 1.0
          title: Limit
          default: 10000
        max_rows:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Max Rows
        format:
          type: string
          enum:
          - arrow_ipc
          - json
          title: Format
          default: json
      type: object
      title: DaftQueryRequest
      description: 'Daft DataFrame query with chained operations.


        Operations execute in order: sort → filter → groupby → join → sql →

        pivot → explode → sample → distinct → select → offset → limit → collect.'
    DaftQueryResponse:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        format:
          type: string
          title: Format
        row_count:
          type: integer
          title: Row Count
        column_count:
          type: integer
          title: Column Count
        data:
          anyOf:
          - type: string
          - type: 'null'
          title: Data
        rows:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Rows
        warnings:
          items:
            type: string
          type: array
          title: Warnings
          default: []
      type: object
      required:
      - format
      - row_count
      - column_count
      title: DaftQueryResponse
    DaftSampleStep:
      properties:
        fraction:
          anyOf:
          - type: number
            maximum: 1.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Fraction
        size:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Size
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
      type: object
      title: DaftSampleStep
      description: Random sample of rows.
    DaftSortStep:
      properties:
        column:
          type: string
          title: Column
        desc:
          type: boolean
          title: Desc
          default: false
      type: object
      required:
      - column
      title: DaftSortStep
      description: Sort by a column.
    DaftSqlStep:
      properties:
        query:
          type: string
          maxLength: 10000
          minLength: 1
          title: Query
      type: object
      required:
      - query
      title: DaftSqlStep
      description: Execute SQL query against current frame (bound as ``self``).
    DatasetInfo:
      properties:
        name:
          type: string
          title: Name
        version:
          type: integer
          title: Version
          default: 0
        num_rows:
          type: integer
          title: Num Rows
          default: 0
      type: object
      required:
      - name
      title: DatasetInfo
      description: Metadata for a single dataset.
    DatasetListResponse:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        datasets:
          items:
            $ref: '#/components/schemas/DatasetInfo'
          type: array
          title: Datasets
        total:
          type: integer
          title: Total
          default: 0
      type: object
      title: DatasetListResponse
      description: Response for listing all datasets.
    DedupRequest:
      properties:
        strategy:
          anyOf:
          - type: string
          - type: 'null'
          title: Strategy
        action:
          anyOf:
          - type: string
          - type: 'null'
          title: Action
        perceptual_threshold:
          anyOf:
          - type: integer
          - type: 'null'
          title: Perceptual Threshold
      type: object
      title: DedupRequest
    DedupResponse:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        report:
          additionalProperties: true
          type: object
          title: Report
      type: object
      required:
      - report
      title: DedupResponse
    EmbeddingResponse:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        embeddings:
          items:
            items:
              type: number
            type: array
          type: array
          title: Embeddings
        embedding_dim:
          type: integer
          title: Embedding Dim
          default: 0
        model:
          type: string
          title: Model
          default: ''
        total:
          type: integer
          title: Total
          default: 0
        null_count:
          type: integer
          title: Null Count
          default: 0
      type: object
      title: EmbeddingResponse
    EnsembleSearchRequest:
      properties:
        format:
          type: string
          enum:
          - arrow_ipc
          - json
          title: Format
          description: 'Response format: ''arrow_ipc'' (base64 IPC stream) or ''json''
            (rows list)'
          default: json
        query_vector:
          items:
            type: number
          type: array
          maxItems: 8192
          minItems: 1
          title: Query Vector
        columns:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Columns
        weights:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Weights
        top_k:
          anyOf:
          - type: integer
          - type: 'null'
          title: Top K
        where:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
          title: Where
      type: object
      required:
      - query_vector
      title: EnsembleSearchRequest
    EnsembleSearchResponse:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        format:
          type: string
          title: Format
        row_count:
          type: integer
          title: Row Count
        column_count:
          type: integer
          title: Column Count
        meta:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Meta
        data:
          anyOf:
          - type: string
          - type: 'null'
          title: Data
        rows:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Rows
      type: object
      required:
      - format
      - row_count
      - column_count
      title: EnsembleSearchResponse
    ExportRequest:
      properties:
        output_path:
          type: string
          minLength: 1
          title: Output Path
        format:
          anyOf:
          - type: string
          - type: 'null'
          title: Format
