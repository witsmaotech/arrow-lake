# GPU override for docling table extraction (v1.9.4).
# Opt-in: docker compose -p arrow-lake -f deploy/docker-compose.prod_minimal.yml \
#         -f deploy/docker-compose.gpu.override.yml up -d --force-recreate api
# 给 api 容器 GPU 访问(docling TableFormer 用 GPU,109 页 ~40s)+ 切 docling 后端。
# 宿主需装 nvidia-container-toolkit;镜像内 torch 已是 CUDA 版(torch.version.cuda=13.0)。
services:
  api:
    environment:
      ARROW_LAKE__DOCUMENT__OCR_BACKEND: "docling"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
