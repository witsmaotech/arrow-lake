<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>数据集详情 · Arrow Lake Console</title>
<link rel="stylesheet" href="assets/tokens.css"/>
<link rel="stylesheet" href="assets/app.css"/>
<link rel="stylesheet" href="assets/console.css"/>
<script src="vendor/vis-network.bundle.min.js" defer></script>
<style>
  .schema-chip{display:inline-block;font-family:var(--font-mono);font-size:.72rem;padding:2px 8px;border:1px solid var(--teal-soft,var(--line));border-radius:var(--r-sm);background:var(--ink-900);color:var(--teal-bright);margin:0 4px 4px 0}
  .schema-chip .cm{color:var(--fg-lo);font-style:italic;max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}
  .schema-chip .ic-btn{appearance:none;background:transparent;border:none;color:var(--fg-lo);cursor:pointer;padding:0 0 0 3px;font:inherit;font-size:.74rem;line-height:1;vertical-align:baseline}
  .schema-chip .ic-btn:hover{color:var(--teal-bright)}
  .preview-wrap{overflow:auto;max-height:600px;border:1px solid var(--line-soft);border-radius:var(--r-sm)}
  .preview-wrap table{margin:0}
  .preview-wrap td{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.74rem}
  .preview-wrap th{position:sticky;top:0;background:var(--ink-850);z-index:1;font-size:.7rem}
  .preview-wrap th .th-cm{font-weight:400;font-style:italic;color:var(--fg-lo);font-size:.66rem;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pv-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 0 10px}
  .pv-bar input{flex:1;min-width:160px;background:var(--ink-900);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--fg-hi);font:inherit;font-size:.78rem;padding:6px 10px}
  .pv-bar select{background:var(--ink-900);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--fg-hi);font:inherit;font-size:.78rem;padding:5px 8px}
  .pv-pager{display:inline-flex;align-items:center;gap:6px;color:var(--fg-md);font-size:.76rem;margin-left:auto}
  .pv-pager button:disabled{opacity:.4;cursor:not-allowed}
  /* Tab 切换器 */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:var(--s4);flex-wrap:wrap}
  .tab{appearance:none;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--fg-md);font:inherit;font-size:.88rem;font-weight:600;padding:10px 18px;cursor:pointer;border-radius:var(--r-sm) var(--r-sm) 0 0;transition:color .15s,border-color .15s,background .15s;display:inline-flex;align-items:center;gap:6px}
  .tab:hover{color:var(--fg-hi);background:var(--ink-850)}
  .tab.active{color:var(--teal-bright);border-bottom-color:var(--teal-bright)}
  .tab-panel{display:none}
  .tab-panel.active{display:block}
  #lgCanvas{height:420px;border:1px solid var(--line-soft);border-radius:var(--r-sm);background:var(--ink-950);overflow:hidden}
</style>
</head>
<body>
<div id="app">
<main class="main"><div class="page">
  <div class="h-sec between">
    <div><h1 id="title">数据集</h1><div class="desc" id="meta">加载中…</div></div>
    <div class="flex">
      <button class="btn btn-ghost btn-sm" id="exportPq" title="异步导出整数据集为 Parquet(202 任务 + 下载)" style="display:none">⬇ Parquet</button>
      <button class="btn btn-ghost btn-sm" id="exportCsv" title="异步导出整数据集为 CSV(202 任务 + 下载)" style="display:none">⬇ CSV</button>
      <a class="btn btn-primary btn-sm" id="ingestBtn" href="ingest.html"><i class="placeholder" data-ic="plus"></i> 追加摄入</a>
    </div>
  </div>

  <!-- Tab 切换器(概览 / 血缘 / 版本)-->
  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="overview" role="tab"><i class="placeholder" data-ic="database"></i> 概览</button>
    <button class="tab" data-tab="lineage" role="tab"><i class="placeholder" data-ic="share-nodes"></i> 血缘</button>
    <button class="tab" data-tab="version" role="tab"><i class="placeholder" data-ic="dashboard"></i> 版本</button>
  </div>

  <!-- 概览 Tab:现有 4 panel 整体包入 -->
  <div class="tab-panel active" id="tab-overview" role="tabpanel">
    <div class="panel"><div class="panel-b" id="body"></div></div>
    <div class="panel flush" id="schemaPanel" style="margin-top:var(--s4);display:none">
      <div class="panel-h"><i class="placeholder" data-ic="code"></i><h3>Schema(字段)</h3><span class="sub" id="schemaMeta">—</span></div>
      <div class="panel-b" id="schema"></div>
    </div>
    <div class="panel flush" id="kgPanel" style="margin-top:var(--s4);display:none">
      <div class="panel-h"><i class="placeholder" data-ic="share-nodes"></i><h3>知识图谱(KG)</h3><span class="sub" id="kgMeta">—</span></div>
      <div class="panel-b" id="kg"></div>
    </div>
    <div class="panel flush" id="previewPanel" style="margin-top:var(--s4)">
      <div class="panel-h"><i class="placeholder" data-ic="database"></i><h3>数据预览</h3><span class="sub" id="previewMeta">—</span></div>
      <div class="panel-b" id="preview"></div>
    </div>
  </div>

  <!-- 血缘 Tab -->
  <div class="tab-panel" id="tab-lineage" role="tabpanel">
    <div class="panel flush">
      <div class="panel-h"><i class="placeholder" data-ic="share-nodes"></i><h3>血缘图</h3><span class="sub" id="lgMeta">—</span><span class="actions"><span class="lamp ok pulse"><i></i>DAG</span></span></div>
      <div class="panel-b"><div id="lgCanvas"></div></div>
    </div>
    <div class="panel flush" style="margin-top:var(--s4)">
      <div class="panel-h"><i class="placeholder" data-ic="bell"></i><h3>血缘事件</h3><span class="sub" id="lgHistMeta">—</span></div>
      <div class="panel-b" id="lgHist"><div class="muted" style="padding:14px">点「血缘」Tab 加载…</div></div>
    </div>
  </div>

  <!-- 版本 Tab -->
  <div class="tab-panel" id="tab-version" role="tabpanel">
    <div class="panel flush">
      <div class="panel-h"><i class="placeholder" data-ic="dashboard"></i><h3>当前版本</h3><span class="sub">Lance time-travel · DatasetInfo.version</span></div>
      <div class="panel-b" id="vCur"><div class="muted" style="padding:14px">点「版本」Tab 加载…</div></div>
    </div>
    <div class="panel flush" style="margin-top:var(--s4)" id="vPanel">
      <div class="panel-h"><i class="placeholder" data-ic="database"></i><h3>备份快照</h3><span class="sub" id="vMeta">—</span><span class="actions"><button class="btn btn-primary btn-sm" id="vCreate" style="display:none"><i class="placeholder" data-ic="plus"></i> 创建快照</button></span></div>
      <div class="panel-b" id="vTbl"><div class="muted" style="padding:14px">点「版本」Tab 加载…</div></div>
    </div>
  </div>
</div></main>
</div>

<script src="assets/console-layout.js"></script>
<script type="module">
import { request } from "./src/api.js";
import { isLoggedIn } from "./src/auth.js";
import { runExport } from "./src/export.js";
import { toast } from "./src/ui/toast.js";

if (!isLoggedIn()) location.href = "login.html";
const { renderShell, icon } = window;
renderShell({ active: "datasets", crumb: '<a href="datasets.html">数据集</a> › <b id="crumbDs">—</b>' });
const $ = (s) => document.querySelector(s);
const ds = new URL(location.href).searchParams.get("ds");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtCell = (v) => {
  if (v == null) return '<span class="muted">—</span>';
  const s = typeof v === "object" ? JSON.stringify(v) : String(v);
  return s.length > 120 ? esc(s.slice(0, 120)) + '<span class="muted">…</span>' : esc(s);
};
const fmtSize = (b) => { if (b == null || isNaN(b)) return "—"; const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0, n = Number(b); while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return `${n.toFixed(n < 10 && i > 0 ? 1 : 0)} ${u[i]}`; };
const fmtDate = (s) => { if (!s) return "—"; const d = new Date(s); if (isNaN(d)) return String(s).slice(0, 16); const p = (n) => String(n).padStart(2, "0"); return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const isAdmin = (() => {
  try {
    const tok = localStorage.getItem("al_access") || "";
    const payload = JSON.parse(atob(tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
    return String(payload.role || "EDITOR").toUpperCase() === "ADMIN";
  } catch (_) { return false; }
})();
// 导出需 EDITOR(/datasets/{n}/export role=EDITOR);与 isAdmin 同款 JWT 解码
const canEdit = (() => {
  try {
    const tok = localStorage.getItem("al_access") || "";
    const payload = JSON.parse(atob(tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
    return ["EDITOR", "ADMIN"].includes(String(payload.role || "EDITOR").toUpperCase());
  } catch (_) { return false; }
})();
async function doExport(format) {
  if (!ds) return toast("未指定数据集", "warn");
  const btn = format === "csv" ? $("#exportCsv") : $("#exportPq");
  try {
    toast(`导出 ${ds}(${format}) 已提交,后台异步处理…`, "info");
    if (btn) btn.disabled = true;
    await runExport(ds, { format });
    toast(`导出完成:${ds}.${format}`, "ok");
  } catch (e) {
    toast("导出失败:" + (e?.detail || e?.message || e), "warn", 5000);
  } finally { if (btn) btn.disabled = false; }
}
if (canEdit) { $("#exportPq").style.display = ""; $("#exportCsv").style.display = ""; }
$("#exportPq")?.addEventListener("click", () => doExport("parquet"));
$("#exportCsv")?.addEventListener("click", () => doExport("csv"));

/* ---------- Tab 切换 ---------- */
let lineageLoaded = false, versionLoaded = false;
function switchTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("active", p.id === `tab-${name}`));
  if (name === "lineage" && ds && !lineageLoaded) { lineageLoaded = true; loadLineage(ds); }
  if (name === "version" && ds && !versionLoaded) { versionLoaded = true; loadVersion(ds); }
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => switchTab(t.dataset.tab)));

if (!ds) {
  $("#body").innerHTML = '<div class="muted" style="padding:28px;text-align:center">未指定数据集(<code>?ds=name</code>)— <a href="datasets.html" style="color:var(--teal-bright)">返回列表</a></div>';
} else {
  $("#ingestBtn").href = `ingest.html?ds=${encodeURIComponent(ds)}`;
  $("#crumbDs").textContent = ds;

  (async () => {
    // 1) 元数据
    try {
      const d = await request("GET", `/datasets/${encodeURIComponent(ds)}`);
      $("#title").textContent = d.name;
      $("#meta").textContent = `v${d.version} · ${(d.num_rows ?? 0).toLocaleString()} 行`;
      $("#body").innerHTML = `
        <div class="grid g-3">
          <div class="kpi"><div class="label">数据集</div><div class="val" style="font-size:1.05rem">${esc(d.name)}</div></div>
          <div class="kpi"><div class="label">行数</div><div class="val">${(d.num_rows ?? 0).toLocaleString()}</div></div>
          <div class="kpi"><div class="label">大小</div><div class="val">${fmtSize(d.size_bytes)}</div></div>
          <div class="kpi"><div class="label">版本</div><div class="val">${d.version ?? "—"}</div></div>
          <div class="kpi"><div class="label">创建</div><div class="val" style="font-size:.95rem">${fmtDate(d.created_at)}</div></div>
          <div class="kpi"><div class="label">更新</div><div class="val" style="font-size:.95rem">${fmtDate(d.updated_at)}</div></div>
        </div>
        <div class="divider" style="margin:var(--s4) 0"></div>
        <div class="flex" style="gap:8px;flex-wrap:wrap">
          <a class="btn btn-ghost btn-sm" href="ingest.html?ds=${encodeURIComponent(d.name)}">${icon("plus")} 追加摄入</a>
          <a class="btn btn-ghost btn-sm" href="tasks.html">${icon("dashboard")} 任务</a>
          <a class="btn btn-ghost btn-sm" href="datasets.html">${icon("arrowR")} 返回列表</a>
        </div>`;
    } catch (e) {
      $("#body").innerHTML = `<div style="color:var(--danger);padding:24px">元数据加载失败:${esc(e?.detail || e?.message || e)}</div>`;
      $("#meta").textContent = "加载失败";
    }

    // 1.5) 真实 schema(含字段注释)
    let commentMap = {};
    let schemaFields = [];
    const trunc = (s, n = 16) => (s && s.length > n ? s.slice(0, n - 1) + "…" : s || "");
    const renderSchema = (fields) => {
      $("#schemaMeta").textContent = `${fields.length} 个字段`;
      $("#schema").innerHTML = fields.map((f) => {
        const cm = f.comment || "";
        const tip = `${esc(f.type)}${f.nullable ? "" : " · NOT NULL"}${cm ? "\n" + cm : ""}`;
        const cmHtml = cm ? ` <span class="cm" title="${esc(cm)}">// ${esc(trunc(cm))}</span>` : "";
        return `<span class="schema-chip" title="${tip}">${esc(f.name)}<span style="color:var(--fg-lo)"> : ${esc(f.type)}</span>${cmHtml}<button class="ic-btn" data-field="${esc(f.name)}" data-cm="${esc(cm)}" title="编辑字段注释" type="button">✎</button></span>`;
      }).join("");
    };
    try {
      const s = await request("GET", `/datasets/${encodeURIComponent(ds)}/schema`);
      const fields = s?.fields || [];
      commentMap = Object.fromEntries(fields.map((f) => [f.name, f.comment || ""]));
      schemaFields = fields;
      if (fields.length) {
        $("#schemaPanel").style.display = "";
        renderSchema(fields);
      }
    } catch (_) { /* schema 取失败不阻塞预览 */ }
    // 字段注释编辑(铅笔 → prompt → POST annotate → 局部刷新)
    $("#schema").addEventListener("click", async (ev) => {
      const btn = ev.target.closest(".ic-btn");
      if (!btn) return;
      const field = btn.dataset.field;
      const v = window.prompt(`编辑字段注释 — ${field}`, btn.dataset.cm || "");
      if (v === null) return; // 用户取消
      try {
        const s = await request("POST", `/datasets/${encodeURIComponent(ds)}/schema/annotate`, { body: { field, comment: v } });
        if (s?.fields?.length) {
          renderSchema(s.fields);
          commentMap = Object.fromEntries(s.fields.map((f) => [f.name, f.comment || ""]));
        }
        toast(v.trim() ? "注释已保存" : "注释已清除", "ok", 2500);
      } catch (e) {
        toast("保存失败:" + (e?.detail || e?.message || e), "warn", 5000);
      }
    });

    // 1.6) 知识图谱统计
    try {
      const s = await request("GET", `/kg/stats?dataset=${encodeURIComponent(ds)}`);
      $("#kgPanel").style.display = "";
      const v = s.total_vertices ?? 0, e = s.total_edges ?? 0;
      $("#kgMeta").textContent = v ? `${v} 顶点 · ${e} 边` : "未构建";
      $("#kg").innerHTML = v
        ? `<div class="flex" style="gap:12px;align-items:center;flex-wrap:wrap">
             <div class="kpi" style="padding:8px 14px"><div class="label">顶点</div><div class="val">${v.toLocaleString()}</div></div>
             <div class="kpi" style="padding:8px 14px"><div class="label">边</div><div class="val">${e.toLocaleString()}</div></div>
             <a class="btn btn-primary btn-sm" href="kg.html?ds=${encodeURIComponent(ds)}">查看图谱 →</a>
           </div>`
        : `<div class="muted" style="font-size:.82rem;padding:4px 0">该数据集尚未构建知识图谱(0 实体)。<a class="btn btn-ghost btn-sm" href="kg.html?ds=${encodeURIComponent(ds)}" style="margin-left:8px">去构建 →</a></div>`;
    } catch (_) { /* KG 未启用,隐藏 */ }

    // 2) 数据预览(分页 + 检索)
    const pv = { page: 1, size: 100, q: "", col: "__all__", total: 0 };
    const escSql = (s) => String(s ?? "").replace(/'/g, "''");
    const escId = (s) => String(s ?? "").replace(/"/g, '""'); // escape double-quote in SQL identifiers (col/table) — stored-injection hardening
    async function loadPreview() {
      $("#preview").innerHTML = '<div class="muted" style="padding:20px;text-align:center">加载…</div>';
      const q = pv.q.trim();
      const textCols = schemaFields.filter((f) => /string|utf8|large_string/i.test(f.type)).map((f) => f.name);
      const whereCols = (pv.col && pv.col !== "__all__") ? [pv.col] : (textCols.length ? textCols : schemaFields.map((f) => f.name));
      let where = "";
      if (q && whereCols.length) {
        const escQ = escSql(q);
        const clause = whereCols.map((c) => `"${escId(c)}"::VARCHAR LIKE '%${escQ}%'`).join(" OR ");
        where = `WHERE ${whereCols.length > 1 ? `(${clause})` : clause}`;
      }
      const tbl = escId(ds);
      const dsEnc = encodeURIComponent(ds);
      try {
        const cr = await request("POST", `/datasets/${dsEnc}/query/olap`, { body: { sql: `SELECT COUNT(*) AS c FROM "${tbl}" ${where}` } });
        pv.total = Number(cr?.rows?.[0]?.c ?? 0);
        const pages = Math.max(1, Math.ceil(pv.total / pv.size));
        if (pv.page > pages) pv.page = pages;
        const offset = Math.min((pv.page - 1) * pv.size, 100000); // cap deep-offset (perf + abuse guard)
        const res = await request("POST", `/datasets/${dsEnc}/query/olap`, { body: { sql: `SELECT * FROM "${tbl}" ${where} LIMIT ${pv.size} OFFSET ${offset}` } });
        const rows = res?.rows || [];
        const cols = rows.length ? Object.keys(rows[0]) : [];
        const head = cols.map((c) => {
          const cm = commentMap[c] || "";
          const cmHtml = cm ? `<div class="th-cm" title="${esc(cm)}">${esc(trunc(cm, 20))}</div>` : "";
          return `<th>${esc(c)}${cmHtml}</th>`;
        }).join("");
        const body = rows.map((r) => `<tr>${cols.map((c) => {
          const raw = r[c];
          const title = typeof raw === "object" ? JSON.stringify(raw) : String(raw ?? "");
          return `<td title="${esc(title)}">${fmtCell(raw)}</td>`;
        }).join("")}</tr>`).join("");
        const colOpts = `<option value="__all__"${pv.col === "__all__" ? " selected" : ""}>全部文本列</option>` + textCols.map((c) => `<option value="${esc(c)}"${pv.col === c ? " selected" : ""}>${esc(c)}</option>`).join("");
        const atFirst = pv.page <= 1, atLast = pv.page >= pages;
        const pager = `<span class="pv-pager">
            <button class="btn btn-ghost btn-sm" data-pv="first" ${atFirst ? "disabled" : ""}>«</button>
            <button class="btn btn-ghost btn-sm" data-pv="prev" ${atFirst ? "disabled" : ""}>‹</button>
            <span>第 <b>${pv.page}</b>/${pages} 页 · 共 ${pv.total.toLocaleString()} 行</span>
            <button class="btn btn-ghost btn-sm" data-pv="next" ${atLast ? "disabled" : ""}>›</button>
            <button class="btn btn-ghost btn-sm" data-pv="last" ${atLast ? "disabled" : ""}>»</button>
            <select id="pvSize">${[50, 100, 200].map((s) => `<option${pv.size === s ? " selected" : ""}>${s}</option>`).join("")}</select>/页
          </span>`;
        const bar = `<div class="pv-bar">
            <input id="pvSearch" placeholder="检索(文本列 LIKE %关键词%)…" value="${esc(q)}" />
            <select id="pvCol">${colOpts}</select>
            <button class="btn btn-primary btn-sm" data-pv="search">搜索</button>
            <button class="btn btn-ghost btn-sm" data-pv="reset">重置</button>
            ${pager}
          </div>`;
        $("#previewMeta").textContent = `${pv.total.toLocaleString()} 行 · ${cols.length} 列${q ? ` · 检索 "${q}"` : ""}`;
        $("#preview").innerHTML = pv.total
          ? `${bar}<div class="preview-wrap"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`
          : `${bar}<div class="muted" style="padding:24px;text-align:center">${q ? "无匹配行" : "数据集为空(无行)"}</div>`;
      } catch (e) {
        const msg = e?.detail || e?.message || String(e);
        $("#preview").innerHTML = `<div style="color:var(--danger);padding:16px">预览失败:${esc(msg)}<br/><span class="muted" style="font-size:.72rem">可能:数据集无表结构 / SQL 安全校验拒 / 列名特殊;可在 OLAP Worksheet 手写 SQL</span></div>`;
      }
    }
    // 分页/检索事件委托(挂一次;#preview 元素稳定,仅 innerHTML 变)
    $("#preview").addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-pv]"); if (!b) return;
      const a = b.dataset.pv;
      const pages = Math.max(1, Math.ceil(pv.total / pv.size));
      if (a === "first") pv.page = 1;
      else if (a === "prev") pv.page = Math.max(1, pv.page - 1);
      else if (a === "next") pv.page = Math.min(pages, pv.page + 1);
      else if (a === "last") pv.page = pages;
      else if (a === "search") { pv.q = $("#pvSearch").value; pv.col = $("#pvCol").value; pv.page = 1; }
      else if (a === "reset") { pv.q = ""; pv.col = "__all__"; pv.page = 1; }
      else return;
      loadPreview();
    });
    $("#preview").addEventListener("change", (ev) => {
      if (ev.target.id === "pvSize") { pv.size = Number(ev.target.value) || 100; pv.page = 1; loadPreview(); }
    });
    $("#preview").addEventListener("keydown", (ev) => {
      if (ev.target.id === "pvSearch" && ev.key === "Enter") { ev.preventDefault(); $("#preview").querySelector('[data-pv="search"]').click(); }
    });
    loadPreview();
  })();
}

/* ---------- 血缘 Tab ---------- */
let lgNetwork = null;
async function loadLineage(name) {
  const V = window.vis;
  const meta = $("#lgMeta"), cont = $("#lgCanvas");
  // graph
  try {
    const g = await request("GET", `/lineage/graph/${encodeURIComponent(name)}?max_depth=10&format=json`);
    const ns = (g.nodes || []).map(n => ({
      id: n.id, group: n.type || "derived",
      label: n.id,
      title: `${n.id}\n深度 ${n.depth ?? 0} · 类型 ${n.type || "derived"}`,
    }));
    const es = (g.edges || []).map((e, i) => ({
      id: e.id || ("e" + i), from: e.from || e.source, to: e.to || e.target,
      label: e.operation || e.transform_type || "", arrows: "to",
      font: { size: 9, color: "#64748b", strokeWidth: 0 },
      title: `${e.operation || "?"}${e.transform_type ? " · " + e.transform_type : ""}`,
    }));
    const stats = g.stats || {};
    meta.innerHTML = `${stats.total_nodes ?? ns.length} 节点 · ${stats.total_edges ?? es.length} 边 · 深度 <b>${stats.max_depth ?? 0}</b>`;
    if (!V) { cont.innerHTML = '<div class="muted" style="padding:14px;color:var(--warn)">vis-network 未加载</div>'; }
    else if (!ns.length) { cont.innerHTML = '<div class="muted" style="padding:14px">该数据集无血缘记录(孤立节点)</div>'; }
    else {
      if (lgNetwork) { lgNetwork.destroy(); lgNetwork = null; }
      lgNetwork = new V.Network(cont, { nodes: new V.DataSet(ns), edges: new V.DataSet(es) }, {
        height: "100%", width: "100%", autoResize: true,
        layout: { hierarchical: { enabled: true, direction: "LR", sortMethod: "directed", levelSeparation: 160, nodeSpacing: 120 } },
        physics: { enabled: false },
        nodes: { shape: "box", margin: 10, font: { size: 12, color: "#e2e8f0" }, borderWidth: 2 },
        edges: { color: { color: "#475569", opacity: 0.6 }, smooth: { type: "cubicBezier" }, selectionWidth: 2 },
        groups: {
          target: { color: { background: "#34d399", border: "#059669" } },
          source: { color: { background: "#60a5fa", border: "#2563eb" } },
          derived: { color: { background: "#fbbf24", border: "#d97706" } },
        },
        interaction: { hover: true, zoomView: true, dragView: true },
      });
    }
  } catch (e) {
    meta.innerHTML = `<span style="color:var(--danger)">血缘图加载失败</span>`;
    cont.innerHTML = `<div class="muted" style="padding:14px;color:var(--danger)">${esc(e?.detail || e?.message || e)}</div>`;
  }
  // history
  try {
    const h = await request("GET", `/lineage/history/${encodeURIComponent(name)}`);
    const ev = h.events || [];
    $("#lgHistMeta").textContent = `${ev.length} 条事件`;
    if (!ev.length) {
      $("#lgHist").innerHTML = '<div class="muted" style="padding:14px">无血缘事件记录</div>';
    } else {
      const head = `<tr><th>时间</th><th>操作</th><th>来源数据集</th><th>转换</th><th>触发者</th></tr>`;
      const body = ev.map(ev => {
        const ts = ev.timestamp || ev.time || ev.created_at;
        const op = ev.operation || ev.action || "?";
        const src = Array.isArray(ev.source_datasets) ? ev.source_datasets.join(", ") : (ev.source_datasets || ev.sources || "—");
        const tt = ev.transform_type || ev.transform || "—";
        const actor = ev.actor || ev.user || ev.user_id || "—";
        return `<tr><td style="white-space:nowrap">${esc(fmtDate(ts))}</td><td><b>${esc(op)}</b></td><td style="font-family:var(--font-mono);font-size:.74rem">${esc(src)}</td><td>${esc(tt)}</td><td>${esc(actor)}</td></tr>`;
      }).join("");
      $("#lgHist").innerHTML = `<div class="preview-wrap"><table class="tbl"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
    }
  } catch (e) {
    $("#lgHist").innerHTML = `<div class="muted" style="padding:14px;color:var(--danger)">事件加载失败:${esc(e?.detail || e?.message || e)}</div>`;
  }
}

/* ---------- 版本 Tab ---------- */
async function loadVersion(name) {
  // 当前 Lance 版本 KPI
  try {
    const d = await request("GET", `/datasets/${encodeURIComponent(name)}`);
    const idx = [
      ["版本", d.version ?? "—"],
      ["行数", (d.num_rows ?? 0).toLocaleString()],
      ["大小", fmtSize(d.size_bytes)],
      ["创建", fmtDate(d.created_at)],
      ["更新", fmtDate(d.updated_at)],
    ];
    const flags = [
      ["向量索引", d.has_vector_index, "teal"],
      ["全文索引", d.has_fts_index, "info"],
      ["知识图谱", d.has_kg, "warn"],
    ];
    $("#vCur").innerHTML = `<div class="grid g-3">${idx.map(([l, v]) => `<div class="kpi"><div class="label">${l}</div><div class="val">${esc(v)}</div></div>`).join("")}
      ${flags.map(([l, ok, c]) => `<div class="kpi"><div class="label">${l}</div><div class="val"><span class="lamp ${ok ? "ok" : "muted"}${ok ? " pulse" : ""}"><i></i>${ok ? "已启用" : "未启用"}</span></div></div>`).join("")}</div>`;
  } catch (e) {
    $("#vCur").innerHTML = `<div class="muted" style="padding:14px;color:var(--danger)">版本信息加载失败:${esc(e?.detail || e?.message || e)}</div>`;
  }
  // backup 列表(ADMIN 可见写操作)
  if (isAdmin) $("#vCreate").style.display = "";
  try {
    const r = await request("GET", "/backup/list");
    const all = r?.backups || [];
    const mine = all.filter(b => Array.isArray(b.datasets) && b.datasets.includes(name));
    $("#vMeta").textContent = `${mine.length} 个含本数据集的快照(共 ${all.length} 个)`;
    if (!mine.length) {
      $("#vTbl").innerHTML = `<div class="muted" style="padding:14px">无含本数据集的备份快照${isAdmin ? "。可点上方「创建快照」" : ""}。</div>`;
    } else {
      const head = `<tr><th>备份 ID</th><th>创建时间</th><th>状态</th><th>大小</th><th>含数据集</th>${isAdmin ? "<th>操作</th>" : ""}</tr>`;
      const body = mine.map(b => {
        const sz = fmtSize(b.total_size_bytes);
        const dss = (b.datasets || []).length;
        return `<tr>
          <td style="font-family:var(--font-mono);font-size:.72rem">${esc(b.backup_id)}</td>
          <td style="white-space:nowrap">${esc(fmtDate(b.created_at))}</td>
          <td><span class="lamp ${b.status === "completed" || b.status === "ok" ? "ok" : "warn"}"><i></i>${esc(b.status || "?")}</span></td>
          <td>${esc(sz)}</td>
          <td>${dss}</td>
          ${isAdmin ? `<td><button class="btn btn-ghost btn-sm" data-restore="${esc(b.backup_id)}">恢复</button> <button class="btn btn-ghost btn-sm" data-del="${esc(b.backup_id)}" style="color:var(--danger)">删</button></td>` : ""}
        </tr>`;
      }).join("");
      $("#vTbl").innerHTML = `<div class="preview-wrap"><table class="tbl"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
      // 操作绑定
      if (isAdmin) {
        $("#vTbl").querySelectorAll("[data-restore]").forEach(b => b.addEventListener("click", () => restoreBackup(b.dataset.restore, name)));
        $("#vTbl").querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => deleteBackup(b.dataset.del)));
      }
    }
  } catch (e) {
    // 非 ADMIN 或 backup 未启用 → 只读降级
    const msg = e?.status === 403 || /403|forbidden/i.test(String(e?.detail || e?.message || e)) ? "需 ADMIN 权限查看快照" : (e?.detail || e?.message || e);
    $("#vMeta").textContent = "—";
    $("#vTbl").innerHTML = `<div class="muted" style="padding:14px">快照列表不可用:${esc(msg)}</div>`;
  }
}

async function restoreBackup(backupId, name) {
  if (!confirm(`确认从备份 ${backupId} 恢复数据集「${name}」?\n(overwrite=true,将覆盖当前数据)`)) return;
  try {
    await request("POST", `/backup/restore?backup_id=${encodeURIComponent(backupId)}`, { body: { dataset_names: [name], overwrite: true } });
    await loadVersion(name);
    window.toast && toast("恢复已触发", "ok", 2500);
  } catch (e) {
    alert("恢复失败:" + (e?.detail || e?.message || e));
  }
}
async function deleteBackup(backupId) {
  if (!confirm(`确认删除备份 ${backupId}?此操作不可撤销。`)) return;
  try {
    await request("DELETE", `/backup/${encodeURIComponent(backupId)}`);
    await loadVersion(ds);
    window.toast && toast("备份已删除", "ok", 2500);
  } catch (e) {
    alert("删除失败:" + (e?.detail || e?.message || e));
  }
}
$("#vCreate")?.addEventListener("click", async () => {
  if (!ds) return;
  try {
    await request("POST", "/backup/create", { body: { dataset_names: [ds] } });
    await loadVersion(ds);
    window.toast && toast("快照创建已触发", "ok", 2500);
  } catch (e) {
    alert("创建快照失败:" + (e?.detail || e?.message || e));
  }
});
</script>
</body>
