<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>审计日志 · Arrow Lake Console</title>
<link rel="stylesheet" href="assets/tokens.css"/>
<link rel="stylesheet" href="assets/app.css"/>
<link rel="stylesheet" href="assets/console.css"/>
</head>
<body>
<div id="app">
<main class="main"><div class="page">
  <div class="h-sec between">
    <div><h1>审计日志</h1><div class="desc">谁 · 何时 · 对什么 · 做了什么 · HMAC 完整性 · <span class="mono">GET /api/v1/audit/query</span></div></div>
    <div class="flex"><button class="btn btn-ghost btn-sm" id="apiBtn"><i class="placeholder" data-ic="code"></i> API</button><button class="btn btn-teal btn-sm" id="export" style="display:none"><i class="placeholder" data-ic="logout"></i> 导出</button></div>
  </div>

  <div class="panel flush">
    <div class="panel-h"><i class="placeholder" data-ic="search"></i><h3>过滤</h3><span class="sub">dataset_name · event_type · 时间区间</span></div>
    <div class="panel-b"><div class="flex wrap" style="gap:var(--s3)">
      <input class="input" id="fDs" placeholder="数据集名(dataset_name)" style="max-width:220px">
      <input class="input" id="fType" placeholder="事件类型(create/delete/query/...)" style="max-width:240px">
      <input class="input" id="fStart" type="datetime-local" style="max-width:200px" title="起始时间">
      <input class="input" id="fEnd" type="datetime-local" style="max-width:200px" title="结束时间">
      <button class="btn btn-primary btn-sm" id="filter"><i class="placeholder" data-ic="search"></i> 查询</button>
    </div></div>
  </div>

  <div class="panel flush">
    <div class="panel-h"><i class="placeholder" data-ic="bell"></i><h3>审计事件</h3><span class="sub" id="cnt">—</span></div>
    <div class="tbl-scroll"><table class="tbl" id="tbl">
      <thead><tr><th>时间</th><th>事件类型</th><th>触发者</th><th>数据集</th><th>HMAC</th></tr></thead>
      <tbody><tr><td colspan="5" class="muted" style="padding:28px;text-align:center">加载中…</td></tr></tbody>
    </table></div>
    <div id="pager" class="flex wrap" style="gap:6px;padding:10px 14px;border-top:1px solid var(--line-soft);align-items:center;font-size:.78rem"></div>
  </div>
</div></main>
</div>

<script src="assets/console-layout.js"></script>
<script type="module">
import { request } from "./src/api.js";
import { isLoggedIn } from "./src/auth.js";
import { toast } from "./src/ui/toast.js";
import { promptDialog } from "./src/ui/modal.js";

if (!isLoggedIn()) location.href = "login.html";

const { renderShell, icon } = window;
renderShell({ active: "audit", crumb: "<b>审计日志</b>" });
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let _all = [], _page = 1; const _SIZE = 20;

// role 从 JWT payload 解(ADMIN 才显示导出)
const role = (() => {
  try {
    const t = localStorage.getItem("al_access"); if (!t) return "viewer";
    const p = JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
    return String(p.role || "viewer").toLowerCase();
  } catch (_) { return "viewer"; }
})();
if (role === "admin") $("#export").style.display = "inline-flex";

function fmtTime(s) {
  if (!s) return "—";
  const d = new Date(s);
  if (isNaN(d)) return esc(String(s).slice(0, 19));
  return d.toLocaleString("zh-CN", { hour12: false }).replace(/\//g, "-");
}
function tagCls(et) {
  if (/delete|drop|rollback/i.test(et)) return "amber";
  if (/create|checkpoint|insert|build/i.test(et)) return "teal";
  if (/query|search|read/i.test(et)) return "info";
  return "";
}

async function load() {
  const q = new URLSearchParams();
  const ds = $("#fDs").value.trim(), et = $("#fType").value.trim();
  const st = $("#fStart").value, en = $("#fEnd").value;
  if (ds) q.set("dataset_name", ds);
  if (et) q.set("event_type", et);
  if (st) q.set("start", new Date(st).toISOString());
  if (en) q.set("end", new Date(en).toISOString());

  $("#tbl").innerHTML = `<thead><tr><th>时间</th><th>事件类型</th><th>触发者</th><th>数据集</th><th>HMAC</th></tr></thead>
    <tbody><tr><td colspan="5" class="muted" style="padding:28px;text-align:center">加载中…</td></tr></tbody>`;

  try {
    const r = await request("GET", `/audit/query?${q}`);
    // 真实响应键:entries(list[dict]);多键容错
    const list = Array.isArray(r?.entries) ? r.entries : (Array.isArray(r?.items) ? r.items : (Array.isArray(r) ? r : []));
    _all = list; _page = 1; renderPage();
  } catch (e) {
    const msg = e?.detail || e?.message || String(e);
    $("#cnt").textContent = "失败";
    $("#tbl").innerHTML = `<thead><tr><th>事件</th></tr></thead><tbody><tr><td class="muted" style="padding:28px;text-align:center;color:var(--danger)">查询失败:${esc(msg)}<br/><span style="font-size:.72rem">需 VIEWER+ 登录</span><br/><button class="btn btn-ghost btn-sm" id="retry" style="margin-top:10px">重试</button></td></tr></tbody>`;
    $("#retry")?.addEventListener("click", load);
    toast("审计查询失败:" + msg, "warn", 4000);
  }
}

function renderPage() {
  const list = _all, total = list.length, pages = Math.max(1, Math.ceil(total / _SIZE));
  if (_page < 1) _page = 1; if (_page > pages) _page = pages;
  const slice = list.slice((_page - 1) * _SIZE, _page * _SIZE);
  $("#cnt").textContent = `${total} 条 · 第 ${_page}/${pages} 页`;
  $("#tbl").innerHTML = `<thead><tr><th>时间</th><th>事件类型</th><th>触发者</th><th>数据集</th><th>HMAC</th></tr></thead><tbody>${
    slice.length ? slice.map(e => {
      const evt = e.event_type || e.event || "—";
      return `<tr>
        <td class="mono" style="font-size:.72rem;white-space:nowrap">${fmtTime(e.timestamp || e.time)}</td>
        <td><span class="tag ${tagCls(evt)}">${esc(evt)}</span></td>
        <td><b>${esc(e.actor || e.user || e.username || "—")}</b></td>
        <td class="mono" style="font-size:.78rem">${esc(e.dataset_name || e.dataset || e.resource || "—")}</td>
        <td class="mono" style="font-size:.68rem;color:var(--fg-lo)">${esc((e.hmac_hash || e.hmac || "").slice(0, 12))}${e.hmac_hash ? "…" : ""}</td>
      </tr>`;
    }).join("") : `<tr><td colspan="5" class="muted" style="padding:28px;text-align:center">无审计事件(_audit_trail 为空,或过滤无匹配)</td></tr>`
  }</tbody>`;
  const pg = $("#pager");
  if (total <= _SIZE) { pg.innerHTML = ""; return; }
  let btns = `<button class="btn btn-ghost btn-sm" data-p="${_page - 1}" ${_page <= 1 ? "disabled" : ""}>‹ 上一页</button> `;
  const nums = [...new Set([1, pages, _page - 1, _page, _page + 1].filter(n => n >= 1 && n <= pages))].sort((a, b) => a - b);
  nums.forEach((n, i) => {
    if (i && n - nums[i - 1] > 1) btns += `<span class="muted" style="padding:0 2px">…</span> `;
    btns += n === _page
      ? `<button class="btn btn-sm" disabled style="background:var(--ink-700);color:var(--fg-hi)">${n}</button> `
      : `<button class="btn btn-ghost btn-sm" data-p="${n}">${n}</button> `;
  });
  btns += `<button class="btn btn-ghost btn-sm" data-p="${_page + 1}" ${_page >= pages ? "disabled" : ""}>下一页 ›</button>`;
  pg.innerHTML = btns;
  pg.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => {
    const p = parseInt(b.dataset.p); if (isNaN(p)) return;
    _page = p; renderPage(); document.querySelector(".page").scrollIntoView({ behavior: "smooth", block: "start" });
  }));
}

async function exportAudit() {
  let ds = $("#fDs").value.trim();
  if (!ds) ds = await promptDialog({ title: "导出审计日志", message: "输入要导出的数据集名", placeholder: "dataset_name" });
  if (!ds) return;
  try {
    await request("POST", `/audit/export?dataset_name=${encodeURIComponent(ds)}`);
    toast(`导出任务已提交:${ds}(ADMIN)`, "ok", 3000);
  } catch (e) {
    toast("导出失败:" + (e?.detail || e?.message || e), "warn", 4000);
  }
}

load();
window.applyIcons && applyIcons(document);

$("#filter").addEventListener("click", load);
$("#export").addEventListener("click", exportAudit);
$("#apiBtn").addEventListener("click", () => window.openApi(
  "审计日志",
  `curl -s "$API/api/v1/audit/query?dataset_name=ds1&event_type=create" -H "Authorization: Bearer $JWT" -H "X-API-Key: $KEY" | jq .\n# 导出(ADMIN)\ncurl -X POST "$API/api/v1/audit/export?dataset_name=ds1" -H "Authorization: Bearer $JWT" -H "X-API-Key: $KEY"`,
  "lake.audit_query(dataset_name='ds1', event_type='create')  # → list[AuditEntry]\\nlake.audit_export('ds1')  # → dict (ADMIN)"
));
</script>
</body>
</html>
