# Arrow Lake — Docker Compose (Base)
#
# Core services: API server + MinIO object storage.
# Extend with overlays for development, GPU, and monitoring.
#
# Usage:
#   make up              # Core only (API + MinIO)
#   make dev             # + Jupyter + source mounts
#   make gpu             # + GPU-enabled Ray
#   make full            # All services + Prometheus
#
# Override files (merged automatically by Makefile):
#   docker-compose.dev.yml        — source code mounts for development
#   docker-compose.gpu.yml        — GPU images + NVIDIA reservations
#   docker-compose.monitoring.yml — Prometheus + Grafana

# ==============================================================================
# Extensions — shared configuration (DRY)
# ==============================================================================

x-arrow-lake: &arrow-lake
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: arrow-lake:latest
  restart: unless-stopped
  env_file:
    - path: ../.env
      required: false
  networks:
    - arrow-lake-net
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
      tag: "arrow-lake"

x-arrow-lake-env: &arrow-lake-env
  ARROW_LAKE__STORAGE__S3_ENDPOINT: "http://minio:9000"
  ARROW_LAKE__STORAGE__BACKEND: "minio"
  ARROW_LAKE__OBSERVABILITY__METRICS_ENABLED: "true"
  ARROW_LAKE__EMBEDDING__MODEL_SOURCE: "modelscope"

x-minio-creds: &minio-creds
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

# ==============================================================================
# Services
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # API Server — Lake SDK HTTP endpoint (/health, /metrics)
  # ---------------------------------------------------------------------------
  api:
    <<: [*arrow-lake]
    profiles: ["core", "dev", "monitoring"]
    container_name: arrow-lake-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      <<: [*arrow-lake-env]
      ARROW_LAKE__OBSERVABILITY__METRICS_PORT: "8000"
    depends_on:
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-2G}
          cpus: "${API_CPU_LIMIT:-1.0}"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2024-11-07T00-52-20Z}
    container_name: arrow-lake-minio
    profiles: ["core", "dev", "gpu", "monitoring"]
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      <<: [*minio-creds]
    volumes:
      - minio-data:/data
    networks:
      - arrow-lake-net
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: ${MINIO_MEMORY_LIMIT:-1G}
          cpus: "${MINIO_CPU_LIMIT:-0.5}"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO Init — Create default bucket on first start
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: arrow-lake-minio-init
    profiles: ["core", "dev", "gpu", "monitoring"]
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - arrow-lake-net
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb local/${MINIO_BUCKET:-arrow-lake} --ignore-existing &&
      mc anonymous set download local/${MINIO_BUCKET:-arrow-lake}
      "

  # ---------------------------------------------------------------------------
  # Ray Head — Cluster head node (GCS server + Dashboard)
  # ---------------------------------------------------------------------------
  ray-head:
    <<: [*arrow-lake]
    profiles: ["compute", "dev", "gpu", "monitoring"]
    container_name: arrow-lake-ray-head
    ports:
      - "6379:6379"
      - "8265:8265"
    environment:
      <<: [*arrow-lake-env]
      ARROW_LAKE__COMPUTE__RAY_ADDRESS: "auto"
    volumes:
      - lake-data:/data/lake
    command: >
      ray start
      --head
      --port=6379
      --dashboard-host=0.0.0.0
      --dashboard-port=8265
      --num-cpus=${RAY_HEAD_CPUS:-2}
      --block
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: ${RAY_HEAD_MEMORY_LIMIT:-4G}
          cpus: "${RAY_HEAD_CPU_LIMIT:-2.0}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import ray; ray.init(address='auto', ignore_reinit_error=True); print('ok')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Ray Worker — Scalable compute workers
  # ---------------------------------------------------------------------------
  ray-worker:
    <<: [*arrow-lake]
    profiles: ["compute", "dev", "gpu", "monitoring"]
    restart: unless-stopped
    deploy:
      replicas: ${RAY_WORKER_REPLICAS:-1}
      resources:
        limits:
          memory: ${RAY_WORKER_MEMORY:-4G}
          cpus: "${RAY_WORKER_CPU_LIMIT:-2.0}"
    environment:
      <<: [*arrow-lake-env]
      ARROW_LAKE__COMPUTE__RAY_ADDRESS: "ray://ray-head:10001"
    volumes:
      - lake-data:/data/lake
    command: >
      ray start
      --address=ray-head:6379
      --num-cpus=${RAY_WORKER_CPUS:-2}
      --block
    depends_on:
      ray-head:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Jupyter Lab — Development notebook environment
  # ---------------------------------------------------------------------------
  jupyter:
    <<: [*arrow-lake]
    profiles: ["dev", "monitoring"]
    container_name: arrow-lake-jupyter
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    environment:
      <<: [*arrow-lake-env]
      ARROW_LAKE__COMPUTE__RAY_ADDRESS: "ray://ray-head:10001"
      ARROW_LAKE__OBSERVABILITY__LOG_LEVEL: "INFO"
    volumes:
      - lake-data:/data/lake
    working_dir: /app
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --NotebookApp.token=""
      --allow-root
    depends_on:
      ray-head:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${JUPYTER_MEMORY_LIMIT:-2G}
          cpus: "${JUPYTER_CPU_LIMIT:-1.0}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8888/lab')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

# ==============================================================================
# Networks
# ==============================================================================

networks:
  arrow-lake-net:
    driver: bridge

# ==============================================================================
# Volumes
# ==============================================================================

volumes:
  minio-data:
    driver: local
  lake-data:
    driver: local
