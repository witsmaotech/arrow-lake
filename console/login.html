<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>登录 · Arrow Lake Console</title>
<link rel="stylesheet" href="assets/tokens.css"/>
<link rel="stylesheet" href="assets/app.css"/>
<link rel="stylesheet" href="assets/console.css"/>
<style>
  /* 复用原型 login 双栏样式 */
  .login-bg{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;position:relative;z-index:1}
  .login-bgimg{position:fixed;inset:0;z-index:0;background:#020a0e}
  .login-bgimg svg{width:100%;height:100%;display:block}
  .login-bgimg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,10,14,.28),rgba(2,8,12,.72))}
  .login-art{position:relative;padding:var(--s7);display:flex;flex-direction:column;justify-content:space-between;background:transparent;overflow:hidden;border-right:1px solid rgba(255,255,255,.06)}
  .login-art:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:radial-gradient(500px 400px at 30% 40%,#000,transparent);mask-image:radial-gradient(500px 400px at 30% 40%,#000,transparent)}
  .login-form{display:grid;place-items:center;padding:var(--s6)}
  .login-card{width:min(380px,92vw)}
  .toggles{display:flex;gap:2px;background:var(--ink-850);border:1px solid var(--line);border-radius:var(--r-md);padding:3px;margin-bottom:var(--s4)}
  .toggles button{flex:1;padding:7px;border:none;background:none;color:var(--fg-lo);font-size:.8rem;font-weight:600;cursor:pointer;border-radius:5px;font-family:inherit}
  .toggles button.active{background:var(--ink-700);color:var(--fg-hi)}
  .telem{display:flex;gap:var(--s4);align-items:center;font-family:var(--font-mono);font-size:.7rem;color:var(--fg-lo)}
  .telem .item{display:inline-flex;gap:6px;align-items:center}
  .telem .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
  @media(max-width:860px){.login-bg{grid-template-columns:1fr}.login-art{display:none}}
</style>
</head>
<body>
<div class="login-bgimg" aria-hidden="true">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="bmGlow" cx="40%" cy="24%" r="62%"><stop offset="0" stop-color="#5eead4" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
      <linearGradient id="bmSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0ea5a4" stop-opacity=".05"/><stop offset="1" stop-color="#0b7283" stop-opacity=".30"/></linearGradient>
    </defs>
    <rect width="1600" height="900" fill="#020a0e"/>
    <rect width="1600" height="900" fill="url(#bmGlow)"/>
    <!-- 鹏翼 · 垂天之云(上部,横展) -->
    <path d="M120 180 q360 -150 720 -84 q-336 10 -540 116 q-118 64 -180 -32 z" fill="#7dd3fc" fill-opacity=".11"/>
    <path d="M860 120 q336 -78 600 -22 q-256 6 -420 74 q-132 52 -180 -52 z" fill="#7dd3fc" fill-opacity=".08"/>
    <path d="M480 100 q272 -52 488 -12 q-184 4 -304 52 q-96 36 -184 -40 z" fill="#38bdf8" fill-opacity=".07"/>
    <!-- 鲲 · 潜于北冥之渊 -->
    <path d="M260 520 q200 -100 486 -74 q128 14 224 70 q-96 -22 -192 -8 q-134 20 -224 86 q-156 86 -294 -74 z" fill="#1f6f78" fill-opacity=".30"/>
    <path d="M360 552 q134 -48 278 -26" stroke="#5eead4" stroke-opacity=".24" stroke-width="3" fill="none"/>
    <circle cx="1040" cy="510" r="5" fill="#5eead4" fill-opacity=".6"/>
    <!-- 远鲲 -->
    <path d="M1000 690 q118 -58 284 -42 q74 8 132 42 q-58 -12 -112 -5 q-76 12 -132 52 q-90 52 -172 -47 z" fill="#15525a" fill-opacity=".22"/>
    <!-- 海浪层(底部全宽) -->
    <path d="M0 600 Q 200 562 400 600 T 800 600 T 1200 600 T 1600 600 L1600 900 L0 900 Z" fill="url(#bmSea)"/>
    <path d="M0 690 Q 200 658 400 690 T 800 690 T 1200 690 T 1600 690 L1600 900 L0 900 Z" fill="#0b7283" fill-opacity=".26"/>
    <path d="M0 780 Q 200 752 400 780 T 800 780 T 1200 780 T 1600 780 L1600 900 L0 900 Z" fill="#073b43" fill-opacity=".38"/>
    <path d="M0 840 Q 200 818 400 840 T 800 840 T 1200 840 T 1600 840 L1600 900 L0 900 Z" fill="#04262b" fill-opacity=".48"/>
  </svg>
</div>
<div class="login-bg">
  <div class="login-art">
    <a class="brand" href="index.html" style="text-decoration:none;display:flex;gap:10px;align-items:center">
      <span class="brand-mark">AL</span>
      <span><b class="brand-name" style="color:var(--fg-hi)">Arrow Lake</b><div class="brand-sub">数据湖仓控制台</div></span>
    </a>
    <div style="position:relative;margin:auto 0">
      <h1 style="font-size:clamp(1.8rem,1.2rem+1.4vw,2.8rem);font-weight:800;line-height:1.1;margin:var(--s4) 0;letter-spacing:-.02em">一个湖仓<br/><span style="background:linear-gradient(120deg,var(--teal-bright),var(--info));-webkit-background-clip:text;background-clip:text;color:transparent"> &nbsp;&nbsp;装下检索 · 分析 · 智能</span></h1>
      <p class="muted" style="max-width:46ch">文本 / 图像 / 视频多模态原生 · 向量检索 + RAG + 知识图谱 </p>
    </div>
  </div>
  <div class="login-form">
    <div class="login-card">
      <h2 style="margin:0 0 var(--s2)">登录控制台</h2>
      <!-- <p class="muted" style="margin:0 0 var(--s4);font-size:.85rem">用户名密码 → libSQL IdentityStore → JWT pair(API Key 作应急 / 开发)</p> -->

      <!-- 用户名密码(默认 · v1.9.1:接 /auth/login → libSQL IdentityStore pbkdf2 验证)-->
      <form id="formPwd" class="col">
        <div class="field"><label>用户名</label><input class="input" id="username" placeholder="sysop" autocomplete="username" autofocus/></div>
        <div class="field"><label>密码</label><input class="input" id="password" type="password" placeholder="••••••••" autocomplete="current-password"/></div>
        <div class="field"><label>验证码 <span class="muted" style="font-weight:400;text-transform:none;letter-spacing:0">(<span id="capQ" class="mono">—</span> = ?)</span></label><input class="input" id="captcha" inputmode="numeric" placeholder="计算结果" autocomplete="off"/></div>
        <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center" id="loginPwdBtn"><i class="placeholder" data-ic="key"></i> 登录</button>
        <p class="muted" style="font-size:.72rem;margin-top:var(--s2)">忘记密码?请联系管理员生成一次性重置 token(30 分钟内有效)。</p>
        <!-- <p class="muted" style="font-size:.72rem;margin-top:var(--s2)">用户名密码 → libSQL IdentityStore(pbkdf2)→ JWT pair。</p> -->
      </form>

      <div class="divider"></div>
      <!-- <div class="flex between" style="font-size:.72rem;color:var(--fg-lo)"><span>JWT HS256</span><span>Bearer + X-API-Key</span><span>SELECT 只读</span></div> -->
      <a href="index.html" style="display:block;text-align:center;margin-top:var(--s4);font-size:.82rem;color:var(--fg-lo);text-decoration:none">→ 先看 <span style="color:var(--teal-bright);font-weight:600">产品介绍</span>(免登录 · 架构全景 + 能力)</a>
    </div>
  </div>
</div>

<script src="assets/console-layout.js"></script>
<script type="module">
import { isLoggedIn } from "./src/auth.js";
import { toast } from "./src/ui/toast.js";

if (isLoggedIn()) location.href = "datasets.html";

const $ = (s) => document.querySelector(s);

// 算术验证码(纯前端,防简单机器人/暴力登录)
let _capAns = 0;
function newCaptcha() {
  const a = 1 + Math.floor(Math.random() * 9), b = 1 + Math.floor(Math.random() * 9);
  const plus = Math.random() < 0.5;
  _capAns = plus ? a + b : a - b;
  $("#capQ").textContent = `${a} ${plus ? "+" : "−"} ${b}`;
  $("#captcha").value = "";
}
newCaptcha();

// v1.9.1 用户名密码登录
$("#formPwd").addEventListener("submit", async (e) => {
  e.preventDefault();
  const u = $("#username").value.trim(), p = $("#password").value;
  if (!u || !p) { toast("请输入用户名和密码", "warn"); return; }
  if (parseInt($("#captcha").value, 10) !== _capAns) { toast("验证码错误,请重算", "warn"); newCaptcha(); $("#captcha").focus(); return; }
  const btn = $("#loginPwdBtn");
  btn.disabled = true; btn.textContent = "登录中…";
  try {
    const { loginWithPassword } = await import("./src/auth.js");
    await loginWithPassword(u, p);
    location.href = "datasets.html";
  } catch (err) {
    toast("登录失败: " + err.message, "danger", 5000);
    $("#password").focus();
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="placeholder" data-ic="key"></i> 登录';
  }
});
</script>
<div style="position:fixed;left:0;right:0;bottom:16px;text-align:center;z-index:5;pointer-events:none;white-space:nowrap;padding:0 12px;font-size:clamp(1.2rem,1rem+.6vw,1.6rem)">
  <span style="font-weight:700;letter-spacing:.03em;background:linear-gradient(118deg,#7ff0dc,#7dd3fc 52%,#fcd34d);-webkit-background-clip:text;background-clip:text;color:transparent">北冥有鱼,其名为鲲</span>
  <span style="color:#9fd8cf;font-size:.9em"> —— 湖仓纳万物于渊;</span>
  <span style="color:#5eead4;margin:0 12px;opacity:.7">·</span>
  <span style="font-weight:700;letter-spacing:.03em;background:linear-gradient(118deg,#7ff0dc,#7dd3fc 52%,#fcd34d);-webkit-background-clip:text;background-clip:text;color:transparent">化而为鹏,怒而飞</span>
  <span style="color:#9fd8cf;font-size:.9em"> —— 数据腾跃为洞察。</span>
</div>
</body>
</html>
