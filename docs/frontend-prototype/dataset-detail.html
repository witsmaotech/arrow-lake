<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>papers · 数据集工作区 · Arrow Lake</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css"/><link rel="stylesheet" href="assets/app.css"/>
</head>
<body>
<div id="app">
<main class="main">
  <div class="page">
    <!-- breadcrumb + header -->
    <div class="flex between wrap">
      <div class="flex">
        <a class="btn btn-icon btn-ghost" href="datasets.html" aria-label="返回"><i class="placeholder" data-ic="chevron" style="transform:rotate(180deg)"></i></a>
        <div>
          <div class="crumb"><a href="datasets.html">数据集</a> <span class="sep">/</span> <b>papers</b></div>
          <h1 class="flex" style="gap:10px;margin-top:2px"><i class="placeholder" data-ic="database"></i> papers <span class="tag teal">Lance</span> <span class="tag ok"><span class="lamp ok"><i></i>KG 已建</span></span></div>
        </div>
      </div>
      <div class="flex">
        <button class="btn btn-ghost btn-sm" onclick="openApi('查询数据集信息','curl -s $API/api/v1/datasets/papers','lake.datasets.info(\"papers\")')"><i class="placeholder" data-ic="code"></i> API</button>
        <button class="btn btn-ghost btn-sm"><i class="placeholder" data-ic="refresh"></i> 刷新</button>
        <a class="btn btn-primary btn-sm" href="#ingest"><i class="placeholder" data-ic="ingest"></i> 追加数据</a>
      </div>
    </div>

    <!-- KPI -->
    <div class="panel"><div class="panel-b kpi-row">
      <div class="kpi"><div class="label">行数</div><div class="val">184,203</div><div class="delta up">+1,204 ↑ 本周</div></div>
      <div class="kpi"><div class="label">大小</div><div class="val">12.4 GB</div><div class="delta">向量+blob</div></div>
      <div class="kpi"><div class="label">向量列</div><div class="val">2</div><div class="delta">text_emb · img_emb</div></div>
      <div class="kpi"><div class="label">KG 实体</div><div class="val">34.2K</div><div class="delta up">kg_papers</div></div>
    </div></div>

    <!-- Tabs -->
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="overview">概览</button>
      <button class="tab" data-tab="schema">Schema</button>
      <button class="tab" data-tab="data">数据</button>
      <button class="tab" data-tab="search">检索</button>
      <button class="tab" data-tab="index">索引</button>
      <button class="tab" data-tab="kg">知识图谱</button>
      <button class="tab" data-tab="quality">质量</button>
      <button class="tab" data-tab="lineage">血缘</button>
      <button class="tab" data-tab="export">导出</button>
      <button class="tab" data-tab="acl">权限</button>
    </div>

    <!-- Tab panels -->
    <div id="panels"></div>
  </div>
</main>
</div>
<script src="assets/layout.js"></script>
<script>
const {renderShell,icon,areachart,sparkline,openApi}=window;
renderShell({active:'datasets',crumb:'<a href="datasets.html">数据集</a> <span class="sep">/</span> <b>papers</b>'});

const TAB={
overview:()=>`<div class="grid cols-2-1">
  <div class="panel"><div class="panel-h"><i class="ph" data-ic="pulse"></i>${ic('pulse')}<h3>写入与查询趋势 · 14 天</h3></div><div class="panel-b"><div id="ovChart"></div></div></div>
  <div class="col">
    <div class="panel"><div class="panel-h">${ic('database')}<h3>数据集元数据</h3></div><div class="panel-b">
      <table class="tbl"><tbody>
        ${[['格式','Lance v2 (Arrow 列式)'],['分块策略','Chonkie Semantic'],['嵌入模型','Qwen3-Embedding 0.6B · 1024 维'],['索引','IVF_PQ · num_sub_vectors=32 · HNSW'],['创建','2026-05-12'],['更新','2026-07-04 12:04'],['标签','research · nlp · cv']].map(r=>`<tr><td class="muted">${r[0]}</td><td>${r[1]}</td></tr>`).join('')}
      </tbody></table>
    </div></div>
    <div class="panel"><div class="panel-h">${ic('kg')}<h3>KG 状态 · kg_papers</h3><span class="actions"><a class="btn btn-ghost btn-sm" href="kg.html">打开</a></span></div><div class="panel-b">
      <div class="grid g-3"><div class="muted">实体 <b class="readout">34,213</b></div><div class="muted">关系 <b class="readout">88,540</b></div><div class="muted">schema <b class="readout" style="color:var(--ok)">v3</b></div></div>
      <div class="bar amber" style="margin-top:8px"><i style="width:100%;background:var(--ok)"></i></div><div class="pct">已构建完成 · 2026-07-03</div>
    </div></div>
  </div>
</div>`,

schema:()=>`<div class="panel flush"><div class="panel-h">${ic('database')}<h3>Schema · 12 列</h3><div class="actions"><button class="btn btn-ghost btn-sm" onclick="openApi('Schema 迁移','curl -X POST $API/api/v1/datasets/papers/schema/migrate -d @migrate.json','lake.datasets.schema_migrate(\"papers\", diff)')">${ic('code')} 迁移</button></div></div>
<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>列</th><th>类型</th><th>可空</th><th>索引</th><th>说明</th></tr></thead><tbody>
${[['id','uuid','✕','BTREE','主键'],['title','string','✕','FTS','文档标题'],['text','string(large)','✕','FTS+jieba','正文/chunk'],['text_embedding','fixed_list<float>(1024)','✕','IVF_PQ','Qwen3 文本向量'],['image','binary','✓','—','原图 blob'],['image_embedding','fixed_list<float>(512)','✓','IVF_FLAT','CLIP 图像向量'],['doc_type','enum','✕','BITMAP','论文/专利/报告'],['source_url','string','✓','—','来源'],['page','int32','✕','—','页码'],['chunk_strategy','string','✕','—','分块策略'],['quality_score','float','✓','BTREE','NeMo 评分'],['created_at','timestamp','✕','BTREE','摄入时间']]
.map(r=>`<tr><td class="mono">${r[0]}</td><td><span class="tag ${r[0].includes('emb')?'teal':r[1].includes('list')?'info':''}">${r[1]}</span></td><td>${r[2]}</td><td>${r[3]?`<span class="tag">${r[3]}</span>`:'<span class="muted">—</span>'}</td><td class="muted">${r[4]}</td></tr>`).join('')}
</tbody></table></div></div>`,

data:()=>`<div class="panel flush"><div class="panel-h">${ic('database')}<h3>记录浏览</h3><span class="actions"><input class="input" placeholder="过滤 (下推到 Lance)…" style="width:220px"/><button class="btn btn-ghost btn-sm">${ic('filter')} 筛选</button></span></div>
<div style="overflow-x:auto"><table class="tbl"><thead><tr><th><input type="checkbox"/></th><th>id</th><th>title</th><th>doc_type</th><th>page</th><th>quality</th><th class="num">created</th></tr></thead><tbody>
${[[1,'Efficient Attention via Sparse...','paper',3,0.94],[2,'MLP-Mixer: An all-MLP Architecture','paper',7,0.88],[3,'图神经网络综述','report',12,0.79],[4,'Contrastive Learning Survey','paper',1,0.91],[5,'专利 CN-2024-XXX','patent',44,0.62],[6,'Vision Transformer 视觉','paper',22,0.85],[7,'自监督学习新进展','paper',9,0.77]]
.map(r=>`<tr><td><input type="checkbox"/></td><td class="mono muted">${r[0].toString().padStart(5,'0')}</td><td><a style="color:var(--fg-hi)">${r[2]}</a></td><td><span class="tag ${r[3]==='paper'?'teal':r[3]==='patent'?'amber':'info'}">${r[3]}</span></td><td class="mono">${r[4]}</td><td><div class="flex" style="gap:6px"><span class="bar" style="flex:1;max-width:60px"><i style="width:${r[5]*100}%;background:${r[5]>.85?'var(--ok)':r[5]>.7?'var(--warn)':'var(--danger)'}"></i></span><span class="pct">${r[5]}</span></div></td><td class="num mono">07-0${r[0]}</td></tr>`).join('')}
</tbody></table></div>
<div class="panel-h" style="border-top:1px solid var(--line-soft)"><span class="muted mono">显示 1–7 / 184,203</span><div class="actions"><button class="btn btn-ghost btn-sm">上一页</button><button class="btn btn-ghost btn-sm">下一页</button></div></div></div>`,

search:()=>`<div class="grid cols-3-fr">
  <div class="panel flush"><div class="panel-h">${ic('search')}<h3>快速检索 · papers</h3></div><div class="panel-b col">
    <select class="select" id="dsMode"><option value="hybrid">hybrid (RRF 推荐)</option><option value="vector">vector (向量 ANN)</option><option value="fts">fts (全文 BM25)</option><option value="faceted">faceted (分面)</option><option value="ensemble">ensemble (跨列)</option></select>
    <input class="input mono" value="高效注意力机制 sparse attention"/>
    <div class="flex"><span class="tag">top_k=10</span><span class="tag info">rerank 自动(hybrid)</span><span class="tag">doc_type=paper</span></div>
    <button class="btn btn-primary" onclick="alert('原型：POST /api/v1/datasets/papers/search/'+document.getElementById('dsMode').value)">${ic('search')} 检索</button>
  </div></div>
  <div class="col" id="results">
    ${[[0.94,'§3.2 · Sparse Transformer：通过稀疏注意力模式将复杂度降至 O(n√n)','paper · p3'],['0.89,'§4.1 · Longformer：滑动窗口 + 全局 token 兼顾局部与长程','paper · p7'],['0.81,'§2 · Linformer：低秩近似自注意力矩阵','paper · p1'],['0.76,'§5 · Big Bird：随机+窗口+全局的理论统一','paper · p22']]
    .map(r=>`<div class="panel"><div class="panel-b"><div class="flex between"><span class="flex" style="gap:8px"><span class="bar" style="width:80px"><i style="width:${r[0]*100}%;background:var(--teal-bright)"></i></span><b class="readout">${r[0]}</b></span><span class="muted mono" style="font-size:.7rem">${r[2]}</span></div><div style="margin-top:6px;color:var(--fg-md);font-size:.85rem">${r[1]}</div><div class="flex" style="margin-top:6px"><span class="tag">向量 0.91</span><span class="tag amber">BM25 0.74</span><span class="tag info">rerank↑</span></div></div></div>`).join('')}
  </div>
</div>`,

index:()=>`<div class="panel flush"><div class="panel-h">${ic('database')}<h3>索引 · papers</h3><span class="sub">检索前置条件 · 无索引则该列不可检索</span><div class="actions"><button class="btn btn-primary btn-sm" onclick="openApi('建向量索引','curl -X POST $API/api/v1/datasets/papers/search/vector','lake.index.create(\"papers\",\"IVF_PQ\",vector_column=\"text_embedding\")')">${ic('plus')} 新建索引</button><a class="btn btn-ghost btn-sm" href="embeddings.html">嵌入与索引管理</a></div></div>
<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>列</th><th>索引类型</th><th>参数</th><th>状态</th><th></th></tr></thead><tbody>
${[['text_embedding','VectorIndex · IVF_PQ','num_sub_vectors=32 · nprobes=20','ok'],['text','FtsIndex · Tantivy','tokenizer=jieba','ok'],['doc_type','ScalarIndex · BITMAP','','ok'],['quality_score','ScalarIndex · BTREE','','ok'],['image_embedding','VectorIndex · IVF_FLAT','nprobes=10','warn'],['source_url','FacetsIndex','','warn']]
.map(r=>`<tr><td class="mono">${r[0]}</td><td><span class="tag ${r[1].includes('Vector')?'teal':r[1].includes('Fts')?'amber':'info'}">${r[1]}</span></td><td class="muted mono" style="font-size:.72rem">${r[2]||'—'}</td><td><span class="lamp ${r[3]} ${r[3]==='ok'?'pulse':''}"><i></i>${r[3]==='ok'?'就绪':'建议重建'}</span></td><td><button class="btn btn-icon btn-ghost btn-sm">${ic('refresh')}</button></td></tr>`).join('')}
</tbody></table></div></div>`,

kg:()=>`<div class="panel"><div class="panel-h">${ic('kg')}<h3>知识图谱 · kg_papers</h3><span class="actions"><span class="tag teal">分图隔离</span><a class="btn btn-teal btn-sm" href="kg.html">在图谱浏览器打开</a></span></div><div class="panel-b">
  <svg viewBox="0 0 600 260" width="100%" height="260">
    <g stroke="var(--line-strong)" stroke-width="1" fill="none"><line x1="120" y1="80" x2="300" y2="130"/><line x1="300" y1="130" x2="480" y2="80"/><line x1="300" y1="130" x2="160" y2="210"/><line x1="300" y1="130" x2="440" y2="210"/><line x1="480" y1="80" x2="440" y2="210" stroke-dasharray="4 3"/></g>
    <g stroke="var(--teal)" stroke-width="1.5" fill="none"><line x1="120" y1="80" x2="300" y2="130"/><line x1="300" y1="130" x2="160" y2="210"/></g>
    ${node(120,80,'论文 A','var(--teal-bright)','var(--teal-soft)',18)}${node(300,130,'Sparse Attention','var(--warn)','#3a2a14',22)}${node(480,80,'作者 · MIT','var(--info)','#13303f',16)}${node(160,210,'数据集','var(--teal-bright)','var(--teal-soft)',15)}${node(440,210,'机构','var(--warn)','#3a2a14',15)}
    <g font-family="var(--font-mono)" font-size="9" fill="var(--fg-lo)"><text x="190" y="100">引用</text><text x="380" y="100">作者</text><text x="200" y="180">评估</text><text x="380" y="180">提出</text></g>
  </svg>
  <div class="grid g-4" style="margin-top:var(--s4)"><div class="muted">实体 <b class="readout">34,213</b></div><div class="muted">关系 <b class="readout">88,540</b></div><div class="muted">平均度 <b class="readout">5.2</b></div><div class="muted">8 traverser <b class="readout" style="color:var(--ok)">可用</b></div></div>
</div></div>`,

quality:()=>`<div class="grid g-3">
  <div class="panel"><div class="panel-h">${ic('quality')}<h3>质量报告</h3></div><div class="panel-b">
    <div class="flex between"><span>Schema 通过</span><b class="readout" style="color:var(--ok)">99.8%</b></div><div class="bar" style="margin:6px 0"><i style="width:99.8%;background:var(--ok)"></i></div>
    <div class="flex between"><span>精确去重</span><b class="readout">312 重复</b></div><div class="bar amber" style="margin:6px 0"><i style="width:0.2%"></i></div>
    <div class="flex between"><span>空值</span><b class="readout" style="color:var(--warn)">1.2%</b></div><div class="bar amber" style="margin:6px 0"><i style="width:1.2%"></i></div>
    <div class="flex between"><span>质量分均值</span><b class="readout">0.83</b></div><div class="bar"><i style="width:83%"></i></div>
  </div></div>
  <div class="panel"><div class="panel-h">${ic('scale')}<h3>列分布</h3></div><div class="panel-b"><table class="tbl"><tbody>${[['doc_type','5 类'],['page','1–552'],['quality_score','0.41–0.99']].map(r=>`<tr><td class="mono">${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="panel"><div class="panel-h">${ic('check')}<h3>质量规则</h3><div class="actions"><button class="btn btn-ghost btn-sm">${ic('plus')} 新规则</button></div></div><div class="panel-b col">${[['title 非空','ok','启用'],['quality ≥ 0.5','ok','启用'],['embedding 维度 1024','ok','启用'],['source_url 格式','warn','告警']].map(r=>`<div class="flex between"><span class="lamp ${r[1]}"><i></i>${r[0]}</span><span class="muted mono" style="font-size:.7rem">${r[2]}</span></div>`).join('')}</div></div>
</div>`,

lineage:()=>`<div class="panel"><div class="panel-h">${ic('lineage')}<h3>数据血缘</h3></div><div class="panel-b">
  <svg viewBox="0 0 600 200" width="100%" height="200">
    <g stroke="var(--teal)" stroke-width="1.5" fill="none"><path d="M40 100 H140"/><path d="M200 100 H300"/><path d="M360 100 H460"/></g>
    <g stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="4 3"><path d="M520 100 H560"/></g>
    ${node(20,100,'PDF','var(--info)','#13303f',0,'rect')}${node(170,100,'chunk','var(--teal-bright)','var(--teal-soft)',0,'rect')}${node(330,100,'text_emb','var(--warn)','#3a2a14',0,'rect')}${node(490,100,'papers','var(--ok)','#0f2a18',0,'rect')}
    <g font-family="var(--font-mono)" font-size="9" fill="var(--fg-lo)"><text x="70" y="92">摄取</text><text x="230" y="92">分块</text><text x="390" y="92">嵌入</text></g>
  </svg>
  <div class="flex wrap" style="margin-top:var(--s3)"><span class="tag">来源 · 552 页 PDF</span><span class="tag">策略 · Chonkie Semantic</span><span class="tag">模型 · Qwen3-Emb</span><span class="tag info">HMAC ✓ 防篡改</span></div>
</div></div>`,

export:()=>`<div class="grid g-2">
  <div class="panel"><div class="panel-h">${ic('file')}<h3>导出任务</h3><div class="actions"><button class="btn btn-primary btn-sm" onclick="openApi('导出 parquet','curl -X POST $API/api/v1/datasets/papers/export -d \'{\"format\":\"parquet\"}\']','lake.export(\"papers\", fmt=\"parquet\")')">${ic('plus')} 新导出</button></div></div><div class="panel-b col">
    ${[['papers_20260704.parquet','done','2.1 GB'],['papers_csv_part1.csv','done','480 MB'],['papers_with_emb.parquet','run','31%']].map(f=>`<div class="flex between"><span class="flex" style="gap:8px"><span class="lamp ${f[1]==='done'?'ok':'warn'} ${f[1]==='run'?'pulse':''}"><i></i><span class="mono" style="font-family:var(--font-mono)">${f[0]}</span></span></span><span class="muted mono">${f[2]}</span></div>`).join('')}
  </div></div>
  <div class="panel"><div class="panel-h">${ic('file')}<h3>格式选项</h3></div><div class="panel-b"><div class="flex wrap" style="gap:var(--s2)"><span class="tag teal">parquet</span><span class="tag">csv</span><span class="tag">json</span><span class="tag">arrow</span></div><div class="muted" style="margin-top:var(--s3)">投影列 · 过滤条件 · 分块大小可配；导出走异步任务，可下载。</div></div></div>
</div>`,

acl:()=>`<div class="grid cols-2-1">
  <div class="panel flush"><div class="panel-h">${ic('admin')}<h3>DatasetACL · papers</h3><div class="actions"><button class="btn btn-ghost btn-sm">${ic('plus')} 授权</button></div></div>
  <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>主体</th><th>读</th><th>写</th><th>删</th><th>列脱敏</th></tr></thead><tbody>
  ${[['role:viewer','✓','✕','✕','source_url'],['role:editor','✓','✓','✕','—'],['team:research','✓','✓','✕','—'],['user:alice','✓','✓','✓','—']].map(r=>`<tr><td class="mono">${r[0]}</td><td>${ok(r[1])}</td><td>${ok(r[2])}</td><td>${ok(r[3])}</td><td>${r[4]==='—'?'<span class="muted">—</span>':`<span class="tag amber">${r[4]}</span>`}</td></tr>`).join('')}
  </tbody></table></div></div>
  <div class="panel"><div class="panel-h">${ic('warn')}<h3>危险区</h3></div><div class="panel-b col">
    <div class="muted">删除数据集将一并清除 <code class="mono">kg_papers</code> 图谱（drop-on-delete，零残留）。</div>
    <button class="btn btn-danger" onclick="confirm('确认删除 papers 及其 kg_papers 图？')">${ic('x')} 删除数据集</button>
  </div></div>
</div>`,
};

function ic(n){return '<i class="placeholder" data-ic="'+n+'"></i>'}  // icon handled by data-ic via the ph class fallback
function node(x,y,label,fg,bg,r=14,shape='circle'){
  const w=label.length*7+16;
  if(shape==='rect')return `<g><rect x="${x-w/2}" y="${y-12}" width="${w}" height="24" rx="6" fill="${bg}" stroke="${fg}"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" fill="${fg}" font-family="var(--font-mono)">${label}</text></g>`;
  return `<g><circle cx="${x}" cy="${y}" r="${r+label.length*0.4}" fill="${bg}" stroke="${fg}" stroke-width="1.5"/><text x="${x}" y="${y+3}" text-anchor="middle" font-size="${r>16?10:9}" fill="${fg}" font-family="var(--font-mono)">${label}</text></g>`;
}
function ok(v){return v==='✓'?`<span class="lamp ok"><i></i></span>`:`<span class="lamp"><i style="background:var(--fg-lo);box-shadow:none"></i></span>`}

const panels=$('#panels');
function show(tab){panels.innerHTML=TAB[tab]();window.applyIcons&&applyIcons(panels);if(tab==='overview'){const ov=[];for(let i=0;i<30;i++)ov.push(2000+Math.round(Math.sin(i/2.5)*800+Math.random()*600+i*40));$('#ovChart')&&(panels.querySelector('#ovChart').innerHTML=areachart(ov,560,160,'var(--teal-bright)'))}}
show('overview');
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;$$('.tab').forEach(t=>t.classList.remove('active'));b.classList.add('active');show(b.dataset.tab)});
function $(s){return document.querySelector(s)}function $$(s){return[...document.querySelectorAll(s)]}
</script>
</body>
</html>
