<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <!-- Arrow marker -->
    <marker id="arrowhead" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <!-- Cyan arrow marker for restore -->
    <marker id="arrowhead-cyan" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <!-- Glow filters -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#60a5fa" flood-opacity="0.15"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#22d3ee" flood-opacity="0.15"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#34d399" flood-opacity="0.15"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-violet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#a78bfa" flood-opacity="0.15"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="#0f172a"/>
  <rect width="800" height="1000" fill="url(#grid)"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-family="'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace" font-size="18" font-weight="700" fill="#e2e8f0" letter-spacing="1.5">Backup &amp; Restore Flow</text>
  <line x1="200" y1="48" x2="600" y2="48" stroke="#334155" stroke-width="1"/>

  <!-- Column headers -->
  <text x="240" y="74" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8" letter-spacing="1">BACKUP PIPELINE</text>
  <text x="640" y="74" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8" letter-spacing="1">RESTORE PIPELINE</text>

  <!-- Vertical divider -->
  <line x1="440" y1="64" x2="440" y2="980" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============================================================ -->
  <!-- BACKUP FLOW (Left Column, centered at x=240)                -->
  <!-- ============================================================ -->

  <!-- Step 1: Trigger (Start, cyan) -->
  <rect x="110" y="90" width="260" height="56" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow-cyan)"/>
  <text x="240" y="112" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#22d3ee" font-weight="700">TRIGGER</text>
  <text x="240" y="128" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#67e8f9">CronJob 02:00 UTC  |  POST /api/v1/backup/create</text>

  <!-- Arrow 1→2 -->
  <line x1="240" y1="146" x2="240" y2="170" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Step 2: Collect Dataset List (process, blue) -->
  <rect x="110" y="174" width="260" height="50" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5" filter="url(#glow-blue)"/>
  <text x="240" y="195" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60a5fa" font-weight="600">Collect Dataset List</text>
  <text x="240" y="211" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#93c5fd">Scan Lance base URI for tables</text>

  <!-- Arrow 2→3 -->
  <line x1="240" y1="224" x2="240" y2="248" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Step 3: Export Lance Version (process, blue) with loop annotation -->
  <rect x="110" y="252" width="260" height="62" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5" filter="url(#glow-blue)"/>
  <text x="240" y="273" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60a5fa" font-weight="600">Export Lance Version</text>
  <text x="240" y="289" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#93c5fd">Copy dataset files to backup prefix</text>
  <text x="240" y="305" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#93c5fd" font-style="italic">[for each dataset]</text>

  <!-- Loop annotation bracket -->
  <path d="M 378 256 Q 390 256 390 268 L 390 296 Q 390 308 378 308" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="400" y="286" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">loop</text>

  <!-- Arrow 3→4 -->
  <line x1="240" y1="314" x2="240" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Step 4: SHA-256 Chunked Hashing (verification, emerald) -->
  <rect x="110" y="344" width="260" height="62" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" filter="url(#glow-emerald)"/>
  <text x="240" y="365" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399" font-weight="700">SHA-256 Chunked Hashing</text>
  <text x="240" y="381" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7">8 MB chunks per file</text>
  <text x="240" y="397" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7">Compute checksum during upload</text>

  <!-- Arrow 4→5 -->
  <line x1="240" y1="406" x2="240" y2="430" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Step 5: Generate Manifest (process, blue) -->
  <rect x="95" y="434" width="290" height="108" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5" filter="url(#glow-blue)"/>
  <text x="240" y="455" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60a5fa" font-weight="600">Generate Manifest</text>
  <line x1="115" y1="462" x2="365" y2="462" stroke="#334155" stroke-width="0.5"/>
  <text x="240" y="478" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#93c5fd">BackupManifest</text>
  <text x="120" y="494" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">datasets: [{name, version, rows, file_hashes}]</text>
  <text x="120" y="508" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">blob_prefixes: [{prefix, object_count}]</text>
  <text x="120" y="522" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">lance_base_uri, total_size_bytes</text>
  <text x="120" y="536" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">status: "complete" | "partial"</text>

  <!-- Arrow 5→6 -->
  <line x1="240" y1="542" x2="240" y2="568" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Step 6: Atomic Upload (process, blue) -->
  <rect x="110" y="572" width="260" height="62" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5" filter="url(#glow-blue)"/>
  <text x="240" y="593" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60a5fa" font-weight="600">Atomic Upload</text>
  <text x="240" y="609" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#93c5fd">1. Upload manifest.json.staging</text>
  <text x="240" y="623" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#93c5fd">2. Copy staging → manifest.json</text>
  <text x="240" y="637" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#93c5fd">3. Delete staging (finally block)</text>

  <!-- Arrow 6→7 -->
  <line x1="240" y1="634" x2="240" y2="658" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Step 7: Storage (violet) - S3/MinIO bucket -->
  <rect x="125" y="662" width="230" height="46" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow-violet)"/>
  <text x="240" y="683" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a78bfa" font-weight="600">S3 / MinIO Bucket</text>
  <text x="240" y="699" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#c4b5fd">backups/{backup_id}/</text>

  <!-- Arrow 7→8 -->
  <line x1="240" y1="708" x2="240" y2="732" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Step 8: Return BackupInfo (end, cyan) -->
  <rect x="95" y="736" width="290" height="74" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow-cyan)"/>
  <text x="240" y="757" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#22d3ee" font-weight="700">RETURN BackupInfo</text>
  <line x1="115" y1="764" x2="365" y2="764" stroke="#0e7490" stroke-width="0.5"/>
  <text x="120" y="780" font-family="'JetBrains Mono', monospace" font-size="8" fill="#67e8f9">frozen dataclass</text>
  <text x="120" y="793" font-family="'JetBrains Mono', monospace" font-size="8" fill="#67e8f9">backup_id, created_at, datasets</text>
  <text x="120" y="806" font-family="'JetBrains Mono', monospace" font-size="8" fill="#67e8f9">blob_prefixes, total_size_bytes, status</text>

  <!-- ============================================================ -->
  <!-- RESTORE FLOW (Right Column, centered at x=640)              -->
  <!-- ============================================================ -->

  <!-- Step R1: Receive backup_id (start, cyan) -->
  <rect x="510" y="90" width="260" height="56" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow-cyan)"/>
  <text x="640" y="112" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#22d3ee" font-weight="700">RECEIVE BACKUP_ID</text>
  <text x="640" y="128" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#67e8f9">POST /api/v1/backup/{id}/restore</text>

  <!-- Arrow R1→R2 -->
  <line x1="640" y1="146" x2="640" y2="174" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead-cyan)" opacity="0.7"/>

  <!-- Step R2: Download Manifest (process, blue) -->
  <rect x="510" y="178" width="260" height="50" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5" filter="url(#glow-blue)"/>
  <text x="640" y="199" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60a5fa" font-weight="600">Download Manifest</text>
  <text x="640" y="215" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#93c5fd">Load backups/{id}/manifest.json</text>

  <!-- Arrow R2→R3 -->
  <line x1="640" y1="228" x2="640" y2="256" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead-cyan)" opacity="0.7"/>

  <!-- Step R3: Verify SHA-256 (emerald) -->
  <rect x="510" y="260" width="260" height="62" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" filter="url(#glow-emerald)"/>
  <text x="640" y="281" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399" font-weight="700">Verify SHA-256</text>
  <text x="640" y="297" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7">Download each file, hash, compare</text>
  <text x="640" y="313" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7">Fail fast on mismatch</text>

  <!-- Arrow R3→R4 -->
  <line x1="640" y1="322" x2="640" y2="350" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead-cyan)" opacity="0.7"/>

  <!-- Step R4: Restore Lance Datasets (process, blue) -->
  <rect x="510" y="354" width="260" height="62" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5" filter="url(#glow-blue)"/>
  <text x="640" y="375" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60a5fa" font-weight="600">Restore Lance Datasets</text>
  <text x="640" y="391" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#93c5fd">Copy backup → lance_base_uri</text>
  <text x="640" y="407" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#93c5fd">[per dataset in manifest]</text>

  <!-- Arrow R4→R5 -->
  <line x1="640" y1="416" x2="640" y2="444" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead-cyan)" opacity="0.7"/>

  <!-- Step R5: Restore Blob Prefixes (process, blue) -->
  <rect x="510" y="448" width="260" height="50" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5" filter="url(#glow-blue)"/>
  <text x="640" y="469" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60a5fa" font-weight="600">Restore Blob Prefixes</text>
  <text x="640" y="485" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#93c5fd">Copy blobs/ → original prefix</text>

  <!-- Arrow R5→R6 -->
  <line x1="640" y1="498" x2="640" y2="526" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead-cyan)" opacity="0.7"/>

  <!-- Step R6: Verify Data Integrity (emerald) -->
  <rect x="510" y="530" width="260" height="50" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" filter="url(#glow-emerald)"/>
  <text x="640" y="551" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399" font-weight="700">Verify Data Integrity</text>
  <text x="640" y="567" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7">Row count + file hash cross-check</text>

  <!-- Arrow R6→R7 -->
  <line x1="640" y1="580" x2="640" y2="608" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead-cyan)" opacity="0.7"/>

  <!-- Step R7: Return BackupInfo (end, cyan) -->
  <rect x="510" y="612" width="260" height="50" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow-cyan)"/>
  <text x="640" y="633" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#22d3ee" font-weight="700">RETURN BackupInfo</text>
  <text x="640" y="649" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#67e8f9">status: "restored"</text>

  <!-- ============================================================ -->
  <!-- Cross-flow connection: Backup output feeds Restore input      -->
  <!-- ============================================================ -->
  <path d="M 385 752 Q 440 752 440 340 Q 440 118 510 118" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrowhead)"/>
  <text x="455" y="430" font-family="'JetBrains Mono', monospace" font-size="8" fill="#475569" transform="rotate(-90, 455, 430)">backup_id reference</text>

  <!-- ============================================================ -->
  <!-- Legend                                                        -->
  <!-- ============================================================ -->
  <rect x="100" y="840" width="600" height="130" rx="8" fill="rgba(15,23,42,0.8)" stroke="#1e293b" stroke-width="1"/>
  <text x="400" y="862" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" font-weight="600" letter-spacing="1">LEGEND</text>
  <line x1="160" y1="870" x2="640" y2="870" stroke="#1e293b" stroke-width="0.5"/>

  <!-- Legend: Trigger -->
  <rect x="140" y="882" width="16" height="12" rx="3" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="164" y="892" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Trigger / Endpoint</text>

  <!-- Legend: Process -->
  <rect x="140" y="904" width="16" height="12" rx="3" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="164" y="914" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Process Step</text>

  <!-- Legend: Verification -->
  <rect x="140" y="926" width="16" height="12" rx="3" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="164" y="936" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Verification / Checksum</text>

  <!-- Legend: Storage -->
  <rect x="380" y="882" width="16" height="12" rx="3" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text x="404" y="892" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Storage (S3 / MinIO)</text>

  <!-- Legend: Arrow -->
  <line x1="380" y1="910" x2="416" y2="910" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="424" y="914" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Data Flow</text>

  <!-- Legend: Dashed cross-ref -->
  <line x1="380" y1="932" x2="416" y2="932" stroke="#475569" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="424" y="936" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Cross-flow Reference</text>

  <!-- Version label -->
  <text x="400" y="988" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#334155">Arrow Lake v1.3.0 — Backup &amp; Restore Flow</text>
</svg>