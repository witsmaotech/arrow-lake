# 前后端联调 override:bind-mount 宿主 arrow_lake/ 源码进容器 + uvicorn --reload。
# 改 Python 源码秒级热重载,无需 rebuild 镜像;依赖/环境/代理/其它容器全保持不变。
# 前端 console/ 也 bind-mount 进 /app/console(StaticFiles 即时读,改 console/*.html|css|js 刷新浏览器即生效,免 rebuild)。
#
# 用法:
#   docker compose --project-directory deploy -p arrow-lake \
#     -f deploy/docker-compose.prod_minimal.yml \
#     -f deploy/docker-compose.dev.override.yml up -d api
#
# 联调结束、要出镜像时,去掉本 override 重 build:
#   docker compose --project-directory deploy -p arrow-lake \
#     -f deploy/docker-compose.prod_minimal.yml build api && \
#   docker compose --project-directory deploy -p arrow-lake \
#     -f deploy/docker-compose.prod_minimal.yml up -d api
#
# 注:
# - PYTHONPATH=/app 让 import arrow_lake 走挂载源码(/app/arrow_lake)而非镜像内
#   site-packages 的安装副本(Dockerfile 是非 editable install)。
# - gunicorn + UvicornWorker --workers 4 --reload:多 worker 保开发并发(单 worker
#   遇同步慢查询会占死 API),同时保留热重载(uvicorn 原生 --reload 与 --workers 互斥)。
#   gunicorn --reload 监听已加载模块;新增 .py 文件需二次修改或 restart 才触发。
# - bind mount 绕过容器 read_only,Python __pycache__ 可写入挂载目录。
services:
  api:
    command:
      - gunicorn
      - arrow_lake.api.app:create_app()
      - -k
      - uvicorn.workers.UvicornWorker
      - --workers
      - "4"
      - --timeout
      - "120"
      - --bind
      - 0.0.0.0:8000
      - --reload
      - --forwarded-allow-ips
      - 172.30.0.0/16
    environment:
      # v1.11.0: /data/lake/pylibs 暂存 rdflib+pyshacl(1.10.8 镜像 venv 无此依赖,
      # 挂载源码带 ontology 包但 import 需要库)——发版重建镜像后可去掉该前缀。
      PYTHONPATH: /data/lake/pylibs:/app
      HF_HUB_CACHE: /hf-hub
      HF_HUB_OFFLINE: "1"
      ARROW_LAKE__RAG__RERANKER_MODEL: "/bge-reranker"
      ARROW_LAKE__RAG__ENABLE_VERIFICATION: "true"
      ARROW_LAKE__HUGEGRAPH__HE_STRICT_DEFINITION: "true"
      ARROW_LAKE__MASKING__HMAC_KEY: "dev-live-test-key-0123456789abcdef"
    volumes:
      - type: bind
        source: ../arrow_lake
        target: /app/arrow_lake
      - type: bind
        source: ../console
        target: /app/console
        read_only: true
      - type: bind
        source: /home/witshine/.cache/huggingface/hub
        target: /hf-hub
        read_only: true
      - type: bind
        source: /home/witshine/.cache/modelscope/models/BAAI--bge-reranker-v2-m3/snapshots/master
        target: /bge-reranker
        read_only: true
