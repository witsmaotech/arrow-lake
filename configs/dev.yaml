storage:
  backend: minio
  s3_endpoint: "http://localhost:9000"
  s3_region: "us-east-1"

compute:
  gpu_enabled: false
  num_workers: 2

observability:
  metrics_enabled: true
  metrics_port: 8000
  metrics_path: "/metrics"
  log_level: DEBUG

http:
  timeout_seconds: 30.0
  max_retries: 3

media:
  thumbnail_size: 64
  preview_size: 512
  max_image_dimension: 4096

embedding:
  model: BAAI/bge-small-en-v1.5
  batch_size: 128
  backend: local

decode:
  quality: full

vector:
  metric: cosine
  default_index_type: IVF_PQ
  default_top_k: 10
  num_partitions: 256
  num_sub_vectors: 24
  num_bits: 8
  nprobes: 20
  max_nprobes: 256

fts:
  default_top_k: 10
  fts_column: text_content
  stem: true
  remove_stop_words: true
  lower_case: true

hybrid:
  default_top_k: 10
  rrf_k: 60
  vector_top_k_multiplier: 3
  fts_top_k_multiplier: 3

olap:
  max_result_rows: 100000
  enable_predicate_pushdown: true
  enable_join: true

quality:
  enabled: true
  filter_mode: all
  schema_validation: lenient
  dead_letter_enabled: true
  text_min_chars: 1
  image_min_width: 64
  image_min_height: 64

workflow:
  max_retry_attempts: 3
  min_backoff_seconds: 1.0
  max_backoff_seconds: 60.0
  checkpoint_enabled: true
  ray_execution_enabled: false
  auto_tag_runs: true
  artifact_retention_days: 30
  schedule_cron: "0 8 * * *"

argo:
  namespace: default
  service_account: arrow-lake
  workflow_timeout: 3600
  image: arrow-lake:latest
  image_pull_policy: IfNotPresent
  artifact_storage: ""

autoscale:
  enabled: false
  min_workers: 0
  max_workers: 8
  scale_up_timeout_seconds: 300
  idle_timeout_seconds: 600
  spot_preference: 0.8
  gpu_increment: 0.5

lifecycle:
  enabled: false
  standard_to_ia_days: 30
  ia_to_glacier_days: 90
  glacier_expiration_days: 365
  excluded_prefixes:
    - "thumbnails/"
    - "previews/"
  glacier_retrieval_tier: Standard

faceted:
  max_facet_values: 50
  default_facet_columns:
    - "modality"
    - "source"
  facet_filter_columns:
    - "modality"
    - "source"
    - "quality_score"
    - "created_at"

ensemble:
  default_top_k: 10
  rrf_k: 60
  fusion_method: rrf
  candidate_multiplier: 3

lineage:
  enabled: true
  store_dataset: "_lineage_events"
  auto_record: true

audit:
  enabled: true
  hmac_secret_key: "dev-secret-key-change-in-prod"
  audit_dataset: "_audit_trail"
  auto_record_workflow: true
