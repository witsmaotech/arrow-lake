<text x="515.0" y="140" font-size="11" font-weight="700" fill="#60a5fa" text-anchor="middle">TaskManager</text>
<rect x="665.0" y="120" width="120" height="32" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.6"/>
<text x="725.0" y="140" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">RayWorker</text>
