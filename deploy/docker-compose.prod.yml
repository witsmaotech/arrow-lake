# Arrow Lake — Production Docker Compose
#
# All-in-one production deployment with workflow orchestration.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml ps
#   docker compose -f docker-compose.prod.yml logs -f api
#
# Run a Metaflow flow inside the API container:
#   docker compose -f docker-compose.prod.yml exec api \
#     /app/.venv/bin/python flows/ingest_flow.py run --source-path /data/input
#
# Scale Ray workers:
#   docker compose -f docker-compose.prod.yml up -d --scale ray-worker=4
#
# Required: .env file with secrets (see .env.example)
# Required: Docker Engine 24+ with Compose V2
#
# Security: All secrets must be set via .env — defaults are intentionally
#           unsafe for local dev only.  Production MUST override them.

# ==============================================================================
# Shared configuration
# ==============================================================================

x-arrow-lake: &arrow-lake
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    network: host
  image: arrow-lake:1.4.0
  restart: unless-stopped
  env_file:
    - path: ../.env
      required: false
  networks:
    - arrow-lake-net
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
      tag: "arrow-lake"
  tmpfs:
    - /tmp
    - /app/.cache
    - /app/.local
    - /home/arrowlake
    - /app/exports
  volumes:
    - duckdb-data:/app/.duckdb
  cap_drop:
    - ALL
  cap_add:
    - NET_BIND_SERVICE
  stop_grace_period: 30s
  read_only: true

x-storage-env: &storage-env
  ARROW_LAKE__STORAGE__BASE_URI: "${MINIO_BUCKET:-arrow-lake}"
  ARROW_LAKE__STORAGE__S3_ENDPOINT: "http://minio:9000"
  ARROW_LAKE__STORAGE__S3_BUCKET: "${MINIO_BUCKET:-arrow-lake}"
  ARROW_LAKE__STORAGE__BACKEND: "minio"
  ARROW_LAKE__OBSERVABILITY__METRICS_ENABLED: "true"
  ARROW_LAKE__EMBEDDING__MODEL_SOURCE: "modelscope"
  AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}"
  AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}"
  AWS_ENDPOINT_URL: "http://minio:9000"
  AWS_REGION: "${AWS_REGION:-us-east-1}"

x-metaflow-env: &metaflow-env
  METAFLOW_DEFAULT_METADATA: "local"
  METAFLOW_DATASTORE: "local"
  METAFLOW_DATASTORE_ROOT: "/data/metaflow"
  METAFLOW_DATATOOLS_S3_ROOT: "s3://arrow-lake/metaflow"
  METAFLOW_S3_ENDPOINT_URL: "http://minio:9000"

# ==============================================================================
# Services
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # Proxy Forwarder — WSL2 mirrored mode bridge to Windows host proxy
  # ---------------------------------------------------------------------------
  proxy-forwarder:
    image: alpine:${ALPINE_VERSION:-3.21}
    container_name: arrow-lake-proxy-forwarder
    restart: unless-stopped
    network_mode: host
    command: ["sh", "-c", "apk add --no-cache socat >/dev/null 2>&1 && echo 'proxy-forwarder: 0.0.0.0:17887 -> 127.0.0.1:${HOST_PROXY_PORT:-7887}' && socat TCP-LISTEN:17887,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:${HOST_PROXY_PORT:-7887}"]
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "1"
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 17887 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------------------
  # API Server
  # ---------------------------------------------------------------------------
  api:
    <<: [*arrow-lake]
    # container_name omitted — required for replicas > 1
    command: ["uvicorn", "arrow_lake.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "4", "--proxy-headers", "--forwarded-allow-ips", "*"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      <<: [*storage-env, *metaflow-env]
      ARROW_LAKE__API__ENABLED: "true"
      ARROW_LAKE__API__HOST: "0.0.0.0"
      ARROW_LAKE__API__API_KEY: "${ARROW_LAKE__API__API_KEY:-}"
      ARROW_LAKE__API__PORT: "8000"
      ARROW_LAKE__OBSERVABILITY__METRICS_PORT: "9091"
      ARROW_LAKE__OBSERVABILITY__LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      ARROW_LAKE__REDIS__URL: "redis://:${REDIS_PASSWORD:-redisprod}@redis:6379/0"
      ARROW_LAKE__REDIS__PASSWORD: "${REDIS_PASSWORD:-redisprod}"
      ARROW_LAKE__RATE_LIMIT__ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      ARROW_LAKE__RATE_LIMIT__DEFAULT_REQUESTS_PER_MINUTE: "${RATE_LIMIT_RPM:-60}"
      ARROW_LAKE__RATE_LIMIT__DEFAULT_BURST: "${RATE_LIMIT_BURST:-10}"
      HTTP_PROXY: "http://host.docker.internal:17887"
      HTTPS_PROXY: "http://host.docker.internal:17887"
      http_proxy: "http://host.docker.internal:17887"
      https_proxy: "http://host.docker.internal:17887"
      NO_PROXY: "127.0.0.1,localhost,host.docker.internal,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,172.19.0.0/16,172.30.0.0/16,minio,redis,ray-head,metaflow-metadata,metaflow-db,prometheus,grafana,jaeger,loki,promtail,hg-server,hg-pd,hg-store"
      no_proxy: "127.0.0.1,localhost,host.docker.internal,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,172.19.0.0/16,172.30.0.0/16,minio,redis,ray-head,metaflow-metadata,metaflow-db,prometheus,grafana,jaeger,loki,promtail,hg-server,hg-pd,hg-store"
      ARROW_LAKE__EMBEDDING__API_BASE: "${OLLAMA_API_BASE:-http://172.19.0.40:11434/v1}"
      ARROW_LAKE__HUGEGRAPH__HOST: "${HUGEGRAPH_HOST:-hg-server}"
      ARROW_LAKE__HUGEGRAPH__PORT: "${HUGEGRAPH_PORT:-8080}"
      # DuckDB performance tuning (v1.3.4)
      ARROW_LAKE__OLAP__PRESERVE_INSERTION_ORDER: "false"
      ARROW_LAKE__OLAP__TEMP_DIRECTORY: "/tmp/duckdb"
      ARROW_LAKE__OLAP__ENABLE_PROGRESS_BAR: "true"
      ARROW_LAKE__OLAP__QUERY_CACHE_ENABLED: "true"
      ARROW_LAKE__OLAP__QUERY_CACHE_TTL_SECONDS: "120"
      ARROW_LAKE__OLAP__PARQUET_ROW_GROUP_SIZE: "100000"
      # DuckDB horizontal scaling (v1.4)
      ARROW_LAKE__OLAP__INSTANCE_COUNT: "${API_REPLICAS:-1}"
    volumes:
      - duckdb-data:/app/.duckdb
      - lake-data:/data/lake
      - metaflow-store:/data/metaflow
      - /home/witshine/wits-projs/wits-infra-dintellihub/arrow_lake:/app/arrow_lake:ro
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
      hg-server:
        condition: service_healthy
        required: false
    deploy:
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-4G}
          cpus: "${API_CPU_LIMIT:-2.0}"
          pids: 512
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ---------------------------------------------------------------------------
  # Nginx — TLS reverse proxy + security headers
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:${NGINX_VERSION:-1.27}
    container_name: arrow-lake-nginx
    restart: unless-stopped
    networks:
      - arrow-lake-net
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${NGINX_MEMORY_LIMIT:-256M}
          cpus: "${NGINX_CPU_LIMIT:-0.5}"
          pids: 128
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
        tag: "arrow-lake-nginx"
    stop_grace_period: 10s

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2025-09-07T16-13-09Z}
    container_name: arrow-lake-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}"
    volumes:
      - minio-data:/data
    networks:
      - arrow-lake-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "arrow-lake-minio"
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: ${MINIO_MEMORY_LIMIT:-2G}
          cpus: "${MINIO_CPU_LIMIT:-1.0}"
          pids: 512
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 15s

  # ---------------------------------------------------------------------------
  # Volume Init — Fix named volume permissions for non-root user
  # ---------------------------------------------------------------------------
  volume-init:
    image: alpine:${ALPINE_VERSION:-3.21}
    container_name: arrow-lake-volume-init
    restart: "no"
    networks:
      - arrow-lake-net
    volumes:
      - lake-data:/data/lake
      - metaflow-store:/data/metaflow
    command: chown -R 999:999 /data/lake /data/metaflow

  # ---------------------------------------------------------------------------
  # MinIO Init — Create buckets on first start
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:${MINIO_MC_VERSION:-RELEASE.2025-08-13T08-35-41Z}
    container_name: arrow-lake-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - arrow-lake-net
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb local/${MINIO_BUCKET:-arrow-lake} --ignore-existing &&
      mc mb local/arrow-lake-metaflow --ignore-existing
      "

  # ---------------------------------------------------------------------------
  # Redis — Session coordination + JWT blacklist
  # ---------------------------------------------------------------------------
  redis:
    image: redis:${REDIS_VERSION:-7.4}
    container_name: arrow-lake-redis
    restart: unless-stopped
    networks:
      - arrow-lake-net
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redisprod}
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-1G}
          cpus: "${REDIS_CPU_LIMIT:-0.5}"
          pids: 256
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redisprod}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
        tag: "arrow-lake-redis"
    stop_grace_period: 10s

  # ---------------------------------------------------------------------------
  # Ray Head — Compute cluster head node
  # ---------------------------------------------------------------------------
  ray-head:
    <<: [*arrow-lake]
    container_name: arrow-lake-ray-head
    ports:
      - "${RAY_DASHBOARD_PORT:-8265}:8265"
    environment:
      <<: [*storage-env]
      ARROW_LAKE__COMPUTE__RAY_ADDRESS: "auto"
      HTTP_PROXY: "http://host.docker.internal:17887"
      HTTPS_PROXY: "http://host.docker.internal:17887"
      http_proxy: "http://host.docker.internal:17887"
      https_proxy: "http://host.docker.internal:17887"
      NO_PROXY: "127.0.0.1,localhost,host.docker.internal,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,172.19.0.0/16,172.30.0.0/16,minio,redis,ray-head,metaflow-metadata,metaflow-db,prometheus,grafana,jaeger,loki,promtail,hg-server,hg-pd,hg-store"
      no_proxy: "127.0.0.1,localhost,host.docker.internal,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,172.19.0.0/16,172.30.0.0/16,minio,redis,ray-head,metaflow-metadata,metaflow-db,prometheus,grafana,jaeger,loki,promtail,hg-server,hg-pd,hg-store"
    volumes:
      - lake-data:/data/lake
    shm_size: 256m
    command: >
      /app/.venv/bin/ray start
      --head
      --port=6379
      --dashboard-host=0.0.0.0
      --dashboard-port=8265
      --num-cpus=${RAY_HEAD_CPUS:-4}
      --block
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: ${RAY_HEAD_MEMORY_LIMIT:-8G}
          cpus: "${RAY_HEAD_CPU_LIMIT:-4.0}"
          pids: 2048
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/ray status --address 127.0.0.1:6379 2>&1 | grep -q 'node' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 60s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ---------------------------------------------------------------------------
  # Ray Worker — Compute workers (scale with --scale ray-worker=N)
  # ---------------------------------------------------------------------------
  ray-worker:
    <<: [*arrow-lake]
    restart: unless-stopped
    healthcheck:
      disable: true
    deploy:
      replicas: ${RAY_WORKER_REPLICAS:-2}
      resources:
        limits:
          memory: ${RAY_WORKER_MEMORY:-8G}
          cpus: "${RAY_WORKER_CPU_LIMIT:-4.0}"
          pids: 2048
        reservations:
          memory: 2G
    environment:
      <<: [*storage-env]
      ARROW_LAKE__COMPUTE__RAY_ADDRESS: "ray://ray-head:10001"
      HTTP_PROXY: "http://host.docker.internal:17887"
      HTTPS_PROXY: "http://host.docker.internal:17887"
      http_proxy: "http://host.docker.internal:17887"
      https_proxy: "http://host.docker.internal:17887"
      NO_PROXY: "127.0.0.1,localhost,host.docker.internal,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,172.19.0.0/16,172.30.0.0/16,minio,redis,ray-head,metaflow-metadata,metaflow-db,prometheus,grafana,jaeger,loki,promtail,hg-server,hg-pd,hg-store"
      no_proxy: "127.0.0.1,localhost,host.docker.internal,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,172.19.0.0/16,172.30.0.0/16,minio,redis,ray-head,metaflow-metadata,metaflow-db,prometheus,grafana,jaeger,loki,promtail,hg-server,hg-pd,hg-store"
    volumes:
      - lake-data:/data/lake
    shm_size: 256m
    command: >
      /app/.venv/bin/ray start
      --address=ray-head:6379
      --num-cpus=${RAY_WORKER_CPUS:-4}
      --block
    depends_on:
      ray-head:
        condition: service_healthy
    stop_grace_period: 60s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ---------------------------------------------------------------------------
  # Ray Worker (GPU) — GPU-enabled compute workers
  # ---------------------------------------------------------------------------
  ray-worker-gpu:
    <<: [*arrow-lake]
    restart: unless-stopped
    profiles: ["gpu"]
    healthcheck:
      disable: true
    deploy:
      replicas: ${RAY_GPU_WORKER_REPLICAS:-1}
      resources:
        limits:
          memory: ${RAY_GPU_WORKER_MEMORY:-8G}
          cpus: "${RAY_GPU_WORKER_CPU_LIMIT:-4.0}"
          pids: 2048
        reservations:
          memory: 2G
          devices:
            - capabilities: ["gpu"]
              count: ${GPU_COUNT_PER_WORKER:-1}
    environment:
      <<: [*storage-env]
      ARROW_LAKE__COMPUTE__RAY_ADDRESS: "ray://ray-head:10001"
    volumes:
      - lake-data:/data/lake
    shm_size: 256m
    command: >
      /app/.venv/bin/ray start
      --address=ray-head:6379
      --num-cpus=${RAY_GPU_WORKER_CPUS:-4}
      --num-gpus=${RAY_GPU_COUNT:-1}
      --block
    depends_on:
      ray-head:
        condition: service_healthy
    stop_grace_period: 60s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
  minio-backup:
    image: minio/mc:${MINIO_MC_VERSION:-RELEASE.2025-08-13T08-35-41Z}
    container_name: arrow-lake-minio-backup
    restart: "no"
    networks:
      - arrow-lake-net
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}"
      MINIO_ENDPOINT: "http://minio:9000"
      BACKUP_RETAIN_DAYS: "${BACKUP_RETAIN_DAYS:-7}"
    volumes:
      - ./scripts/backup-minio.sh:/usr/local/bin/backup-minio.sh:ro
      - minio-backup-data:/data/backups
    entrypoint: ["/bin/sh", "-c", "chmod +x /usr/local/bin/backup-minio.sh && /usr/local/bin/backup-minio.sh /data/backups/minio"]
    deploy:
      resources:
        limits:
          memory: ${BACKUP_MEMORY_LIMIT:-512M}
          cpus: "${BACKUP_CPU_LIMIT:-0.5}"
          pids: 64

  # ---------------------------------------------------------------------------
  # Prometheus — Metrics collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.54.1}
    container_name: arrow-lake-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - arrow-lake-net
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--web.listen-address=0.0.0.0:9090"
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEMORY_LIMIT:-1G}
          cpus: "${PROMETHEUS_CPU_LIMIT:-1.0}"
          pids: 64
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy 2>/dev/null || nc -z localhost 9090"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "arrow-lake-prometheus"
    stop_grace_period: 15s

  # ---------------------------------------------------------------------------
  # Grafana — Dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.3.0}
    container_name: arrow-lake-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - arrow-lake-net
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT:-512M}
          cpus: "${GRAFANA_CPU_LIMIT:-0.5}"
          pids: 64
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health 2>/dev/null || nc -z localhost 3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "arrow-lake-grafana"
    stop_grace_period: 15s

  # ---------------------------------------------------------------------------
  # Jaeger — Distributed tracing
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:${JAEGER_VERSION:-1.62}
    container_name: arrow-lake-jaeger
    restart: unless-stopped
    ports:
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
      - "${JAEGER_UI_PORT:-16686}:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - arrow-lake-net
    volumes:
      - jaeger-data:/tmp/jaeger
    deploy:
      resources:
        limits:
          memory: ${JAEGER_MEMORY_LIMIT:-1G}
          cpus: "${JAEGER_CPU_LIMIT:-1.0}"
          pids: 64
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ 2>/dev/null || nc -z localhost 16686"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "arrow-lake-jaeger"
    stop_grace_period: 15s

  # ==============================================================================
  # Loki + Promtail — Centralized log aggregation
  # ==============================================================================

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.0.0}
    container_name: arrow-lake-loki
    restart: unless-stopped
    networks:
      - arrow-lake-net
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml
    deploy:
      resources:
        limits:
          memory: ${LOKI_MEMORY_LIMIT:-512M}
          cpus: "${LOKI_CPU_LIMIT:-0.5}"
          pids: 64
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready 2>/dev/null || nc -z localhost 3100"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    stop_grace_period: 15s

  promtail:
    image: grafana/promtail:${PROMTAIL_VERSION:-3.0.0}
    container_name: arrow-lake-promtail
    restart: unless-stopped
    networks:
      - arrow-lake-net
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${PROMTAIL_MEMORY_LIMIT:-256M}
          cpus: "${PROMTAIL_CPU_LIMIT:-0.25}"
          pids: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 10s

  # ==============================================================================
  # HugeGraph — Graph database for Knowledge Graph + GraphRAG
  # ==============================================================================

  # ---------------------------------------------------------------------------
  # HugeGraph Server — All-in-one (embedded PD + Store + Server)
  # ---------------------------------------------------------------------------
  hg-server:
    image: hugegraph/hugegraph:${HUGEGRAPH_VERSION:-1.7.0}
    container_name: arrow-lake-hg-server
    hostname: hg-server
    restart: unless-stopped
    networks:
      - arrow-lake-net
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      HUGEGRAPH_STORAGE_BACKEND: "rocksdb"
      HUGEGRAPH_GRAPH: "hugegraph"
    ports:
      - "${HUGEGRAPH_PORT:-8089}:8080"
    volumes:
      - hg-server-data:/var/lib/hugegraph
    deploy:
      resources:
        limits:
          memory: ${HG_SERVER_MEMORY_LIMIT:-4G}
          cpus: "${HG_SERVER_CPU_LIMIT:-2.0}"
          pids: 512
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/graphs/hugegraph/schema"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
        tag: "arrow-lake-hg-server"
    stop_grace_period: 30s

  # ---------------------------------------------------------------------------
  # HugeGraph Hubble — Graph visualization dashboard
  # ---------------------------------------------------------------------------
  hg-hubble:
    image: hugegraph/hubble:${HG_HUBBLE_VERSION:-1.7.0}
    container_name: arrow-lake-hg-hubble
    hostname: hubble
    restart: unless-stopped
    networks:
      - arrow-lake-net
    depends_on:
      hg-server:
        condition: service_healthy
    ports:
      - "${HG_HUBBLE_PORT:-8088}:8088"
    deploy:
      resources:
        limits:
          memory: ${HG_HUBBLE_MEMORY_LIMIT:-2G}
          cpus: "${HG_HUBBLE_CPU_LIMIT:-1.0}"
          pids: 128
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "arrow-lake-hg-hubble"
    stop_grace_period: 15s

# ==============================================================================
# Networks
# ==============================================================================

networks:
  arrow-lake-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

# ==============================================================================
# Volumes
# ==============================================================================

volumes:
  minio-data:
    driver: local
  lake-data:
    driver: local
  duckdb-data:
    driver: local
  redis-data:
    driver: local
  metaflow-store:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  jaeger-data:
    driver: local
  hg-server-data:
    driver: local
  minio-backup-data:
    driver: local
  loki-data:
    driver: local
