openapi: 3.1.0
info:
  title: Arrow Lake REST API
  description: Unified multimodal data lakehouse REST API
  version: 1.5.3
paths:
  /health/live:
    get:
      tags:
      - system
      summary: Liveness probe
      description: Lightweight liveness check — returns 200 if process is running.
      operationId: health_live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Live Health Live Get
  /health/ready:
    get:
      tags:
      - system
      summary: Readiness probe
      description: Readiness check — verifies storage and dependencies are accessible.
      operationId: health_ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      tags:
      - system
      summary: Health check (backward compatible)
      description: 'Return service health status. Checks storage accessibility.


        Kept for backward compatibility. Prefer /health/live and /health/ready.'
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /metrics:
    get:
      tags:
      - system
      summary: Prometheus metrics
      description: Return Prometheus-formatted metrics.
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/version:
    get:
      tags:
      - system
      summary: Version and dependencies
      description: Return version, Python version, and optional dependency versions.
      operationId: version_info_api_v1_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Version Info Api V1 Version Get
  /api/v1/datasets/{name}/upload:
    post:
      tags:
      - datasets
      summary: Upload Files
      description: 'Upload files to MinIO for later ingestion (proxy mode).


        For better performance, prefer ``POST /{name}/upload/presign`` which

        returns presigned URLs for direct-to-MinIO upload.'
      operationId: upload_files_api_v1_datasets__name__upload_post
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,128}$
          title: Name
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_files_api_v1_datasets__name__upload_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/datasets/{name}/upload/presign:
    post:
      tags:
      - datasets
      summary: Presign Upload
      description: 'Generate presigned PUT URLs for direct-to-MinIO upload.


        Client uploads files directly to MinIO using the returned URLs,

        then calls an ingest endpoint with the returned blob keys.

        This avoids routing file data through the API server.'
      operationId: presign_upload_api_v1_datasets__name__upload_presign_post
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,128}$
          title: Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/datasets/{name}/upload/cleanup:
    delete:
      tags:
      - datasets
      summary: Cleanup Uploads
      description: 'Delete all uploaded blobs for a dataset from MinIO.


        Call after dataset deletion to prevent orphaned uploads from accumulating.'
      operationId: cleanup_uploads_api_v1_datasets__name__upload_cleanup_delete
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,128}$
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/datasets/{name}/ingest:
    post:
      tags:
