<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style B — Swiss Modern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
/* === viewport-base.css === */
html,body{height:100%;overflow-x:hidden}
html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
.slide{width:100vw;height:100vh;height:100dvh;overflow:hidden;scroll-snap-align:start;display:flex;flex-direction:column;position:relative}
.slide-content{flex:1;display:flex;flex-direction:column;justify-content:center;max-height:100%;overflow:hidden;padding:var(--slide-padding)}
:root{--title-size:clamp(1.5rem,5vw,4rem);--h2-size:clamp(1.25rem,3.5vw,2.5rem);--h3-size:clamp(1rem,2.5vw,1.75rem);--body-size:clamp(0.75rem,1.5vw,1.125rem);--small-size:clamp(0.65rem,1vw,0.875rem);--slide-padding:clamp(1rem,4vw,4rem);--content-gap:clamp(0.5rem,2vw,2rem);--element-gap:clamp(0.25rem,1vw,1rem)}
.card,.container,.content-box{max-width:min(90vw,1000px);max-height:min(80vh,700px)}
@media(max-height:700px){:root{--slide-padding:clamp(0.75rem,3vw,2rem);--content-gap:clamp(0.4rem,1.5vw,1rem);--title-size:clamp(1.25rem,4.5vw,2.5rem);--h2-size:clamp(1rem,3vw,1.75rem)}}
@media(max-height:600px){:root{--slide-padding:clamp(0.5rem,2.5vw,1.5rem);--content-gap:clamp(0.3rem,1vw,0.75rem);--title-size:clamp(1.1rem,4vw,2rem);--body-size:clamp(0.7rem,1.2vw,0.95rem)}.nav-dots,.keyboard-hint,.decorative{display:none}}
@media(max-height:500px){:root{--slide-padding:clamp(0.4rem,2vw,1rem);--title-size:clamp(1rem,3.5vw,1.5rem);--h2-size:clamp(0.9rem,2.5vw,1.25rem);--body-size:clamp(0.65rem,1vw,0.85rem)}}
@media(max-width:600px){:root{--title-size:clamp(1.25rem,7vw,2.5rem)}.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.2s!important}html{scroll-behavior:auto}}

/* === Swiss Modern Theme === */
:root {
  --white: #ffffff;
  --black: #0a0a0a;
  --red: #ff3300;
  --gray: #e5e5e5;
  --text-on-dark: #0a0a0a;
  --font-display: 'Archivo', sans-serif;
  --font-body: 'Nunito', sans-serif;
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-body); background: var(--white); color: var(--black); }

/* Asymmetric layout: left panel dark, right white */
.slide {
  background: var(--white);
  overflow: hidden;
}

/* Visible grid background */
.slide::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: 0;
}

/* Bold red vertical bar */
.red-bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: clamp(4px, 0.8vw, 10px);
  background: var(--red);
  z-index: 2;
}

/* Left dark panel — asymmetric Bauhaus */
.dark-panel {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: clamp(30vw, 35vw, 400px);
  background: var(--black);
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: clamp(1.5rem, 3vw, 3rem);
}
.dark-panel .panel-num {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(4rem, 12vw, 10rem);
  color: var(--red);
  line-height: 0.85;
  opacity: 0.9;
}
.dark-panel .panel-label {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(0.6rem, 1vw, 0.75rem);
  color: rgba(255,255,255,0.6);
  text-transform: uppercase;
  letter-spacing: 0.2em;
  margin-top: 0.5em;
}

/* Geometric accent shapes */
.geo-circle {
  position: absolute;
  width: clamp(80px, 10vw, 150px);
  height: clamp(80px, 10vw, 150px);
  border-radius: 50%;
  border: 2px solid var(--red);
  right: 8%;
  top: 12%;
  z-index: 1;
  opacity: 0.7;
}
.geo-square {
  position: absolute;
  width: clamp(40px, 5vw, 70px);
  height: clamp(40px, 5vw, 70px);
  background: var(--red);
  right: 12%;
  bottom: 15%;
  z-index: 1;
  transform: rotate(15deg);
  opacity: 0.8;
}

/* Main content area — offset from dark panel */
.slide-content {
  position: relative;
  z-index: 2;
  margin-left: clamp(30vw, 35vw, 400px);
  padding-left: clamp(2rem, 4vw, 5rem);
  padding-right: var(--slide-padding);
  justify-content: center;
}

.tag {
  display: inline-block;
  background: var(--black);
  color: var(--white);
  padding: 0.25em 0.8em;
  font-size: var(--small-size);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 0.8em;
  font-weight: 600;
}
h1 {
  font-family: var(--font-display);
  font-size: var(--title-size);
  font-weight: 800;
  line-height: 1.05;
  margin-bottom: 0.6em;
  color: var(--black);
}
h1 .accent { color: var(--red); }
.subtitle {
  font-size: clamp(0.875rem, 1.8vw, 1.15rem);
  color: #555;
  max-width: 500px;
  line-height: 1.6;
}
.divider {
  width: clamp(40px, 6vw, 80px);
  height: 3px;
  background: var(--red);
  margin: 0.8em 0;
}

/* Reveal animations */
.reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.5s var(--ease-out-expo), transform 0.5s var(--ease-out-expo); }
.slide.visible .reveal { opacity: 1; transform: translateY(0); }
.slide.visible .reveal:nth-child(1) { transition-delay: 0.1s; }
.slide.visible .reveal:nth-child(2) { transition-delay: 0.2s; }
.slide.visible .reveal:nth-child(3) { transition-delay: 0.35s; }
.slide.visible .reveal:nth-child(4) { transition-delay: 0.5s; }

.style-label {
  position: fixed;
  bottom: 12px; right: 16px;
  font-size: 11px;
  color: #999;
  opacity: 0.5;
  z-index: 100;
  font-family: var(--font-body);
}
</style>
</head>
<body>
<section class="slide visible">
  <div class="red-bar"></div>
  <div class="dark-panel">
    <span class="panel-num">01</span>
    <span class="panel-label">Swiss Modern</span>
  </div>
  <div class="geo-circle"></div>
  <div class="geo-square"></div>
  <div class="slide-content">
    <div class="reveal"><span class="tag">Swiss Modern</span></div>
    <h1 class="reveal"><span class="accent">Arrow Lake</span><br>Data Lakehouse</h1>
    <div class="divider reveal"></div>
    <p class="subtitle reveal">Zero-copy Arrow architecture.<br>Unified multimodal data platform for AI/ML teams.</p>
  </div>
</section>
<div class="style-label">Style B: Swiss Modern</div>
<script>
const obs = new IntersectionObserver(ents => {
  ents.forEach(en => { if (en.isIntersecting) en.target.classList.add('visible'); });
}, { threshold: 0.35 });
document.querySelectorAll('.slide').forEach(s => obs.observe(s));
</script>
</body>
</html>
