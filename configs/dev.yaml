storage:
  backend: minio
  s3_endpoint: "http://localhost:9000"
  s3_region: "us-east-1"

compute:
  gpu_enabled: false
  num_workers: 2

observability:
  metrics_enabled: true
  metrics_port: 8000
  log_level: DEBUG

http:
  timeout_seconds: 30.0
  max_retries: 3

media:
  thumbnail_size: 64
  preview_size: 512
  max_image_dimension: 4096

embedding:
  model: BAAI/bge-small-en-v1.5
  batch_size: 128
  backend: local

decode:
  quality: full
