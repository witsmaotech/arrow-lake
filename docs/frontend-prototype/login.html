<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>登录 · Arrow Lake</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css"/><link rel="stylesheet" href="assets/app.css"/>
<style>
.login-bg{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}
.login-art{position:relative;padding:var(--s7);display:flex;flex-direction:column;justify-content:space-between;background:
  radial-gradient(700px 400px at 20% 10%,rgba(20,184,166,.18),transparent 60%),
  radial-gradient(600px 400px at 80% 90%,rgba(56,189,248,.12),transparent 60%),var(--ink-950);overflow:hidden;border-right:1px solid var(--line)}
.login-art:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:radial-gradient(500px 400px at 30% 40%,#000,transparent);mask-image:radial-gradient(500px 400px at 30% 40%,#000,transparent)}
.login-form{display:grid;place-items:center;padding:var(--s6)}
.card{width:min(380px,92vw)}
.toggles{display:flex;gap:2px;background:var(--ink-850);border:1px solid var(--line);border-radius:var(--r-md);padding:3px;margin-bottom:var(--s4)}
.toggles button{flex:1;padding:7px;border:none;background:none;color:var(--fg-lo);font-size:.8rem;font-weight:600;cursor:pointer;border-radius:5px;font-family:inherit}
.toggles button.active{background:var(--ink-700);color:var(--fg-hi)}
@media(max-width:860px){.login-bg{grid-template-columns:1fr}.login-art{display:none}}
</style>
</head>
<body>
<div class="login-bg">
  <div class="login-art">
    <a class="brand" href="index.html" style="text-decoration:none;display:flex;gap:10px;align-items:center"><span class="brand-mark">AL</span><span><b class="brand-name" style="color:var(--fg-hi)">Arrow Lake</b><div class="brand-sub">lakehouse v1.8.6</div></span></a>
    <div style="position:relative">
      <span class="tag teal"><span style="width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block"></span> 生产就绪 · 自第一天起</span>
      <h1 style="font-size:clamp(2rem,1.4rem+1.5vw,3rem);font-weight:800;line-height:1.1;margin:var(--s4) 0;letter-spacing:-.02em">一个湖仓<br/><span style="background:linear-gradient(120deg,var(--teal-bright),var(--info));-webkit-background-clip:text;background-clip:text;color:transparent">装下全部检索与智能</span></h1>
      <p class="muted" style="max-width:46ch">RBAC 三档 + per-dataset ACL · JWT 全生命周期 · HMAC 防篡改审计 · 限流 + TLS + 注入防御。</p>
    </div>
    <div class="telem" style="position:relative">
      <span class="item"><span class="dot"></span>QPS <b>1,284</b></span><span class="item">106 routes</span><span class="item">6,283 tests</span><span class="item" style="margin-left:auto">UPTIME <b>99.98%</b></span>
    </div>
  </div>
  <div class="login-form">
    <div class="card">
      <h2 style="margin:0 0 var(--s2)">登录控制台</h2>
      <p class="muted" style="margin:0 0 var(--s4);font-size:.85rem">API Key 或 用户名密码 → 获取 JWT</p>
      <div class="toggles"><button class="active" onclick="setTab(this,'jwt')">用户名 / 密码</button><button onclick="setTab(this,'key')">API Key</button></div>
      <form onsubmit="event.preventDefault();location='dashboard.html'" class="col">
        <div class="field"><label>用户名</label><input class="input" value="sysop" autocomplete="username"/></div>
        <div class="field"><label>密码</label><div style="position:relative"><input class="input" type="password" value="••••••••" autocomplete="current-password" id="pw"/><button type="button" class="btn btn-icon btn-ghost" style="position:absolute;right:4px;top:50%;transform:translateY(-50%)" onclick="var p=$('#pw');p.type=p.type==='password'?'text':'password'"><i class="placeholder" data-ic="key"></i></button></div></div>
        <div class="flex between" style="margin:var(--s2) 0"><label class="flex" style="gap:6px;font-size:.78rem;color:var(--fg-md)"><input type="checkbox" checked/> 记住我</label><a href="#" style="font-size:.78rem">忘记密码？</a></div>
        <button class="btn btn-primary" type="submit" style="width:100%"><i class="placeholder" data-ic="logout"></i> 登录</button>
      </form>
      <div class="divider"></div>
      <div class="flex between" style="font-size:.72rem;color:var(--fg-lo)"><span>JWT HS256/RS256</span><span>Redis 黑名单</span><span>限流 · 防爆破</span></div>
      <p class="muted" style="font-size:.7rem;margin-top:var(--s4);text-align:center">原型：任意凭据点击登录进入控制台</p>
    </div>
  </div>
</div>
<script src="assets/layout.js"></script>
<script>function setTab(b,m){document.querySelectorAll('.toggles button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function $(s){return document.querySelector(s)}</script>
</body>
</html>
