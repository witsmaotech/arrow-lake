# Arrow Lake — Docker Compose (Base)
#
# Core services: API server + MinIO object storage.
# Extend with overlays for development, GPU, and monitoring.
#
# Usage:
#   make up              # Core only (API + MinIO)
#   make dev             # + Jupyter + source mounts
#   make gpu             # + GPU-enabled Ray
#   make full            # All services + Prometheus
#
# Override files (merged automatically by Makefile):
#   docker-compose.dev.yml        — source code mounts for development
#   docker-compose.gpu.yml        — GPU images + NVIDIA reservations
#   docker-compose.monitoring.yml — Prometheus + Grafana

# ==============================================================================
# Extensions — shared configuration (DRY)
# ==============================================================================

x-arrow-lake: &arrow-lake
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: arrow-lake:latest
  restart: unless-stopped
  env_file:
    - path: ../.env
      required: false
  networks:
    - arrow-lake-net
    - hg-net
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
      tag: "arrow-lake"
  tmpfs:
    - /tmp
    - /app/.cache
    - /app/.local
    - /home/arrowlake
    - /app/exports
  volumes:
    - duckdb-data:/app/.duckdb
  cap_drop:
    - ALL
  cap_add:
    - NET_BIND_SERVICE
  stop_grace_period: 30s

x-arrow-lake-env: &arrow-lake-env
  ARROW_LAKE__STORAGE__BASE_URI: "${MINIO_BUCKET:-arrow-lake}"
  ARROW_LAKE__STORAGE__S3_ENDPOINT: "http://minio:9000"
  ARROW_LAKE__STORAGE__BACKEND: "minio"
  ARROW_LAKE__OBSERVABILITY__METRICS_ENABLED: "true"
  ARROW_LAKE__EMBEDDING__MODEL_SOURCE: "modelscope"

x-minio-creds: &minio-creds
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

# ==============================================================================
# Services
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # API Server — Lake SDK HTTP endpoint (/health, /metrics)
  # ---------------------------------------------------------------------------
  api:
    <<: [*arrow-lake]
    profiles: ["core", "dev", "monitoring", "gpu"]
    container_name: arrow-lake-api
    command: ["uvicorn", "arrow_lake.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    read_only: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      <<: [*arrow-lake-env]
      ARROW_LAKE__API__ENABLED: "true"
      ARROW_LAKE__API__HOST: "0.0.0.0"
      ARROW_LAKE__API__PORT: "8000"
      ARROW_LAKE__OBSERVABILITY__METRICS_PORT: "8000"
      ARROW_LAKE__REDIS__URL: "redis://redis:6379/0"
      ARROW_LAKE__REDIS__PASSWORD: "${REDIS_PASSWORD:-}"
      HTTP_PROXY: "http://host.docker.internal:${PROXY_FORWARD_PORT:-7888}"
      HTTPS_PROXY: "http://host.docker.internal:${PROXY_FORWARD_PORT:-7888}"
      http_proxy: "http://host.docker.internal:${PROXY_FORWARD_PORT:-7888}"
      https_proxy: "http://host.docker.internal:${PROXY_FORWARD_PORT:-7888}"
      NO_PROXY: "127.0.0.1,localhost,host.docker.internal,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,172.30.0.0/16,minio,redis,ray-head,jaeger,prometheus,grafana,hg-server"
      no_proxy: "127.0.0.1,localhost,host.docker.internal,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,172.30.0.0/16,minio,redis,ray-head,jaeger,prometheus,grafana,hg-server"
      ARROW_LAKE__EMBEDDING__API_BASE: "${OLLAMA_API_BASE:-http://172.19.0.40:11434/v1}"
      ARROW_LAKE__HUGEGRAPH__HOST: "${HUGEGRAPH_HOST:-hg-server}"
      ARROW_LAKE__HUGEGRAPH__PORT: "${HUGEGRAPH_PORT:-8080}"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      AWS_ENDPOINT_URL: "http://minio:9000"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
    depends_on:
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-8G}
          cpus: "${API_CPU_LIMIT:-4.0}"
          pids: 512
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2025-09-07T16-13-09Z}
    container_name: arrow-lake-minio
    profiles: ["core", "dev", "gpu", "monitoring"]
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      <<: [*minio-creds]
    volumes:
      - minio-data:/data
    networks:
      - arrow-lake-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "arrow-lake-minio"
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: ${MINIO_MEMORY_LIMIT:-4G}
          cpus: "${MINIO_CPU_LIMIT:-2.0}"
          pids: 1024
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 15s

  # ---------------------------------------------------------------------------
  # MinIO Init — Create default bucket on first start
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:${MINIO_MC_VERSION:-latest}
    container_name: arrow-lake-minio-init
    profiles: ["core", "dev", "gpu", "monitoring"]
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - arrow-lake-net
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb local/${MINIO_BUCKET:-arrow-lake} --ignore-existing
      "

  # ---------------------------------------------------------------------------
  # Ray Head — Cluster head node (GCS server + Dashboard)
  # ---------------------------------------------------------------------------
  ray-head:
    <<: [*arrow-lake]
    profiles: ["compute", "dev", "gpu", "monitoring"]
    container_name: arrow-lake-ray-head
    ports:
      - "${RAY_REDIS_PORT:-6378}:6379"
      - "${RAY_DASHBOARD_PORT:-8265}:8265"
    environment:
      <<: [*arrow-lake-env]
      ARROW_LAKE__COMPUTE__RAY_ADDRESS: "auto"
    volumes:
      - lake-data:/data/lake
    shm_size: 1g
    command: >
      /app/.venv/bin/ray start
      --head
      --port=6379
      --dashboard-host=0.0.0.0
      --dashboard-port=8265
      --num-cpus=${RAY_HEAD_CPUS:-4}
      --block
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: ${RAY_HEAD_MEMORY_LIMIT:-16G}
          cpus: "${RAY_HEAD_CPU_LIMIT:-4.0}"
          pids: 2048
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/ray status --address 127.0.0.1:6379 2>&1 | grep -q 'node' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 60s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ---------------------------------------------------------------------------
  # Ray Worker — Scalable compute workers
  # ---------------------------------------------------------------------------
  ray-worker:
    <<: [*arrow-lake]
    profiles: ["compute", "dev", "gpu", "monitoring"]
    restart: unless-stopped
    healthcheck:
      disable: true
    deploy:
      replicas: ${RAY_WORKER_REPLICAS:-1}
      resources:
        limits:
          memory: ${RAY_WORKER_MEMORY:-16G}
          cpus: "${RAY_WORKER_CPU_LIMIT:-4.0}"
          pids: 2048
        reservations:
          memory: 2G
    environment:
      <<: [*arrow-lake-env]
      ARROW_LAKE__COMPUTE__RAY_ADDRESS: "ray://ray-head:10001"
    volumes:
      - lake-data:/data/lake
    shm_size: 1g
    command: >
      /app/.venv/bin/ray start
      --address=ray-head:6379
      --num-cpus=${RAY_WORKER_CPUS:-4}
      --block
    depends_on:
      ray-head:
        condition: service_healthy
    stop_grace_period: 60s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ---------------------------------------------------------------------------
  # Jupyter Lab — Development notebook environment (dev profile only)
  # ---------------------------------------------------------------------------
  jupyter:
    <<: [*arrow-lake]
    profiles: ["dev"]
    container_name: arrow-lake-jupyter
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    environment:
      <<: [*arrow-lake-env]
      ARROW_LAKE__COMPUTE__RAY_ADDRESS: "ray://ray-head:10001"
      ARROW_LAKE__OBSERVABILITY__LOG_LEVEL: "INFO"
      JUPYTER_RUNTIME_DIR: "/app/.local/share/jupyter/runtime"
      JUPYTER_DATA_DIR: "/app/.local/share/jupyter"
    volumes:
      - lake-data:/data/lake
    shm_size: 128m
    working_dir: /app
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --NotebookApp.token="${JUPYTER_TOKEN:-}"
      --allow-root
    depends_on:
      ray-head:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${JUPYTER_MEMORY_LIMIT:-4G}
          cpus: "${JUPYTER_CPU_LIMIT:-2.0}"
          pids: 512
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8888/lab')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # TurboOCR — OCR processing service (internal only, no host exposure)
  # ---------------------------------------------------------------------------
  turbo-ocr:
    image: deepdoctection/turbo-ocr:${TURBO_OCR_VERSION:-latest}
    container_name: arrow-lake-turbo-ocr
    profiles: ["ocr"]
    restart: unless-stopped
    networks:
      - arrow-lake-net
    expose:
      - "8002"
    volumes:
      - ocr-cache:/root/.cache
    environment:
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-100}
      OCR_MAX_FILE_SIZE_MB: ${OCR_MAX_FILE_SIZE_MB:-50}
      WORKERS: ${OCR_WORKERS:-2}
    deploy:
      resources:
        limits:
          memory: ${OCR_MEMORY_LIMIT:-4G}
          cpus: "${OCR_CPU_LIMIT:-2.0}"
          pids: 128
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT_FOR_OCR:-1}
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
        tag: "arrow-lake-turbo-ocr"
    stop_grace_period: 30s

  # ---------------------------------------------------------------------------
  # HugeGraph — Uses external deployment at /home/witshine/wits-projs/hugegraph
  # The hg-server container is connected to arrow-lake-net via:
  #   docker network connect arrow-lake_arrow-lake-net hg-server
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Ollama — External Ollama service reachable via ${OLLAMA_HOST}:${OLLAMA_PORT}
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Proxy Forward — Host-network socat to expose host proxy (127.0.0.1:7887)
  # to Docker bridge network at gateway:${PROXY_FORWARD_PORT:-7888}
  # Only needed when containers require internet access through a host proxy.
  # ---------------------------------------------------------------------------
  proxy-forward:
    image: alpine/socat:${SOCAT_VERSION:-latest}
    container_name: arrow-lake-proxy-forward
    profiles: ["core", "dev", "monitoring", "gpu"]
    restart: unless-stopped
    network_mode: host
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
    command: TCP-LISTEN:${PROXY_FORWARD_PORT:-7888},fork,reuseaddr TCP:${PROXY_HOST:-127.0.0.1}:${PROXY_PORT:-7887}
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.1"

  # ---------------------------------------------------------------------------
  # Redis — Distributed session coordination + JWT blacklist
  # ---------------------------------------------------------------------------
  redis:
    image: redis:${REDIS_VERSION:-7.4}
    container_name: arrow-lake-redis
    profiles: ["core", "dev", "monitoring", "gpu"]
    restart: unless-stopped
    networks:
      - arrow-lake-net
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-1gb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-2G}
          cpus: "${REDIS_CPU_LIMIT:-1.0}"
          pids: 256
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
        tag: "arrow-lake-redis"
    stop_grace_period: 10s

# ==============================================================================
# Networks
# ==============================================================================

networks:
  arrow-lake-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
  hg-net:
    external: true
    name: hugegraph-single_hg-net

# ==============================================================================
# Volumes
# ==============================================================================

volumes:
  minio-data:
    driver: local
  lake-data:
    driver: local
  ocr-cache:
    driver: local
  duckdb-data:
    driver: local
  hugegraph-data:
    driver: local
  redis-data:
    driver: local
