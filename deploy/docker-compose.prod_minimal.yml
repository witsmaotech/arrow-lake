# Arrow Lake — Minimal Production Docker Compose
#
# 精简自 docker-compose.prod.yml，用于开发服务器上的「生产最小环境验证」。
# 保留核心数据面 + HugeGraph 知识图谱 + Gravitino 元数据治理，砍掉重负载组件。
#
# 相对 prod.yml 的差异:
#   ✂ 砍掉 Ray 集群      (ray-head + ray-worker×2 + ray-worker-gpu, ~12 CPU)
#                         → 应用 RAY_ADDRESS=auto 回退本地计算，小数据验证够用
#   ✂ 砍掉全套可观测     (prometheus / alertmanager / grafana / jaeger / loki /
#                         promtail / redis-exporter / minio-backup, ~4 CPU)
#                         → OTEL_ENABLED 默认 false（jaeger 已删，避免空导出报错）
#   ✂ 砍掉 Hubble        (hugegraph 可视化 UI, ~1 CPU)
#   ↓ 下调保留服务的 CPU/内存默认值（.env 未显式覆盖时生效）
#
# 保留服务 (15):
#   核心:   api · nginx · minio · redis · ollama-relay · proxy-forwarder
#           volume-init · minio-init  (后两个为一次性)
#   KG:     hg-pd · hg-store · hg-server · hg-schema-init (一次性)
#   元数据: gravitino · lance-rest · gravitino-init (一次性)
#
# Usage:
#   docker compose -f docker-compose.prod_minimal.yml up -d
#   docker compose -f docker-compose.prod_minimal.yml ps
#   docker compose -f docker-compose.prod_minimal.yml logs -f api
#
# 验证主链路: 摄入 → 湖 → SQL查询 → RAG → 知识图谱 → 元数据治理/联邦查询
# Required: .env 文件含密钥 (见 .env.example)
# ==============================================================================

# ==============================================================================
# Shared configuration (与 prod.yml 保持一致，便于比对)
# ==============================================================================

x-arrow-lake: &arrow-lake
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    network: host
    args:
      VERSION: "1.9.4"
      HTTP_PROXY: "${BUILD_HTTP_PROXY:-}"
      HTTPS_PROXY: "${BUILD_HTTPS_PROXY:-}"
      NO_PROXY: "${BUILD_NO_PROXY:-127.0.0.1,localhost}"
  image: arrow-lake:1.9.4
  restart: unless-stopped
  env_file:
    - path: ../.env
      required: false
  networks:
    - arrow-lake-net
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
      tag: "arrow-lake"
  tmpfs:
    - /tmp:rw,nosuid,nodev,exec   # relax docker default noexec: kreuzberg pdfium native lib must be mmap-able
    - /app/.cache
    - /app/.local
    - /home/arrowlake
    - /app/exports
  volumes:
    - duckdb-data:/app/.duckdb
  cap_drop:
    - ALL
  cap_add:
    - NET_BIND_SERVICE
  stop_grace_period: 30s
  read_only: true

x-storage-env: &storage-env
  ARROW_LAKE__STORAGE__BASE_URI: "${MINIO_BUCKET:-arrow-lake}"
  ARROW_LAKE__STORAGE__S3_ENDPOINT: "http://minio:9000"
  ARROW_LAKE__STORAGE__S3_BUCKET: "${MINIO_BUCKET:-arrow-lake}"
  # v1.9.5 批6: 原始上传文件独立 bucket(IO/生命周期隔离)。BlobStoreManager 首次用时自动 ensure。
  ARROW_LAKE__STORAGE__S3_UPLOADS_BUCKET: "${S3_UPLOADS_BUCKET:-arrow-lake-uploads}"
  # v1.9.5 批6: 原始文件 N 天后到期清理(0=禁用,默认禁用保留重解析能力)。启用后到期对象被 minio 自动删。
  # ARROW_LAKE__STORAGE__UPLOADS_EXPIRATION_DAYS: "30"
  ARROW_LAKE__STORAGE__BACKEND: "minio"
  ARROW_LAKE__OBSERVABILITY__METRICS_ENABLED: "true"
  AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}"
  AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_USER must be set}"
  AWS_ENDPOINT_URL: "http://minio:9000"
  AWS_REGION: "${AWS_REGION:-us-east-1}"
  # v1.7.1: Lance object-store IO/CPU threads (MinIO S3 throughput)
  LANCE_IO_THREADS: "${LANCE_IO_THREADS:-64}"
  LANCE_CPU_THREADS: "${LANCE_CPU_THREADS:-4}"

x-metaflow-env: &metaflow-env
  METAFLOW_DEFAULT_METADATA: "local"
  METAFLOW_DATASTORE: "local"
  METAFLOW_DATASTORE_ROOT: "/data/metaflow"
  METAFLOW_DATATOOLS_S3_ROOT: "s3://arrow-lake/metaflow"
  METAFLOW_S3_ENDPOINT_URL: "http://minio:9000"

# ==============================================================================
# Services
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # Proxy Forwarder — WSL2 mirrored mode bridge to Windows host proxy
  # ---------------------------------------------------------------------------
  # Ollama relay — expose host's 127.0.0.1-only Ollama to the bridge network
  # via host.docker.internal:11534 (mirrors proxy-forwarder pattern).
  ollama-relay:
    image: alpine/socat:${SOCAT_VERSION:-1.9.1}
    container_name: arrow-lake-ollama-relay
    restart: unless-stopped
    network_mode: host
    command: TCP-LISTEN:11534,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:11434
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "1"
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 11534 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

  proxy-forwarder:
    image: alpine/socat:${SOCAT_VERSION:-1.9.1}
    container_name: arrow-lake-proxy-forwarder
    restart: unless-stopped
    network_mode: host
    command: TCP-LISTEN:17887,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:${HOST_PROXY_PORT:-7887}
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "1"
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 17887 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------------------
  # System DB (libSQL / Turso sqld) — v1.9.0 control-plane persistence
  # RBAC / identity / personal tokens (P0) + catalog / tasks / lineage index
  # (P1+). Singleton — all 4 API workers share one DB over the internal net.
  # Disabled by default (config.system_db.enabled=false); the api only connects
  # when enabled, so depends_on is soft (service_started). sqld is distroless
  # (no shell) → no healthcheck; api lifespan retries connect for 30s.
  # ---------------------------------------------------------------------------
  system-db:
    image: ghcr.io/tursodatabase/libsql-server:${LIBSQL_VERSION:-latest}
    container_name: arrow-lake-system-db
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - system-db-data:/var/lib/sqld
    command: ["sqld", "--http-listen-addr", "0.0.0.0:8080"]
    networks:
      - arrow-lake-net

  # ---------------------------------------------------------------------------
  # API Server
  # ---------------------------------------------------------------------------
  api:
    <<: [*arrow-lake]
    # container_name omitted — required for replicas > 1
    command: ["uvicorn", "arrow_lake.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "4", "--proxy-headers", "--forwarded-allow-ips", "172.30.0.0/16"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      <<: [*storage-env, *metaflow-env]
      ARROW_LAKE__API__ENABLED: "true"
      ARROW_LAKE__API__HOST: "0.0.0.0"
      ARROW_LAKE__API__API_KEY: "${ARROW_LAKE__API__API_KEY:-}"
      ARROW_LAKE__API__PORT: "8000"
      ARROW_LAKE__OBSERVABILITY__METRICS_PORT: "9091"
      ARROW_LAKE__OBSERVABILITY__LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # 异步导出落盘:read-only 根 FS 下 /app/exports 是瞬态 tmpfs,指到持久可写卷 /data/lake/exports
      ARROW_LAKE__EXPORT__BASE_DIR: "${ARROW_LAKE__EXPORT__BASE_DIR:-/data/lake/exports}"
      ARROW_LAKE__REDIS__URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0"
      # Ray 集群已在 minimal 中移除 → RAY_ADDRESS=auto 回退本地计算
      ARROW_LAKE__COMPUTE__RAY_DASHBOARD_URL: "http://ray-head:8265"
      # KG 抽取 LLM = 百炼 qwen-turbo (json_schema 约束 + 22 类枚举遵循好; 经 17887 代理出网)。
      # 抽取走全局 llm (he_extract_llm=None→fallback global); QA 仍走下面的 he_qa_llm qwen3-max。
      # 旧 ollama ministral-3:3b 配置(保留注释备查):3B 小模型对紧模板枚举遵循差。
      # ARROW_LAKE__LLM__PROVIDER: "ollama"
      # ARROW_LAKE__LLM__MODEL: "ministral-3:3b"
      # ARROW_LAKE__LLM__API_BASE: "http://host.docker.internal:11534/v1"
      ARROW_LAKE__LLM__PROVIDER: "openai"
      ARROW_LAKE__LLM__MODEL: "qwen-turbo"
      ARROW_LAKE__LLM__API_BASE: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      ARROW_LAKE__LLM__API_KEY: "${DASHSCOPE_API_KEY}"
      ARROW_LAKE__LLM__MAX_TOKENS: "8192"
      ARROW_LAKE__LLM__CONTEXT_WINDOW_TOKENS: "512000"
      ARROW_LAKE__LLM__TIMEOUT_SECONDS: "120"
      ARROW_LAKE__REDIS__PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      ARROW_LAKE__RATE_LIMIT__ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      ARROW_LAKE__RATE_LIMIT__DEFAULT_REQUESTS_PER_MINUTE: "${RATE_LIMIT_RPM:-60}"
      ARROW_LAKE__RATE_LIMIT__DEFAULT_BURST: "${RATE_LIMIT_BURST:-10}"
      TZ: "Asia/Shanghai"
      HTTP_PROXY: "http://host.docker.internal:17887"
      HTTPS_PROXY: "http://host.docker.internal:17887"
      http_proxy: "http://host.docker.internal:17887"
      https_proxy: "http://host.docker.internal:17887"
      NO_PROXY: "127.0.0.1,localhost,host.docker.internal,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,172.19.0.0/16,172.30.0.0/16,minio,redis,metaflow-metadata,metaflow-db,hg-server,hg-pd,hg-store,gravitino,lance-rest,arrow-lake-gravitino,arrow-lake-lance-rest"
      no_proxy: "127.0.0.1,localhost,host.docker.internal,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,172.19.0.0/16,172.30.0.0/16,minio,redis,metaflow-metadata,metaflow-db,hg-server,hg-pd,hg-store,gravitino,lance-rest,arrow-lake-gravitino,arrow-lake-lance-rest"
      ARROW_LAKE__EMBEDDING__BACKEND: "openai"
      ARROW_LAKE__EMBEDDING__API_BASE: "http://host.docker.internal:11534/v1"
      ARROW_LAKE__EMBEDDING__MODEL: "qwen3-embedding:0.6b"
      ARROW_LAKE__EMBEDDING__API_KEY: "ollama"
      # v1.9.5 批5: GraphRAG 联动(已建 KG 的数据集)。取消下行注释即开,开启后 RAG 自动
      # 注入实体关系三元组(graph_qa 模板)。默认关——未建 KG 的数据集开了会降级为纯向量 RAG。
      # ARROW_LAKE__HUGEGRAPH__ENABLED: "false"
      ARROW_LAKE__HUGEGRAPH__HOST: "${HUGEGRAPH_HOST:-hg-server}"
      ARROW_LAKE__HUGEGRAPH__PORT: "${HUGEGRAPH_PORT:-8080}"
      # HugeGraph 1.7+ auth（动态建图/per-dataset KG 必需）：admin / HG_SERVER_PASSWORD
      ARROW_LAKE__HUGEGRAPH__USERNAME: "${HUGEGRAPH_USERNAME:-admin}"
      ARROW_LAKE__HUGEGRAPH__PASSWORD: "${HUGEGRAPH_PASSWORD:-pa}"
      # v1.6.1: KG build async performance tuning
      ARROW_LAKE__HUGEGRAPH__BUILD_CONCURRENCY: "${HUGEGRAPH_BUILD_CONCURRENCY:-3}"
      ARROW_LAKE__HUGEGRAPH__BUILD_BATCH_DELAY: "${HUGEGRAPH_BUILD_BATCH_DELAY:-0.5}"
      # v1.8.8 per-dataset KA dump 根目录。read_only 容器只能写挂载卷 → 必须用 /data/lake/ka
      # (lake-data 卷),不能默认 /data/ka(根 FS 只读,Errno 30)。
      ARROW_LAKE__HUGEGRAPH__HE_KA_BASE_DIR: "/data/lake/ka"
      # v1.9.4: 合并策略改 MERGE_FIELD(非 LLM, 见 he_extractor._create_ka)后, BALANCED 合并爆炸消除,
      # dataset 粒度(一份 KA 喂全部 chunk)对任意规模都稳定 → 不再需要 grouped 分组。通用且简单。
      ARROW_LAKE__HUGEGRAPH__HE_KG_GRANULARITY: "dataset"
      # [#KG-LLM-split] RAG 问答 (ka.chat 生成回答) 用旗舰模型, 与抽取分离
      # (抽取 feed_text 默认走上面全局 LLM ministral-3:3b)。设 DASHSCOPE_API_KEY 后启用;
      # 注释整个块 → 问答回退全局 llm (ministral)。百炼 dashscope 经上面 HTTP_PROXY 出网。
      ARROW_LAKE__HUGEGRAPH__HE_QA_LLM__PROVIDER: "openai"
      ARROW_LAKE__HUGEGRAPH__HE_QA_LLM__API_BASE: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      ARROW_LAKE__HUGEGRAPH__HE_QA_LLM__API_KEY: "${DASHSCOPE_API_KEY:-}"
      ARROW_LAKE__HUGEGRAPH__HE_QA_LLM__MODEL: "qwen3-max"
      # [#RAG-QA-split] RAG 问答生成用强模型(百炼 qwen3-max);抽取/重排仍走全局轻量 llm。
      # 不设(注释掉)→ RAG 回退全局 llm (ministral)。百炼经上面 HTTP_PROXY 出网。
      ARROW_LAKE__RAG__QA_LLM__PROVIDER: "openai"
      ARROW_LAKE__RAG__QA_LLM__API_BASE: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      ARROW_LAKE__RAG__QA_LLM__API_KEY: "${DASHSCOPE_API_KEY:-}"
      ARROW_LAKE__RAG__QA_LLM__MODEL: "qwen-plus"
      # v1.9.5 批3: QA 低温 + 长输出,引导详尽稳定的回答。qwen-max 输出上限 8192。
      ARROW_LAKE__RAG__QA_LLM__TEMPERATURE: "0.3"
      ARROW_LAKE__RAG__QA_LLM__MAX_TOKENS: "16384"
      # v1.9.5 批1: 检索策略真正生效(config 默认已是 hybrid,批1 修复死配置后 vector+FTS RRF 才真跑)。
      ARROW_LAKE__RAG__DEFAULT_RETRIEVAL_STRATEGY: "hybrid"
      # v1.9.5 批4: 检索池扩大。multi_query 默认值已在下方 RAG 块改为 multi_query;
      # RERANKER_TOP_N/MULTI_QUERY_VARIANTS 复用下方既有 ${VAR:-default}(避免重复定义 yaml 冲突)。
      ARROW_LAKE__RAG__DEFAULT_TOP_K: "20"
      # v1.9.5 批6: Lance 本地读缓存(storage 层,1GiB),吸收 RAG 重复随机读。默认 0=关。
      ARROW_LAKE__STORAGE__LANCE_CACHE_SIZE: "1073741824"
      # [#RAG-LLM-split] RAG 抽取/重排 LLM(可选;默认回退全局轻量 llm/ministral)。
      # 想让 RAG 抽取也走百炼轻量(qwen-turbo)时取消注释:
      ARROW_LAKE__RAG__EXTRACT_LLM__PROVIDER: "openai"
      ARROW_LAKE__RAG__EXTRACT_LLM__API_BASE: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      ARROW_LAKE__RAG__EXTRACT_LLM__API_KEY: "${DASHSCOPE_API_KEY:-}"
      ARROW_LAKE__RAG__EXTRACT_LLM__MODEL: "qwen-turbo"
      # 候选问答模型 (替换 MODEL 行即换): qwen-max / deepseek-v3 / 本地 qwen3.5:27b
      #   (本地: API_BASE=http://host.docker.internal:11534/v1, API_KEY=ollama)
      # 抽取换百炼轻量 (启用:KG 抽取走云端 qwen-turbo,不依赖本地 ollama,json_schema 约束解码):
      ARROW_LAKE__HUGEGRAPH__HE_EXTRACT_LLM__PROVIDER: "openai"
      ARROW_LAKE__HUGEGRAPH__HE_EXTRACT_LLM__API_BASE: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      ARROW_LAKE__HUGEGRAPH__HE_EXTRACT_LLM__API_KEY: "${DASHSCOPE_API_KEY:-}"
      ARROW_LAKE__HUGEGRAPH__HE_EXTRACT_LLM__MODEL: "qwen-turbo"
      # DuckDB performance tuning (v1.3.4)
      ARROW_LAKE__OLAP__PRESERVE_INSERTION_ORDER: "false"
      ARROW_LAKE__OLAP__TEMP_DIRECTORY: "/tmp/duckdb"
      ARROW_LAKE__OLAP__ENABLE_PROGRESS_BAR: "true"
      ARROW_LAKE__OLAP__QUERY_CACHE_ENABLED: "true"
      ARROW_LAKE__OLAP__QUERY_CACHE_TTL_SECONDS: "120"
      ARROW_LAKE__OLAP__PARQUET_ROW_GROUP_SIZE: "100000"
      # v1.7.1: DuckDB per-query memory limit (minimal 下调到 512MB，配合 API_MEMORY_LIMIT 4G)
      ARROW_LAKE__OLAP__MAX_QUERY_MEMORY_MB: "${OLAP_MAX_QUERY_MEMORY_MB:-512}"
      # DuckDB warmup + memory protection (v1.4.4)
      ARROW_LAKE__OLAP__WARMUP_ENABLED: "true"
      ARROW_LAKE__OLAP__WARMUP_CONNECTIONS: "2"
      # DuckDB horizontal scaling (v1.4)
      ARROW_LAKE__OLAP__INSTANCE_COUNT: "${API_REPLICAS:-1}"
      ARROW_LAKE__GRAVITINO__ENABLED: "${GRAVITINO_ENABLED:-true}"
      ARROW_LAKE__GRAVITINO__URI: "http://arrow-lake-gravitino:8090"
      ARROW_LAKE__GRAVITINO__METALAKE: "${GRAVITINO_METALAKE:-arrow_lake}"
      ARROW_LAKE__GRAVITINO__LANCE_REST_URI: "http://arrow-lake-lance-rest:9101/lance"
      # v1.4.3: Automated maintenance
      ARROW_LAKE__STORAGE__MAINTENANCE_ENABLED: "${MAINTENANCE_ENABLED:-true}"
      ARROW_LAKE__STORAGE__MAINTENANCE_INTERVAL_SECONDS: "${MAINTENANCE_INTERVAL:-3600}"
      ARROW_LAKE__STORAGE__COMPACTION_FRAGMENT_THRESHOLD: "${COMPACTION_THRESHOLD:-20}"
      ARROW_LAKE__STORAGE__VERSION_RETENTION_DAYS: "${VERSION_RETENTION_DAYS:-7}"
      # v1.4.4: RAG quality (reranking + query transform + multi-turn)
      ARROW_LAKE__RAG__RERANKER: "${RAG_RERANKER:-ollama}"
      ARROW_LAKE__RAG__RERANKER_MODEL: "${RAG_RERANKER_MODEL:-dengcao/Qwen3-Reranker-0.6B:F16}"
      ARROW_LAKE__RAG__RERANKER_TOP_N: "${RAG_RERANKER_TOP_N:-10}"
      ARROW_LAKE__RAG__QUERY_TRANSFORM: "${RAG_QUERY_TRANSFORM:-multi_query}"
      ARROW_LAKE__RAG__HYDE_MAX_TOKENS: "${RAG_HYDE_MAX_TOKENS:-256}"
      ARROW_LAKE__RAG__MULTI_QUERY_VARIANTS: "${RAG_MULTI_QUERY_VARIANTS:-3}"
      ARROW_LAKE__RAG__HISTORY_INJECTION_ENABLED: "true"
      ARROW_LAKE__RAG__HISTORY_BUDGET_RATIO: "0.2"
      ARROW_LAKE__RAG__HISTORY_MAX_TURNS: "6"
      # v1.9.4: OpenTelemetry — minimal 默认关;点亮 = OTEL_ENABLED=true + `--profile tracing` 起 jaeger
      ARROW_LAKE__OPENTELEMETRY__ENABLED: "${OTEL_ENABLED:-false}"
      ARROW_LAKE__OPENTELEMETRY__SERVICE_NAME: "arrow-lake"
      ARROW_LAKE__OPENTELEMETRY__OTEL_ENDPOINT: "${OTEL_ENDPOINT:-http://jaeger:4317}"
      ARROW_LAKE__OPENTELEMETRY__TRACE_SAMPLE_RATE: "${OTEL_SAMPLE_RATE:-0.1}"
      # v1.9.4: 文档解析后端。默认 kreuzberg(快,数字原生PDF文本层抽取;但表格检测弱,复杂表格被拍平成文本)。
      # 表格结构化解析(markdown 表格)需 docling(TableFormer): 设 DOCUMENT_OCR_BACKEND=docling,
      # 且需 GPU 镜像(CPU 跑 109 页 PDF 要数小时)。kreuzberg result.tables 机制本身保留表格 markdown,
      # 只是检测器常漏检无框线/复杂表格。
      ARROW_LAKE__DOCUMENT__OCR_BACKEND: "${DOCUMENT_OCR_BACKEND:-kreuzberg}"
      # v1.5.1: Gravitino authentication (simple by default)
      ARROW_LAKE__GRAVITINO__AUTH_TYPE: "${GRAVITINO_AUTH_TYPE:-simple}"
      ARROW_LAKE__GRAVITINO__AUTH_SIMPLE_USER: "${GRAVITINO_AUTH_USER:-arrow_lake}"
      ARROW_LAKE__GRAVITINO__FEDERATED_QUERY_MAX_ROWS: "${GRAVITINO_QUERY_MAX_ROWS:-100000}"
      # Docling 模型缓存持久化（layout DocLayNet + table TableFormer + OCR，首次下载后随卷复用）
      HF_HOME: "/app/.docling-cache"
      HF_HUB_OFFLINE: "0"  # v1.9.5: 允许 docling 首次下载模型
      HF_ENDPOINT: "https://hf-mirror.com"  # 国内 HF mirror(容器内可达)
      # v1.9.0: system_db (libSQL) control-plane DB — off by default; flip in .env
      ARROW_LAKE__SYSTEM_DB__ENABLED: "${SYSTEM_DB_ENABLED:-false}"
      ARROW_LAKE__SYSTEM_DB__URL: "${SYSTEM_DB_URL:-http://system-db:8080}"
      ARROW_LAKE__SYSTEM_DB__AUTH_TOKEN: "${SYSTEM_DB_AUTH_TOKEN:-}"
      ARROW_LAKE__SYSTEM_DB__CONNECT_TIMEOUT_SECONDS: "${SYSTEM_DB_CONNECT_TIMEOUT:-30}"
      # ⚠️ FAIL-OPEN opt-in: true → sqld 宕机时 RBAC 读从缓存授权(可能 honor 宕机期间撤销的权限)。
      # 默认 false(secure fail-close)。HA 部署显式设 true 接受该 tradeoff。
      ARROW_LAKE__SYSTEM_DB__SERVE_STALE_ON_ERROR: "${SYSTEM_DB_SERVE_STALE_ON_ERROR:-false}"
    volumes:
      - duckdb-data:/app/.duckdb
      - lake-data:/data/lake
      - metaflow-store:/data/metaflow
      - docling-cache:/app/.docling-cache
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
      hg-server:
        condition: service_healthy
        required: false
      gravitino:
        condition: service_healthy
        required: false
      gravitino-init:
        condition: service_completed_successfully
        required: false
      system-db:
        condition: service_started
        required: false
    deploy:
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-16G}
          cpus: "${API_CPU_LIMIT:-1.0}"
          pids: 512
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ---------------------------------------------------------------------------
  # v1.9.4: Jaeger — optional tracing collector (opt-in via profile).
  # 点亮 OTel: deploy/.env 设 OTEL_ENABLED=true,再
  #   docker compose -p arrow-lake -f deploy/docker-compose.prod_minimal.yml --profile tracing up -d jaeger api
  # 然后 Jaeger UI: http://127.0.0.1:16686 。api 经 OTEL_ENDPOINT=http://jaeger:4317 导出。
  jaeger:
    image: jaegertracing/all-in-one:${JAEGER_VERSION:-1.57}
    container_name: arrow-lake-jaeger
    restart: unless-stopped
    profiles: ["tracing"]
    networks:
      - arrow-lake-net
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"   # Jaeger UI
      - "127.0.0.1:${JAEGER_OTLP_PORT:-4317}:4317"   # OTLP gRPC (api exports here)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # Nginx — TLS reverse proxy + security headers
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:${NGINX_VERSION:-1.27}
    container_name: arrow-lake-nginx
    restart: unless-stopped
    networks:
      - arrow-lake-net
    environment:
      TZ: "Asia/Shanghai"
      # nginx only talks to internal services — clear proxy to avoid routing upstream through proxy
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: ""
      no_proxy: ""
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${NGINX_MEMORY_LIMIT:-128M}
          cpus: "${NGINX_CPU_LIMIT:-0.3}"
          pids: 128
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
        tag: "arrow-lake-nginx"
    stop_grace_period: 10s

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2025-09-07T16-13-09Z}
    container_name: arrow-lake-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      TZ: "Asia/Shanghai"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}"
    volumes:
      - minio-data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - arrow-lake-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "arrow-lake-minio"
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: ${MINIO_MEMORY_LIMIT:-1G}
          cpus: "${MINIO_CPU_LIMIT:-0.5}"
          pids: 512
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 15s

  # ---------------------------------------------------------------------------
  # Volume Init — Fix named volume permissions for non-root user
  # ---------------------------------------------------------------------------
  volume-init:
    image: alpine:${ALPINE_VERSION:-3.21}
    container_name: arrow-lake-volume-init
    restart: "no"
    networks:
      - arrow-lake-net
    volumes:
      - lake-data:/data/lake
      - metaflow-store:/data/metaflow
    command: chown -R 999:999 /data/lake /data/metaflow

  # ---------------------------------------------------------------------------
  # MinIO Init — Create buckets on first start
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:${MINIO_MC_VERSION:-RELEASE.2025-08-13T08-35-41Z}
    container_name: arrow-lake-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - arrow-lake-net
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb local/${MINIO_BUCKET:-arrow-lake} --ignore-existing &&
      mc mb local/arrow-lake-metaflow --ignore-existing
      "

  # ---------------------------------------------------------------------------
  # Redis — Session coordination + JWT blacklist + 跨 worker 任务共享
  # ---------------------------------------------------------------------------
  redis:
    image: redis:${REDIS_VERSION:-7.4}
    container_name: arrow-lake-redis
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
    networks:
      - arrow-lake-net
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-256M}
          cpus: "${REDIS_CPU_LIMIT:-0.3}"
          pids: 256
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
        tag: "arrow-lake-redis"
    stop_grace_period: 10s

  # ==============================================================================
  # HugeGraph — 知识图谱后端 (rocksdb 单机模式: server only)
  # ==============================================================================
  # NOTE: PD (hg-pd) + Store (hg-store) services removed — see hg-server header
  # for why rocksdb single-node replaces the PD/hstore cluster (1.7.0 graphspace
  # multi-graph NPE). To revert to PD, restore those two service blocks and the
  # hg-pd-data / hg-store-data volumes, then set HG_SERVER_BACKEND=hstore.

  # ---------------------------------------------------------------------------
  # HugeGraph Server — Graph API (single-node, rocksdb backend)
  # ---------------------------------------------------------------------------
  # v1.8.6 per-dataset isolation runs on the rocksdb single-node backend.
  # Rationale: HugeGraph 1.7.0 PD/hstore mode (graphspaces) has an unfixed
  # server bug — GraphManager.isExistedGraphNickname NPEs when creating a
  # graph once any other graph already exists — so multi-graph isolation is
  # impossible on hstore/PD in 1.7.0. rocksdb gives a real per-graph store
  # directory (true isolation), fast graph creation, and no PD task overhead.
  # Loss vs PD cluster: no HA / horizontal scaling. The PD/store services and
  # their volumes were removed when this switched off the hstore backend.
  # To revert to PD: restore HG_SERVER_BACKEND=hstore + HG_SERVER_PD_PEERS,
  # SKIP_STORE_GRPC_WAIT, and the hg-pd/hg-store services.
  hg-server:
    image: hugegraph/hugegraph:${HUGEGRAPH_VERSION:-1.7.0}
    container_name: arrow-lake-hg-server
    hostname: hg-server
    restart: unless-stopped
    networks:
      - arrow-lake-net
    entrypoint: ["/usr/local/bin/entrypoint-hugegraph.sh"]
    command: ["./docker-entrypoint.sh"]
    environment:
      TZ: "Asia/Shanghai"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      # rocksdb single-node backend: each graph gets its own rocksdb store
      # directory → true per-dataset isolation. No PD, no store gRPC.
      HG_SERVER_BACKEND: "rocksdb"
      SKIP_STORE_GRPC_WAIT: "1"
      HUGEGRAPH_GRAPH: "hugegraph"
      # HugeGraph 1.7+ 动态建图(per-dataset KG)必须开 auth：设 PASSWORD → enable-auth.sh 建管理员(admin/PASSWORD)
      PASSWORD: "${HG_SERVER_PASSWORD:-pa}"
      # JVM 堆匹配下方 cgroup 内存（4G），留 ~2G 给 rocksdb block cache/off-heap。
      # G1GC 降低大堆下的暂停（kg_build 持续写入时 GC 压力大）。
      JAVA_OPTS: "-Xms1g -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    ports:
      - "127.0.0.1:${HUGEGRAPH_PORT:-8089}:8080"
    volumes:
      - hg-server-data:/var/lib/hugegraph
      - ./scripts/entrypoint-hugegraph.sh:/usr/local/bin/entrypoint-hugegraph.sh:ro
      - ./scripts/fix-hugegraph-gremlin.sh:/usr/local/bin/fix-hugegraph-gremlin.sh:ro
    deploy:
      resources:
        limits:
          memory: ${HG_SERVER_MEMORY_LIMIT:-4096M}
          cpus: "${HG_SERVER_CPU_LIMIT:-2.0}"
          pids: 512
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-sf", "-u", "admin:${HG_SERVER_PASSWORD:-pa}", "http://localhost:8080/graphs/hugegraph/schema"]
      interval: 15s
      timeout: 10s
      retries: 10
      # rocksdb single-node: no wait-partition.sh, init is fast.
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
        tag: "arrow-lake-hg-server"
    stop_grace_period: 30s

  # ---------------------------------------------------------------------------
  # HugeGraph Hubble — Graph visualization web UI (port 8088)
  # ---------------------------------------------------------------------------
  hg-hubble:
    image: hugegraph/hubble:${HG_HUBBLE_VERSION:-1.7.0}
    container_name: arrow-lake-hg-hubble
    hostname: hubble
    restart: unless-stopped
    networks:
      - arrow-lake-net
    depends_on:
      hg-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HG_HUBBLE_PORT:-8088}:8088"
    deploy:
      resources:
        limits:
          memory: ${HG_HUBBLE_MEMORY_LIMIT:-2G}
          cpus: "${HG_HUBBLE_CPU_LIMIT:-1.0}"
          pids: 128
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "arrow-lake-hg-hubble"
    stop_grace_period: 15s

  # ---------------------------------------------------------------------------
  # HugeGraph Schema Init — Create Arrow Lake KG schema on first start
  # ---------------------------------------------------------------------------
  hg-schema-init:
    image: curlimages/curl:${CURL_VERSION:-8.12.1}
    container_name: arrow-lake-hg-schema-init
    restart: "no"
    networks:
      - arrow-lake-net
    depends_on:
      hg-server:
        condition: service_healthy
    entrypoint: ["sh", "/usr/local/bin/init-hugegraph-schema.sh"]
    environment:
      HUGEGRAPH_HOST: "hg-server"
      HUGEGRAPH_PORT: "8080"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
    volumes:
      - ./scripts/init-hugegraph-schema.sh:/usr/local/bin/init-hugegraph-schema.sh:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.2"
          pids: 32
    stop_grace_period: 5s

  # ==============================================================================
  # Gravitino — Metadata federation server
  # ==============================================================================

  gravitino:
    image: apache/gravitino:${GRAVITINO_VERSION:-1.3.0}
    container_name: arrow-lake-gravitino
    restart: unless-stopped
    networks:
      - arrow-lake-net
    ports:
      - "127.0.0.1:${GRAVITINO_PORT:-8090}:8090"
    environment:
      TZ: "Asia/Shanghai"
      GRAVITINO_AUTHENTICATORS: "simple"
      GRAVITINO_AUTHORIZATION_ENABLE: "false"
      GRAVITINO_USE_WEB_V2: "true"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      AWS_ENDPOINT_URL: "http://minio:9000"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ALLOW_HTTP: "true"
      # Neutralize Docker-daemon proxy injection. Gravitino only talks to the
      # internal minio; routing S3 through the host proxy mangles the SigV4
      # signature → minio returns 403 on fileset/schema operations.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    volumes:
      - gravitino-data:/opt/gravitino/data
    deploy:
      resources:
        limits:
          memory: ${GRAVITINO_MEMORY_LIMIT:-1G}
          cpus: "${GRAVITINO_CPU_LIMIT:-0.5}"
          pids: 512
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/api/metalakes"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "arrow-lake-gravitino"
    stop_grace_period: 15s

  # ---------------------------------------------------------------------------
  # Lance REST Catalog — RESTful catalog for Lance datasets
  # ---------------------------------------------------------------------------
  lance-rest:
    image: apache/gravitino-lance-rest:${GRAVITINO_VERSION:-1.3.0}
    container_name: arrow-lake-lance-rest
    restart: unless-stopped
    networks:
      - arrow-lake-net
    ports:
      - "127.0.0.1:${LANCE_REST_PORT:-9002}:9101"
    environment:
      TZ: "Asia/Shanghai"
      LANCE_REST_GRAVITINO_URI: "http://arrow-lake-gravitino:8090"
      LANCE_REST_GRAVITINO_METALAKE_NAME: "${GRAVITINO_METALAKE:-arrow_lake}"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      AWS_ENDPOINT_URL: "http://minio:9000"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
    depends_on:
      gravitino:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${LANCE_REST_MEMORY_LIMIT:-512M}
          cpus: "${LANCE_REST_CPU_LIMIT:-0.3}"
          pids: 64
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9101/lance/v1/namespace/lance-catalog/list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
        tag: "arrow-lake-lance-rest"
    stop_grace_period: 10s

  # ---------------------------------------------------------------------------
  # Gravitino Init — Create Metalake + Catalogs + Schemas on first start
  # ---------------------------------------------------------------------------
  gravitino-init:
    image: curlimages/curl:${CURL_VERSION:-8.12.1}
    container_name: arrow-lake-gravitino-init
    restart: "no"
    networks:
      - arrow-lake-net
    depends_on:
      gravitino:
        condition: service_healthy
    entrypoint: ["sh", "/usr/local/bin/init-gravitino.sh"]
    environment:
      GRAVITINO_URI: "http://arrow-lake-gravitino:8090"
      GRAVITINO_METALAKE: "${GRAVITINO_METALAKE:-arrow_lake}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
    volumes:
      - ./scripts/init-gravitino.sh:/usr/local/bin/init-gravitino.sh:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.2"
          pids: 32
    stop_grace_period: 5s

# ==============================================================================
# Networks
# ==============================================================================

networks:
  arrow-lake-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

# ==============================================================================
# Volumes (仅保留本文件用到的；监控/备份卷已随服务移除)
# ==============================================================================

volumes:
  minio-data:
    driver: local
  lake-data:
    driver: local
  duckdb-data:
    driver: local
  redis-data:
    driver: local
  metaflow-store:
    driver: local
  docling-cache:
    driver: local
  hg-server-data:
    driver: local
  gravitino-data:
    driver: local
  system-db-data:
    driver: local
