# Prometheus configuration for Arrow Lake production
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: "arrow-lake-server"
    static_configs:
      - targets: ["arrow-lake-api:8000"]
    metrics_path: "/metrics"

  - job_name: "ray-head"
    static_configs:
      - targets: ["arrow-lake-ray-head:8265"]
    metrics_path: "/metrics"

  - job_name: "minio"
    static_configs:
      - targets: ["arrow-lake-minio:9000"]
    metrics_path: "/minio/v2/metrics/cluster"

  - job_name: "redis"
    static_configs:
      - targets: ["arrow-lake-redis:6379"]

  - job_name: "hugegraph"
    static_configs:
      - targets: ["arrow-lake-hg-server:8080"]
    metrics_path: "/metrics"
