name: Security Scan

on:
  schedule:
    - cron: "0 9 * * 1"  # 每周一 09:00 UTC
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Bandit security scan
        run: |
          uv run bandit -r arrow_lake/ -x tests/ -ll -f json -o bandit-report.json
          HIGH_COUNT=$(python -c "
          import json
          report = json.load(open('bandit-report.json'))
          issues = [r for r in report.get('results', []) if r.get('issue_severity') in ('HIGH', 'CRITICAL')]
          print(len(issues))
          ")
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "::error::$HIGH_COUNT HIGH/CRITICAL issues found in Bandit scan"
            exit 1
          fi

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit
