apiVersion: v1
kind: Service
metadata:
  name: {{ include "arrow-lake.fullname" . }}-api
  labels:
    {{- include "arrow-lake.labels" . | nindent 4 }}
    component: api-server
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.observability.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "arrow-lake.selectorLabels" . | nindent 4 }}
    component: api-server
