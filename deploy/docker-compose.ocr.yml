# TurboOCR Docker Compose overlay
#
# Usage: docker compose --profile ocr up -d
#
# Security:
#   - TurboOCR service uses 'expose' (not 'ports') — only accessible
#     from within the ocr-internal Docker network
#   - Arrow Lake connects to TurboOCR via ocr-internal network
#   - No host port exposure for TurboOCR
#
# Requires: GPU with CUDA support

services:
  turbo-ocr:
    image: deepdoctection/turbo-ocr:latest
    container_name: arrow-lake-turbo-ocr
    restart: unless-stopped
    ports:
      - "8002:8002"
    networks:
      - ocr-internal
    volumes:
      - ocr-cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    environment:
      - OCR_MAX_PAGES=100
      - OCR_MAX_FILE_SIZE_MB=50
      - WORKERS=2
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

networks:
  ocr-internal:
    driver: bridge
    name: arrow-lake-ocr-internal

volumes:
  ocr-cache:
    driver: local
    name: arrow-lake-ocr-cache
