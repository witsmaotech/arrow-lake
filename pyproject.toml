[project]
name = "arrow-lake"
version = "1.6.0"
description = "Unified multimodal data lakehouse — Lance + Daft + Ray"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Witshine", email = "wits@sunpw.dev"},
]
keywords = ["data-lakehouse", "multimodal", "lance", "daft", "ray", "vector-search"]

dependencies = [
    # Core stack (DARMU) — exact pins from Story 1.2 Spike
    "daft==0.7.8",
    "ray[default]==2.54.1",
    "metaflow==2.19.22",
    "metaflow-ray==0.1.4",
    # Extension layer — exact pins from Story 1.2 Spike
    "lancedb==0.30.2",
    "pylance>=6.0.0",
    "duckdb==1.5.2",
    # Data models & config
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # PyArrow: exact pin from Story 1.2 Spike (must match Daft + Lance bundle)
    "pyarrow==23.0.1",
    # Observability
    "structlog>=24.4",
    "prometheus-client>=0.21",
    # Resilience
    "tenacity>=9.0",
    # Object storage
    "boto3>=1.35",
    # HTTP client (Story 3.2)
    "httpx>=0.28",
    # Multimodal ingestion (Stories 3.3-3.4)
    "Pillow>=10.4",
    "av>=12.0",
    # Embedding (Stories 4.1, 4.3)
    "sentence-transformers>=3.3",
    # CLI (Story 7.2)
    "click>=8.1",
    "rich>=13.0",
    # REST API (v0.2.0)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
    "slowapi>=0.1.9",

    # Distributed session & JWT blacklist (v1.3.0)
    "redis[hiredis]>=5.0,<6.0",
    # Deduplication (NeMo Curator MinHash fallback)
    "datasketch>=1.6",
]

[project.scripts]
arrow-lake = "arrow_lake.cli:main"

[project.optional-dependencies]
jupyter = ["jupyterlab>=4.0", "ipywidgets>=8.0"]
fts = ["tantivy>=0.20.0", "jieba>=0.42"]
rag = ["openai>=1.50", "anthropic>=0.40", "jinja2>=3.1"]
nemo-curator = ["nemo-curator>=0.6"]
dedup = ["imagehash>=4.3"]
modelscope = ["modelscope>=1.18"]
otel = ["opentelemetry-api>=1.24", "opentelemetry-sdk>=1.24", "opentelemetry-exporter-otlp-proto-grpc>=1.24"]
jwt = ["PyJWT>=2.9"]
gravitino = ["apache-gravitino>=1.2.1"]
gpu = ["torch>=2.4"]
document = ["kreuzberg>=0.1"]
chunking-advanced = ["semchunk>=2.0"]
chunking-semantic = ["chonkie>=1.0", "sentence-transformers>=3.3"]
chunking-full = ["semchunk>=2.0", "chonkie>=1.0", "sentence-transformers>=3.3"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.6",
    "ruff>=0.9.0",
    "mypy>=1.15",
    "pre-commit>=4.2",
    "types-PyYAML>=6.0",
    "bandit>=1.7",
    "respx>=0.22",
    "fakeredis>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arrow_lake", "flows"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["arrow_lake", "flows"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["E501", "B008", "S101", "RUF002", "RUF003", "PERF203"]

[tool.ruff.lint.per-file-ignores]
"tests/api/*" = ["S101", "S106"]
"examples/deployment/13_rest_api_basics.py" = ["RUF001", "RUF002", "RUF003"]
"examples/deployment/14_rest_api_search_query.py" = ["RUF001", "RUF002", "RUF003"]
"examples/deployment/15_rest_api_advanced.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "daft.*",
    "lancedb.*",
    "ray.*",
    "metaflow.*",
    "duckdb.*",
    "lance.*",
    "boto3.*",
    "botocore.*",
    "tenacity.*",
    "prometheus_client.*",
    "structlog.*",
    "tqdm.*",
    "pyarrow.*",
    "httpx.*",
    "PIL.*",
    "Pillow.*",
    "av.*",
    "torch.*",
    "sentence_transformers.*",
    "kreuzberg.*",
    "jieba.*",
    "semchunk.*",
    "chonkie.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: Integration tests (require Docker Compose)",
    "e2e: End-to-end tests",
    "smoke: Platform boot smoke tests",
    "benchmark: NO-GO gate latency benchmarks (require local LLM)",
    "distributed_gpu: Distributed GPU tests (requires K8s cluster, excluded from CI)",
    "slow: Slow-running tests (>30s)",
    "perf_regression: Performance regression tests (compare against baselines)",
]

[tool.coverage.run]
source = ["arrow_lake"]
branch = true
parallel = true
omit = [
    "arrow_lake/cli/**",
    "arrow_lake/server.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
