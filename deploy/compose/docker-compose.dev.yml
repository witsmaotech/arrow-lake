# DIntelliHub 开发环境
# 用法: docker compose -f deploy/compose/docker-compose.dev.yml up -d
#
# 包含: MinIO (S3), Redis, Ray Head + Worker
# 不包含: DIntelliHub Server (本地 uvicorn 运行更方便调试)

services:
  minio:
    image: minio/minio:latest
    container_name: dintellihub-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/dintellihub-dev --ignore-existing;
      mc ls local;
      "

  redis:
    image: redis:7-alpine
    container_name: dintellihub-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ray-head:
    image: rayproject/ray:2.40.0
    container_name: dintellihub-ray-head
    ports:
      - "8265:8265"   # Ray Dashboard
      - "10001:6379"  # Ray GCS (避免与 Redis 冲突)
    command: >
      ray start
      --head
      --dashboard-host=0.0.0.0
      --dashboard-port=8265
      --port=6379
      --block
    volumes:
      - ray-storage:/tmp/ray
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8265"]
      interval: 15s
      timeout: 10s
      retries: 5

  ray-worker:
    image: rayproject/ray:2.40.0
    container_name: dintellihub-ray-worker
    command: >
      ray start
      --address=ray-head:6379
      --block
    volumes:
      - ray-storage:/tmp/ray
    depends_on:
      ray-head:
        condition: service_healthy
    deploy:
      replicas: 1

volumes:
  minio-data:
  ray-storage:
