<line x1="515.0" y1="270" x2="305.0" y2="270" stroke="#60a5fa" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="5,3" marker-end="url(#m-slate)"/>
<text x="410.0" y="262.0" font-size="9.5" font-weight="600" fill="#60a5fa" text-anchor="middle">3. task_id</text>
<line x1="305.0" y1="310" x2="95.0" y2="310" stroke="#22d3ee" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="5,3" marker-end="url(#m-cyan)"/>
<text x="200.0" y="302.0" font-size="9.5" font-weight="600" fill="#22d3ee" text-anchor="middle">4. return task_id (non-blocking)</text>
<line x1="305.0" y1="350" x2="725.0" y2="350" stroke="#fbbf24" stroke-width="1.9" stroke-linecap="round" marker-end="url(#m-amber)"/>
