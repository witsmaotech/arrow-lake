  /api/v1/datasets:
    get:
      tags:
      - datasets
      summary: List Datasets
      description: List all datasets with metadata. Supports pagination via limit/offset.
      operationId: list_datasets_api_v1_datasets_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
