<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RAG 问答 · Arrow Lake</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css"/><link rel="stylesheet" href="assets/app.css"/>
</head>
<body>
<div id="app">
<main class="main">
  <div class="page" style="height:calc(100vh - var(--header-h) - var(--s5)*2);grid-template-rows:auto auto 1fr">
    <div class="h-sec between">
      <div><h1>RAG 问答</h1><div class="desc">引用追踪 · 多 Provider 流式 · 会话持久化</div></div>
      <div class="flex"><select class="select"><option>papers</option><option>regulations</option><option>knowledge_base</option></select><span class="tag teal" title="v1.8.9 默认 reranker（OllamaReranker · Qwen3-Reranker yes/no judge）"><i class="placeholder" data-ic="gauge"></i> reranker: ollama</span><span class="lamp ok pulse"><i></i>会话持久（跨重启 · RagSessionStore）</span></div>
    </div>

    <!-- mode switch: two real endpoints -->
    <div class="flex between wrap">
      <div class="flex" style="gap:6px">
        <button class="tag teal" data-md="rag" onclick="setMd('rag')">RAG · /rag/query</button>
        <button class="tag" data-md="graph" onclick="setMd('graph')">GraphRAG · /kg/query/graphrag</button>
      </div>
      <div class="flex" id="modeParams"></div>
    </div>

    <div class="grid" style="grid-template-columns:220px 1fr 280px;gap:var(--s4);min-height:0">
      <div class="panel flush" style="overflow:auto">
        <div class="panel-h"><i class="placeholder" data-ic="rag"></i><h3>会话</h3><div class="actions"><button class="btn btn-icon btn-ghost btn-sm"><i class="placeholder" data-ic="plus"></i></button></div></div>
        <div id="sessions"></div>
      </div>
      <div class="panel flush" style="display:flex;flex-direction:column;min-height:0">
        <div class="panel-h"><i class="placeholder" data-ic="sparkle"></i><h3 id="chatTitle">高效注意力机制的研究脉络</h3><span class="actions"><span class="tag">claude-sonnet-5</span></div></div>
        <div class="chat" id="chat"></div>
        <div class="composer">
          <div class="flex between" style="margin-bottom:8px"><span class="muted mono" style="font-size:.7rem" id="endpt">POST /api/v1/rag/query</span><span class="muted mono" style="font-size:.7rem">⏎ 发送 · ⇧⏎ 换行</span></div>
          <div class="flex"><input class="input mono" id="msg" value="Sparse Attention 之后又出现了哪些改进？"/><button class="btn btn-primary" onclick="send()">发送</button></div>
        </div>
      </div>
      <div class="panel flush" style="overflow:auto">
        <div class="panel-h"><i class="placeholder" data-ic="doc"></i><h3>引用 · 逐论断溯源</h3></div>
        <div id="cites"></div>
      </div>
    </div>
  </div>
</main>
</div>
<script src="assets/layout.js"></script>
<script>
const {renderShell,icon}=window;
renderShell({active:'rag',crumb:'<b>RAG 问答</b>'});
const $=s=>document.querySelector(s);
let md='rag';
function setMd(m){md=m;$$('.tag[data-md]').forEach(t=>t.classList.toggle('teal',t.dataset.md===m));renderParams();renderChat();renderCites()}
function renderParams(){
  $('#modeParams').innerHTML = md==='rag'
    ? `<select class="select" style="width:170px" title="retrieval_strategy"><option>retrieval: hybrid</option><option>retrieval: vector</option><option>retrieval: fts</option></select><span class="tag">top_k=10</span>${templateSel()}`
    : `<span class="tag" style="display:inline-flex;align-items:center;gap:6px">traversal_depth <input type="range" min="1" max="10" value="2" style="width:60px;accent-color:var(--teal)"><b class="readout" id="dv">2</b></span><span class="tag" style="display:inline-flex;align-items:center;gap:6px">graph_weight <input type="range" min="0" max="1" step="0.1" value="0.3" style="width:60px;accent-color:var(--teal)"><b class="readout" id="wv">0.3</b></span><span class="tag">top_k=5</span>`;
  $('#endpt').textContent = md==='rag'?'POST /api/v1/rag/query':'POST /api/v1/kg/query/graphrag';
  const dv=$('#dv'),wv=$('#wv');
  dv&&dv.previousElementSibling.addEventListener('input',e=>dv.textContent=e.target.value);
  wv&&wv.previousElementSibling.addEventListener('input',e=>wv.textContent=e.target.value);
}
function templateSel(){return `<select class="select" style="width:130px" title="template_name"><option>模板: default</option><option>模板: research</option></select>`}

$('#sessions').innerHTML=[
['高效注意力机制的研究脉络','2 分钟前',true],['巴塞尔 III 资本要求','1 小时前',false],['多模态资产检索优化','昨天',false],['训练数据去重策略','昨天',false],
].map(s=>`<a class="sess ${s[2]?'active':''}" style="display:block;padding:10px var(--card-pad);border-bottom:1px solid var(--line-soft);cursor:pointer;text-decoration:none"><div style="font-size:.8rem;color:${s[2]?'var(--teal-bright)':'var(--fg-hi)'};font-weight:500">${s[0]}</div><div class="muted mono" style="font-size:.65rem;margin-top:2px">${s[1]}</div></a>`).join('');

function renderChat(){$('#chat').innerHTML=`
<div class="msg user"><div class="bubble">Sparse Attention 之后又出现了哪些改进？</div></div>
<div class="msg ai"><div class="avatar">AI</div><div class="bubble">Sparse Attention 之后主要有四条改进脉络<sup class="cite">[1]</sup>：<br/>1. <b>全局/滑动窗口</b> — Longformer<sup class="cite">[1]</sup>；2. <b>低秩近似</b> — Linformer<sup class="cite">[2]</sup>；3. <b>随机+理论统一</b> — Big Bird<sup class="cite">[3]</sup>；4. <b>核方法</b> — Performer<sup class="cite">[4]</sup>。<br/><br/>${md==='graph'?'<b>图谱</b>显示它们以 Sparse Attention 为中心构成"扩展/对比"方法簇<sup class="cite">[KG]</sup>。':''}</div></div>`;}

// real citation fields: chunk_index, dataset, row_id, score, text_excerpt
function renderCites(){$('#cites').innerHTML=[
[1,'papers','row_0042',0.89,1.0,'Longformer 用滑动窗口 + 少量全局 token 兼顾局部与长程依赖…'],
[2,'papers','row_0118',0.82,1.0,'Linformer 将 N×N 注意力矩阵投影到低秩空间，复杂度降至线性…'],
[3,'papers','row_0503',0.76,0.0,'Big Bird 证明随机+窗口+全局是 Turing 完备的通用近似器…'],
[4,'papers','row_0331',0.71,0.0,'Performer 用随机特征（FAVOR+）无偏近似 Softmax…'],
].map(c=>`<a class="cite-card" href="dataset-detail.html"><div class="flex between"><span class="tag teal">[${c[0]}]</span><span class="muted mono" style="font-size:.65rem">${c[1]} · ${c[2]} · retr ${c[3].toFixed(2)} · rerank ${c[4]===1?'<b style="color:var(--ok)">✓</b>':'<b style="color:var(--fg-lo)">✗</b>'}</span></div><div style="margin-top:6px;color:var(--fg-md);font-size:.78rem;line-height:1.5;${c[4]===0?'opacity:.55':''}">${c[5]}</div></a>`).join('')
+ (md==='graph'?`<a class="cite-card" href="kg.html"><div class="flex between"><span class="tag amber">[KG]</span><span class="muted mono" style="font-size:.65rem">kg_papers · 子图 5 实体</span></div><div style="margin-top:6px;color:var(--fg-md);font-size:.78rem">method 簇：Sparse Attention ↔ {Longformer, Big Bird, Linformer, Performer}</div></a>`:'');}

function send(){const m=$('#msg').value;if(!m)return;const c=$('#chat');c.insertAdjacentHTML('beforeend',`<div class="msg user"><div class="bubble">${m}</div></div><div class="msg ai"><div class="avatar">AI</div><div class="bubble"><span class="muted">[${md==='rag'?'retrieve → rerank(ollama) → generate':'GraphRAG · 检索子图 → rerank'}]</span> 生成中…</div></div>`);$('#msg').value='';c.scrollTop=c.scrollHeight;const bubbles=c.querySelectorAll('.msg.ai .bubble');const last=bubbles[bubbles.length-1];setTimeout(()=>{last.innerHTML=`基于检索到的上下文<sup class="cite">[1]</sup>，与已有文献结论一致<sup class="cite">[2]</sup>。${md==='graph'?'<b>图谱</b>关系也支持这一推断<sup class="cite">[KG]</sup>。':''}`;c.scrollTop=c.scrollHeight},900)}
$('#msg').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
renderParams();renderChat();renderCites();
function $$(s){return[...document.querySelectorAll(s)]}
</script>
<style>
.msg{display:flex;gap:10px;padding:var(--s4) var(--card-pad)}.msg.user{justify-content:flex-end}.bubble{max-width:78%;padding:10px 14px;border-radius:var(--r-lg);line-height:1.6;font-size:.875rem}
.msg.user .bubble{background:var(--teal);color:var(--ink-950);border-bottom-right-radius:2px}
.msg.ai{align-items:flex-start}.msg.ai .bubble{background:var(--ink-800);border:1px solid var(--line);border-bottom-left-radius:2px}.msg.ai .avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--info));display:grid;place-items:center;font-size:.65rem;font-weight:700;color:var(--ink-950);flex-shrink:0}
.cite{color:var(--amber-bright);font-weight:600;font-family:var(--font-mono);font-size:.7rem}
.chat{flex:1;overflow-y:auto}.composer{padding:var(--s4);border-top:1px solid var(--line)}
.sess:hover{background:var(--ink-800)}
.cite-card{display:block;padding:var(--s4) var(--card-pad);border-bottom:1px solid var(--line-soft);text-decoration:none}.cite-card:hover{background:rgba(255,255,255,.015)}
@media(max-width:1100px){.page [style*="220px 1fr 280px"]{grid-template-columns:1fr !important}.panel.flush:nth-child(1),.panel.flush:nth-child(3){display:none}}
</style>
</body>
</html>
