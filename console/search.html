<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>检索 · Arrow Lake Console</title>
<link rel="stylesheet" href="assets/tokens.css"/>
<link rel="stylesheet" href="assets/app.css"/>
<link rel="stylesheet" href="assets/console.css"/>
<style>
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-soft);margin-bottom:var(--s3);flex-wrap:wrap}
  .tab{padding:8px 14px;font-size:.82rem;color:var(--fg-md);border-bottom:2px solid transparent;cursor:pointer;border-radius:var(--r-sm) var(--r-sm) 0 0}
  .tab.active{color:var(--teal-bright);border-bottom-color:var(--teal-bright);font-weight:600}
  .tab:hover{background:var(--ink-900)}
  .hit{border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:10px}
  .hit-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .hit-score{font-family:var(--font-mono);font-size:.72rem;padding:2px 8px;border-radius:var(--r-sm);background:var(--ink-900);color:var(--teal-bright);border:1px solid var(--line-soft)}
  .hit-text{font-size:.85rem;color:var(--fg-md);line-height:1.55;max-height:120px;overflow:auto}
  .hit-meta{font-family:var(--font-mono);font-size:.68rem;color:var(--fg-lo);margin-top:6px}
  .schema-chip{display:inline-block;font-family:var(--font-mono);font-size:.72rem;padding:2px 8px;border:1px solid var(--line-soft);border-radius:var(--r-sm);background:var(--ink-900);margin:0 4px 4px 0;cursor:default}
  .schema-chip.vec{border-color:var(--teal-soft,var(--line));color:var(--teal-bright)}
  .schema-chip.txt{color:var(--fg-hi)}
  .chip-btn{cursor:pointer}
  .chip-btn:hover{border-color:var(--teal-bright);color:var(--teal-bright)}
  .idx-row{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:.74rem}
  .check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;margin-top:6px}
  .check-grid label{display:flex;gap:6px;align-items:center;font-size:.78rem;padding:4px 8px;border:1px solid var(--line-soft);border-radius:var(--r-sm);cursor:pointer}
  .check-grid label:hover{border-color:var(--teal-bright)}
</style>
</head>
<body>
<div id="app">
<main class="main"><div class="page">
  <div class="h-sec between">
    <div><h1>检索</h1><div class="desc">向量 / FTS / 混合 / Facets / Ensemble · 选数据集后自动加载 schema,列名按类型推导成下拉/复选</div></div>
    <div class="flex" style="gap:8px;align-items:center">
      <select class="select" id="ds" style="min-width:220px"></select>
      <button class="btn btn-ghost btn-sm" id="dsExport" title="异步导出当前数据集为 Parquet(202 任务 + 下载)" style="display:none">⬇ 导出</button>
    </div>
  </div>

  <!-- 元数据:状态 + schema + 现有索引 -->
  <div class="panel"><div class="panel-b" id="meta"><div class="muted" style="padding:16px">选择数据集后加载元数据…</div></div></div>
  <div class="panel flush" id="schemaPanel" style="margin-top:var(--s4);display:none">
    <div class="panel-h"><i class="placeholder" data-ic="code"></i><h3>Schema(字段)</h3><span class="sub" id="schemaMeta">—</span><span class="sub" id="dsIndicator"></span></div>
    <div class="panel-b" id="schema"></div>
  </div>
  <div class="panel flush" id="idxPanel" style="margin-top:var(--s4);display:none">
    <div class="panel-h"><i class="placeholder" data-ic="search"></i><h3>现有索引</h3><span class="sub" id="idxMeta">—</span></div>
    <div class="panel-b" id="indexes"></div>
  </div>

  <!-- 检索表单 -->
  <div class="panel flush" style="margin-top:var(--s4)">
    <div class="panel-h"><i class="placeholder" data-ic="search"></i><h3>检索</h3></div>
    <div class="panel-b">
      <div class="tabs" id="modeTabs">
        <div class="tab active" data-mode="vector">向量</div>
        <div class="tab" data-mode="fts">FTS</div>
        <div class="tab" data-mode="hybrid">混合</div>
        <div class="tab" data-mode="faceted">Facets</div>
        <div class="tab" data-mode="ensemble">Ensemble</div>
      </div>
      <div class="field"><label>查询文本</label>
        <div class="flex" style="gap:8px">
          <input class="input" id="query" placeholder="输入查询(向量/混合/Facets/Ensemble 会先嵌入)"/>
          <button class="btn btn-primary btn-sm" id="searchBtn">检索</button>
          <button class="btn btn-ghost btn-sm" data-fav="search" title="收藏到我的工作区(需 personal token)">收藏</button>
        </div>
      </div>

      <!-- 以图搜图:仅 image_embedding 数据集 + EDITOR 显隐 -->
      <div class="field" id="imageQueryField" style="display:none;margin-top:var(--s3)">
        <label>以图搜图(上传图片 → CLIP 图像向量 → 检索 image_embedding · 需 EDITOR + 本地 embedding 后端)</label>
        <div class="flex" style="gap:8px;align-items:center;flex-wrap:wrap">
          <input class="input" id="imageFile" type="file" accept="image/*" style="max-width:280px"/>
          <img id="imagePreview" alt="" style="max-width:96px;max-height:72px;border-radius:var(--r-sm);border:1px solid var(--line-soft);display:none;background:var(--ink-900)"/>
          <button class="btn btn-teal btn-sm" id="imageSearchBtn" type="button">🖼️ 以图搜图</button>
        </div>
      </div>
      <div class="grid g-3" style="margin-top:var(--s3)">
        <div class="field"><label>top_k</label><input class="input mono" id="topK" type="number" min="1" value="10"/></div>
        <div class="field" id="vColField"><label>vector_column(向量列)</label><select class="select" id="vCol"></select></div>
        <div class="field" id="fColField" style="display:none"><label>fts_column(文本列)</label><select class="select" id="fCol"><option value="">(默认)</option></select></div>
      </div>

      <div class="field" id="facetsField" style="display:none;margin-top:var(--s3)">
        <label>facets 列(标量列,勾选用于分面过滤)</label>
        <div class="check-grid" id="facetsGrid"><span class="muted" style="font-size:.74rem">选择数据集后列出标量列…</span></div>
      </div>
      <div class="field" id="columnsField" style="display:none;margin-top:var(--s3)">
        <label>ensemble 向量列(多列加权融合)</label>
        <div class="check-grid" id="colsGrid"><span class="muted" style="font-size:.74rem">选择数据集后列取向量列…</span></div>
      </div>

      <div class="field" style="margin-top:var(--s3)"><label>where 过滤(SQL,可选 · 点列名插入)</label>
        <input class="input mono" id="where" placeholder="例:year > 2020 AND category = 'x'"/>
        <div id="whereCols" style="margin-top:6px"></div>
      </div>
    </div>
  </div>

  <!-- 结果 -->
  <div class="panel flush" style="margin-top:var(--s4)">
    <div class="panel-h"><i class="placeholder" data-ic="database"></i><h3>结果</h3><span class="sub" id="resMeta">—</span></div>
    <div class="panel-b" id="results"><div class="muted" style="padding:20px;text-align:center">输入查询开始检索</div></div>
  </div>

  <div class="panel flush" id="kgSubPanel" style="margin-top:var(--s4);display:none">
    <div class="panel-h"><i class="placeholder" data-ic="share-nodes"></i><h3>相关实体子图(KG)</h3><span class="sub" id="kgSubMeta">—</span></div>
    <div class="panel-b"><div id="kgSub" style="height:320px;border:1px solid var(--line-soft);border-radius:var(--r-md);background:var(--ink-900)"></div></div>
  </div>
</div></main>
</div>

<script src="assets/console-layout.js"></script>
<script src="vendor/vis-network.bundle.min.js"></script>
<script type="module">
import { request } from "./src/api.js";
import { isLoggedIn } from "./src/auth.js";
import { runExport } from "./src/export.js";
import { toast } from "./src/ui/toast.js";
import { renderKgSubgraph } from "./src/kg-subgraph.js";
import "./src/favorite.js";  // [data-fav] 自动绑收藏入口

if (!isLoggedIn()) location.href = "login.html";
const { renderShell } = window;
const isImageMode = new URL(location.href).searchParams.get("mode") === "image";
renderShell({ active: isImageMode ? "image-search" : "search", crumb: '<a href="datasets-data.html">数据集</a> › <b>' + (isImageMode ? "图像检索" : "检索") + "</b>" });
if (isImageMode) { document.querySelector("h1").textContent = "图像检索"; }
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// role 从 JWT payload 解(/embed/image 需 EDITOR,与 console-layout.js / audit.html 同款)
function userRole() {
  try {
    const tok = localStorage.getItem("al_access"); if (!tok) return "viewer";
    const p = JSON.parse(atob(tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
    return String(p.role || "editor").toLowerCase();
  } catch (_) { return "viewer"; }
}
const canEdit = () => ["editor", "admin"].includes(userRole());

let mode = "vector";
let schemaFields = [];
let imageVecCol = null;  // image_embedding 列名(检测到则显以图搜图区)

const isVec = (t) => /fixed_size_list/i.test(t);
const isTxt = (t) => /string|utf8|large_string/i.test(t);
const vecCols = () => schemaFields.filter(f => isVec(f.type)).map(f => f.name);
const txtCols = () => schemaFields.filter(f => isTxt(f.type)).map(f => f.name);
const scalarCols = () => schemaFields.filter(f => !isVec(f.type) && !isTxt(f.type)).map(f => f.name);

$("#modeTabs").addEventListener("click", (e) => {
  const t = e.target.closest(".tab"); if (!t) return;
  $("#modeTabs").querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
  mode = t.dataset.mode;
  $("#facetsField").style.display = mode === "faceted" ? "" : "none";
  $("#columnsField").style.display = mode === "ensemble" ? "" : "none";
  $("#vColField").style.display = mode === "fts" ? "none" : "";
  $("#fColField").style.display = (mode === "fts" || mode === "hybrid") ? "" : "none";
});

async function loadDatasets() {
  try {
    const data = await request("GET", "/datasets");
    const all = data?.datasets || [];
    // 只列可检索的:有 FTS/向量索引;系统表/图片表无索引 → 过滤掉
    const searchable = all.filter(d => d.has_vector_index || d.has_fts_index);
    const preset = new URL(location.href).searchParams.get("ds");
    const tag = (d) => (d.has_vector_index && d.has_fts_index) ? "向量+FTS" : d.has_vector_index ? "向量" : "FTS";
    $("#ds").innerHTML = `<option value="">— 选择数据集(${searchable.length}/${all.length} 可检索)—</option>` + searchable.map(d => `<option value="${esc(d.name)}"${d.name === preset ? " selected" : ""}>${esc(d.name)} · ${tag(d)} · ${(d.num_rows ?? 0).toLocaleString()} 行</option>`).join("");
    if ($("#ds").value) loadMeta();
  } catch (e) { toast("数据集列表加载失败:" + (e?.detail || e?.message || e), "warn"); }
}
$("#ds").addEventListener("change", loadMeta);

async function loadMeta() {
  const name = $("#ds").value;
  if (!name) { $("#meta").innerHTML = '<div class="muted" style="padding:16px">选择数据集后加载元数据…</div>'; $("#schemaPanel").style.display = "none"; $("#idxPanel").style.display = "none"; return; }
  $("#meta").innerHTML = '<div class="muted" style="padding:16px">加载中…</div>';
  // 1) 状态
  try {
    const d = await request("GET", `/datasets/${encodeURIComponent(name)}`);
    const warn = (ok, yes, no) => `<span style="color:${ok ? "var(--ok)" : "var(--warn)"}">${ok ? yes : no}</span>`;
    $("#meta").innerHTML = `<div class="grid g-4">
      <div class="kpi"><div class="label">行数</div><div class="val">${(d.num_rows ?? 0).toLocaleString()}</div></div>
      <div class="kpi"><div class="label">列数</div><div class="val">${d.num_columns ?? "—"}</div></div>
      <div class="kpi"><div class="label">向量索引</div><div class="val" style="font-size:.9rem">${warn(d.has_vector_index, "✓ 已建", "✗ 未建")}</div></div>
      <div class="kpi"><div class="label">FTS 索引</div><div class="val" style="font-size:.9rem">${warn(d.has_fts_index, "✓ 已建", "✗ 未建")}</div></div>
    </div>${(!d.has_vector_index && !d.has_fts_index) ? `<div class="muted" style="font-size:.74rem;margin-top:8px">提示:该数据集尚无检索索引,结果可能为空 — 去 <a href="embeddings.html?ds=${encodeURIComponent(name)}" style="color:var(--teal-bright)">embeddings</a> 建一个</div>` : ""}`;
  } catch (e) { $("#meta").innerHTML = `<div style="color:var(--danger);padding:12px">元数据加载失败:${esc(e?.detail || e?.message || e)}</div>`; }
  loadSchema(); loadIndexes();
}

async function loadSchema() {
  const name = $("#ds").value; if (!name) return;
  try {
    const s = await request("GET", `/datasets/${encodeURIComponent(name)}/schema`);
    schemaFields = s?.fields || [];
    $("#schemaPanel").style.display = "";
    $("#schemaMeta").textContent = `${schemaFields.length} 字段 · 向量 ${vecCols().length} · 文本 ${txtCols().length} · 标量 ${scalarCols().length}`;
    $("#schema").innerHTML = schemaFields.map(f => `<span class="schema-chip ${isVec(f.type) ? "vec" : isTxt(f.type) ? "txt" : ""}" title="${esc(f.type)}">${esc(f.name)} <span style="color:var(--fg-lo)">: ${esc(f.type)}</span></span>`).join("");
    // 填充下拉/复选(精确匹配:只列真实向量/文本列,无则占位,不回落到全部列)
    const vc = vecCols(); const tc = txtCols(); const sc = scalarCols();
    const opt = (arr, def) => arr.length
      ? arr.map(c => `<option value="${esc(c)}"${c === def ? " selected" : ""}>${esc(c)}</option>`).join("")
      : `<option value="">(无)</option>`;
    $("#vCol").innerHTML = opt(vc, vc[0] || "");
    $("#fCol").innerHTML = `<option value="">(默认)</option>` + opt(tc, tc[0] || "");
    $("#facetsGrid").innerHTML = sc.length ? sc.map(c => `<label><input type="checkbox" value="${esc(c)}"/> ${esc(c)}</label>`).join("") : '<span class="muted" style="font-size:.74rem">无标量列</span>';
    $("#colsGrid").innerHTML = (vc.length ? vc : []).map(c => `<label><input type="checkbox" value="${esc(c)}" ${c === "text_embedding" ? "checked" : ""}/> ${esc(c)}</label>`).join("") || '<span class="muted" style="font-size:.74rem">无向量列</span>';
    // 图像数据集:含 image_embedding 向量列 → 显徽标 + 以图搜图区(EDITOR)
    imageVecCol = vc.find(c => /image_embedding/i.test(c)) || null;
    $("#dsIndicator").innerHTML = imageVecCol ? '<span class="tag teal">🖼️ 图像数据集</span>' : "";
    $("#imageQueryField").style.display = (imageVecCol && canEdit()) ? "" : "none";
    // where 列名点击插入
    $("#whereCols").innerHTML = schemaFields.map(f => `<span class="schema-chip chip-btn" data-col="${esc(f.name)}">${esc(f.name)}</span>`).join("");
    $("#whereCols").querySelectorAll("[data-col]").forEach(el => el.addEventListener("click", () => {
      const w = $("#where");
      w.value = (w.value.trim() ? w.value.trim() + " " : "") + el.dataset.col + " ";
      w.focus();
    }));
  } catch (_) { /* schema 失败不阻塞检索 */ }
}

async function loadIndexes() {
  const name = $("#ds").value; if (!name) { $("#idxPanel").style.display = "none"; return; }
  try {
    const r = await request("GET", `/datasets/${encodeURIComponent(name)}/index`);
    const idx = r?.indices || [];
    $("#idxPanel").style.display = "";
    $("#idxMeta").textContent = `${idx.length} 个`;
    $("#indexes").innerHTML = idx.length ? idx.map(i => `<div class="idx-row"><span class="tag teal">${esc(i.type || "index")}</span><span class="mono" style="color:var(--fg-hi)">${esc(i.name || "(无名)")}</span><span class="muted">列: ${esc((i.columns || []).join(", ") || "—")}</span></div>`).join("") : '<div class="muted" style="font-size:.74rem;padding:6px 0">无索引</div>';
  } catch (_) { $("#idxPanel").style.display = "none"; }
}

async function embedQuery(text, vCol) {
  // image_embedding 列用 CLIP 跨模态文本塔(与图像同空间,支持文本搜图);普通向量列用 text embed
  const isClip = vCol && /image_embedding|clip/i.test(vCol);
  const r = await request("POST", isClip ? "/embed/clip-text" : "/embed/text", { body: { texts: [text] } });
  const vec = (r.embeddings || [])[0];
  if (!vec || !vec.length) throw new Error("嵌入返回空(检查 embedding 后端)");
  return vec;
}

// 以图搜图:FileReader → base64 → POST /embed/image {images:[b64]} → CLIP 图像向量(512 维)
async function embedImage(file) {
  const b64 = await new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => { const s = String(fr.result || ""); const i = s.indexOf(","); resolve(i >= 0 ? s.slice(i + 1) : s); };
    fr.onerror = () => reject(new Error("读取图片失败"));
    fr.readAsDataURL(file);
  });
  const r = await request("POST", "/embed/image", { body: { images: [b64] } });
  const vec = (r.embeddings || [])[0];
  if (!vec || !vec.length) throw new Error("图像嵌入返回空(需 EMBEDDING__BACKEND=local,OPENAI 后端返 501)");
  return vec;
}

// 文件选择 → 本地预览
$("#imageFile").addEventListener("change", (e) => {
  const f = e.target.files[0]; const prev = $("#imagePreview");
  if (f) {
    const url = URL.createObjectURL(f);
    prev.src = url; prev.style.display = "";
    const done = () => URL.revokeObjectURL(url);
    prev.onload = done; prev.onerror = done;  // 加载失败也释放,防 blob URL 泄露
  } else { prev.style.display = "none"; prev.removeAttribute("src"); }
});

// 以图搜图按钮
$("#imageSearchBtn").addEventListener("click", async () => {
  const name = $("#ds").value; if (!name) return toast("先选数据集", "warn");
  const file = $("#imageFile").files[0]; if (!file) return toast("先选择一张图片", "warn");
  if (file.size > 8 * 1024 * 1024) return toast("图片过大(>8MB),请压缩后再试", "warn");
  const vCol = imageVecCol || $("#vCol").value || "image_embedding";
  const top_k = parseInt($("#topK").value, 10) || 10;
  const where = $("#where").value.trim() || null;
  const btn = $("#imageSearchBtn"); btn.disabled = true; btn.textContent = "嵌入中…";
  $("#results").innerHTML = '<div class="muted" style="padding:20px;text-align:center">图像嵌入中(CLIP)…</div>';
  try {
    const qv = await embedImage(file);
    btn.textContent = "检索中…";
    const res = await request("POST", `/datasets/${encodeURIComponent(name)}/search/vector`, { body: { query_vector: qv, top_k, vector_column: vCol, where } });
    renderHits(res, "_distance");
    $("#query").value = "[以图搜图]";
  } catch (e) {
    const msg = e?.detail || e?.message || String(e);
    $("#resMeta").textContent = "失败";
    $("#results").innerHTML = `<div style="color:var(--danger);padding:16px">以图搜图失败:${esc(msg)}<br/><span class="muted" style="font-size:.72rem">/embed/image 需 EMBEDDING__BACKEND=local(OPENAI 后端返 501);确认数据集有 image_embedding 索引(去 <a href="embeddings.html?ds=${encodeURIComponent(name)}" style="color:var(--teal-bright)">embeddings</a> 建)。</span></div>`;
  } finally { btn.disabled = false; btn.textContent = "🖼️ 以图搜图"; }
});

function renderHits(res, scoreKey) {
  const rows = res?.rows || [];
  $("#resMeta").textContent = `${res?.row_count ?? rows.length} 命中 · ${res?.column_count ?? 0} 列`;
  if (!rows.length) { $("#results").innerHTML = `<div class="muted" style="padding:24px;text-align:center">无命中 — 换查询或确认已建对应索引(<a href="embeddings.html" style="color:var(--teal-bright">去建索引</a>)</div>`; return; }
  const textKeys = ["text", "text_content", "content", "title", "chunk", "body", "name"];
  $("#results").innerHTML = rows.map((r) => {
    const score = r[scoreKey] ?? r["_score"] ?? r["_distance"] ?? r["score"] ?? r["distance"];
    const tk = textKeys.find(k => r[k] != null);
    const snippet = tk ? String(r[tk]) : JSON.stringify(Object.entries(r).filter(([k]) => !k.startsWith("_")).slice(0, 4));
    const meta = Object.entries(r).filter(([k]) => !k.startsWith("_") && !textKeys.includes(k)).slice(0, 4).map(([k, v]) => `${k}=${typeof v === "object" ? "…" : String(v).slice(0, 30)}`).join(" · ");
    const _imgCols = ["image_thumbnail","image_preview","thumbnail","preview","image_data","video_data","image"];
    const _imgCol = _imgCols.find(k => {
      const v = r[k];
      if (typeof v !== "string" || !v) return false;
      if (/^<binary \d+ bytes>$/.test(v.trim())) return false;  // JSON 格式 binary 被占位,无法直渲
      return true;
    });
    const _iv = _imgCol ? r[_imgCol].trim() : "";
    const _src = _iv && (_iv.startsWith("data:") ? _iv : "data:image/jpeg;base64," + _iv);
    const _thumb = _src ? `<img src="${esc(_src)}" alt="" style="max-width:140px;max-height:100px;border-radius:var(--r-sm);border:1px solid var(--line-soft);margin:4px 0;display:block">` : "";
    return `<div class="hit"><div class="hit-head"><span class="hit-score">${scoreKey}: ${score?.toFixed?.(4) ?? esc(score ?? "—")}</span></div>${_thumb}<div class="hit-text">${esc(snippet.length > 400 ? snippet.slice(0, 400) + "…" : snippet)}</div>${meta ? `<div class="hit-meta">${esc(meta)}</div>` : ""}</div>`;
  }).join("");
}

$("#searchBtn").addEventListener("click", async () => {
  const name = $("#ds").value; if (!name) return toast("先选数据集", "warn");
  const query = $("#query").value.trim(); if (!query) return toast("输入查询", "warn");
  const top_k = parseInt($("#topK").value, 10) || 10;
  const where = $("#where").value.trim() || null;
  const vCol = $("#vCol").value || "text_embedding";
  const fCol = $("#fCol").value || null;
  const btn = $("#searchBtn"); btn.disabled = true; btn.textContent = "检索中…";
  $("#results").innerHTML = '<div class="muted" style="padding:20px;text-align:center">检索中…</div>';
  try {
    let res, scoreKey = "_distance";
    if (mode === "fts") {
      res = await request("POST", `/datasets/${encodeURIComponent(name)}/search/fts`, { body: { query, top_k, fts_column: fCol, where } });
      scoreKey = "_score";
    } else {
      if (mode !== "fts") $("#results").innerHTML = '<div class="muted" style="padding:20px;text-align:center">嵌入查询中…</div>';
      const qv = await embedQuery(query, vCol);
      if (mode === "vector") {
        res = await request("POST", `/datasets/${encodeURIComponent(name)}/search/vector`, { body: { query_vector: qv, top_k, vector_column: vCol, where } });
      } else if (mode === "hybrid") {
        res = await request("POST", `/datasets/${encodeURIComponent(name)}/search/hybrid`, { body: { query_vector: qv, query_text: query, top_k, vector_column: vCol, fts_column: fCol, where } });
      } else if (mode === "faceted") {
        const facets = [...$("#facetsGrid").querySelectorAll("input:checked")].map(c => c.value);
        res = await request("POST", `/datasets/${encodeURIComponent(name)}/search/faceted`, { body: { query_vector: qv, facets: facets.length ? facets : null, top_k, vector_column: vCol, where } });
      } else {
        const cols = [...$("#colsGrid").querySelectorAll("input:checked")].map(c => c.value);
        res = await request("POST", `/datasets/${encodeURIComponent(name)}/search/ensemble`, { body: { query_vector: qv, columns: cols.length ? cols : null, top_k, where } });
      }
    }
    renderHits(res, scoreKey);
    if (name && query) {
      $("#kgSubPanel").style.display = "";
      $("#kgSubMeta").textContent = "基于查询的实体子图";
      renderKgSubgraph($("#kgSub"), { dataset: name, query, limit: 30 });
    }
  } catch (e) {
    const msg = e?.detail || e?.message || String(e);
    $("#resMeta").textContent = "失败";
    $("#results").innerHTML = `<div style="color:var(--danger);padding:16px">检索失败:${esc(msg)}<br/><span class="muted" style="font-size:.72rem">常见:未建索引 → 去 <a href="embeddings.html" style="color:var(--teal-bright">embeddings</a> 建;embedding 后端未配置;where 语法错。</span></div>`;
  } finally { btn.disabled = false; btn.textContent = "检索"; }
});

// 导出当前数据集(EDITOR)
async function doDsExport() {
  const name = $("#ds").value; if (!name) return toast("先选数据集", "warn");
  const btn = $("#dsExport");
  try {
    toast(`导出 ${name}(parquet) 已提交,后台异步处理…`, "info");
    btn.disabled = true;
    await runExport(name, { format: "parquet" });
    toast(`导出完成:${name}.parquet`, "ok");
  } catch (e) {
    toast("导出失败:" + (e?.detail || e?.message || e), "warn", 5000);
  } finally { btn.disabled = false; }
}
if (canEdit()) $("#dsExport").style.display = "";
$("#dsExport").addEventListener("click", doDsExport);

loadDatasets();
window.applyIcons && applyIcons(document);
</script>
</body>
</html>
