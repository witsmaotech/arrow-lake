language: [zh, en]
name: concept_graph
type: graph
tags: [general, concept, knowledge, taxonomy]
description:
  zh: '通用概念关系图模板 — 从论文/报告/百科/技术文档提取概念与关系。general/concept_graph 的项目本地严格版：type/relation 严格枚举 + definition 必填，杜绝自由类型噪声与 0% 描述。'
  en: 'General concept-graph template — extract concepts and relations from papers/reports/encyclopedias/tech docs. Project-local strict version of general/concept_graph: strict type/relation enums + required definition, eliminating free-type noise and 0% description coverage.'

output:
  description:
    zh: '概念之间的层级关系和语义关联网络'
    en: 'Concept hierarchy and semantic association network'
  entities:
    description:
      zh: '文档中的核心概念'
      en: 'Core concepts in the document'
    fields:
      - name: name
        type: str
        description: { zh: '概念名称', en: 'Concept name' }
        required: true
      - name: type
        type: str
        description:
          zh: '按概念性质必须是以下之一：实体(具体对象/系统/机构/产品/地点)/属性(特征/指标/参数)/方法(技术/算法/做法/工具)/过程(流程/步骤/阶段)/角色(参与方/人员)/事件(发生的事情)/组织(团体/部门/公司)。禁止"概念/其他"等笼统值，必须选最具体匹配。'
          en: 'Type by concept nature, MUST be one of: entity(object/system/organization/product/place)/property(feature/metric/parameter)/method(technique/algorithm/practice/tool)/process(flow/steps/stage)/role(participant/person)/event(occurrence)/organization(group/department/company). Generic "concept/other" forbidden; pick the most specific match.'
        required: true
      - name: definition
        type: str
        description: { zh: '概念的简要定义（必填，用一句话说明该概念是什么/做什么）', en: 'Brief concept definition (required; one sentence on what it is/does)' }
        required: true
  relations:
    description:
      zh: '概念之间的层级关系和语义关联'
      en: 'Hierarchy and semantic associations between concepts'
    fields:
      - name: source
        type: str
        description: { zh: '源概念名称', en: 'Source concept name' }
        required: true
      - name: target
        type: str
        description: { zh: '目标概念名称', en: 'Target concept name' }
        required: true
      - name: type
        type: str
        description:
          zh: '关系类型，必须是以下之一：属于/包含/导致/相关/对立/示例/扩展/依赖/组成/实现。禁止自创其他值或混用英文。'
          en: 'Relation type, MUST be one of: is_a/part_of/causes/related_to/opposite/example_of/extends/depends_on/composed_of/implements. Other values forbidden.'
        required: true
      - name: description
        type: str
        description: { zh: '关系说明', en: 'Relation description' }
        required: false

guideline:
  target:
    zh: '你是一位知识图谱专家，擅长从各类文档中提取概念之间的层级关系和语义关联。'
    en: 'You are a knowledge graph expert skilled at extracting concept hierarchy and semantic associations from documents.'
  rules_for_entities:
    zh:
      - '提取文档中定义的核心概念'
      - '概念名称应使用规范术语，同一概念在全文中保持命名一致'
      - '仅提取文本中明确表达的概念，不要臆测'
      - 'type 必须按概念性质选最具体匹配（实体/属性/方法/过程/角色/事件/组织），严禁用"概念"笼统归类'
      - 'definition 必填：用一句话说明该概念是什么或做什么，不可留空'
    en:
      - 'Extract core concepts defined in the document'
      - 'Use standard terminology; keep naming consistent throughout'
      - 'Only extract concepts explicitly expressed; do not speculate'
      - 'type must be the most specific match by nature; generic "concept" is forbidden'
      - 'definition is required: one sentence on what the concept is or does, never empty'
  rules_for_relations:
    zh:
      - 'type 必须严格使用枚举值之一（属于/包含/导致/相关/对立/示例/扩展/依赖/组成/实现），禁止自创或混用英文'
      - '优先提取文档中明确定义的关系'
      - '不要创建隐含的常识性关联，仅提取文档中明确说明的关系'
    en:
      - 'type must be one of the enumerated values; no custom values'
      - 'Prioritize explicitly defined relationships in the document'
      - 'Do not create implicit common-sense associations, only extract explicitly stated relationships'

identifiers:
  entity_id: name
  relation_id: '{source}|{type}|{target}'
  relation_members: { source: source, target: target }

display:
  entity_label: '{name}'
  relation_label: '{type}'
