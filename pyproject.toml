[project]
name = "arrow-lake"
version = "0.1.0"
description = "Unified multimodal data lakehouse — Lance + Daft + Ray"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Witshine", email = "wits@sunpw.dev"},
]
keywords = ["data-lakehouse", "multimodal", "lance", "daft", "ray", "vector-search"]

dependencies = [
    # Core stack (DARMU) — exact pins from Story 1.2 Spike
    "daft==0.7.8",
    "ray==2.54.1",
    "metaflow==2.19.22",
    "metaflow-ray==0.1.4",
    # Extension layer — exact pins from Story 1.2 Spike
    "lancedb==0.30.2",
    "duckdb==1.5.1",
    # Data models & config
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # PyArrow: exact pin from Story 1.2 Spike (must match Daft + Lance bundle)
    "pyarrow==23.0.1",
    # Observability
    "structlog>=24.4",
    "prometheus-client>=0.21",
    # Resilience
    "tenacity>=9.0",
    # Object storage
    "boto3>=1.35",
    "pylance>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "httpx>=0.28",
    "ruff>=0.9.0",
    "mypy>=1.15",
    "pre-commit>=4.2",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arrow_lake", "flows"]

[project.optional-dependencies]
gpu = [
    "torch>=2.4",
    "sentence-transformers>=3.3",
    "Pillow>=10.4",
    "av>=12.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["arrow_lake", "flows"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["E501", "B008", "S101", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "daft.*",
    "lancedb.*",
    "ray.*",
    "metaflow.*",
    "duckdb.*",
    "lance.*",
    "boto3.*",
    "botocore.*",
    "tenacity.*",
    "prometheus_client.*",
    "structlog.*",
    "tqdm.*",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: Integration tests (require Docker Compose)",
    "e2e: End-to-end tests",
    "smoke: Platform boot smoke tests",
]

[tool.coverage.run]
source = ["arrow_lake"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
