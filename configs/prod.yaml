storage:
  backend: s3
  s3_endpoint: ""  # use default AWS S3
  s3_region: "us-east-1"

api:
  tls_enabled: true
  ssl_certfile: "/etc/arrow-lake/tls/tls.crt"
  ssl_keyfile: "/etc/arrow-lake/tls/tls.key"
  security_headers_enabled: true
  content_security_policy: "default-src 'none'; frame-ancestors 'none'"
  docs_enabled: false
  cors_origins: []

rate_limit:
  enabled: true
  default_requests_per_minute: 120
  default_burst: 20
  exempt_paths:
    - "/health"
    - "/health/live"
    - "/health/ready"
    - "/metrics"

compute:
  gpu_enabled: true
  num_workers: 8

observability:
  metrics_enabled: true
  metrics_port: 8000
  metrics_path: "/metrics"
  log_level: WARNING

quality:
  enabled: true
  filter_mode: all
  schema_validation: strict
  dead_letter_enabled: true
  text_min_chars: 1
  image_min_width: 128
  image_min_height: 128
  dedup_enabled: true
  dedup_strategy: both
  dedup_action: remove
  dedup_perceptual_threshold: 8

argo:
  namespace: production
  service_account: arrow-lake
  workflow_timeout: 7200
  image: arrow-lake:latest
  image_pull_policy: IfNotPresent
  artifact_storage: ""

autoscale:
  enabled: true
  min_workers: 0
  max_workers: 8
  scale_up_timeout_seconds: 300
  idle_timeout_seconds: 600
  spot_preference: 0.8
  gpu_increment: 0.5

lifecycle:
  enabled: true
  standard_to_ia_days: 30
  ia_to_glacier_days: 90
  glacier_expiration_days: 365
  excluded_prefixes:
    - "thumbnails/"
    - "previews/"
  glacier_retrieval_tier: Standard

faceted:
  max_facet_values: 50
  default_facet_columns:
    - "modality"
    - "source"
  facet_filter_columns:
    - "modality"
    - "source"
    - "quality_score"
    - "created_at"

ensemble:
  default_top_k: 20
  rrf_k: 60
  fusion_method: rrf
  candidate_multiplier: 5

lineage:
  enabled: true
  store_dataset: "_lineage_events"
  auto_record: true

audit:
  enabled: true
  hmac_secret_key: ""  # MUST set via ARROW_LAKE__AUDIT__HMAC_SECRET_KEY
  audit_dataset: "_audit_trail"
  auto_record_workflow: true

export:
  default_format: parquet
  parquet_compression: zstd
  csv_delimiter: ","
  allow_overwrite: false

olap:
  max_result_rows: 50000
  max_query_memory_mb: 1024
  max_concurrent_queries: 8
  query_timeout_seconds: 120
  enable_predicate_pushdown: true
  enable_join: true
  enable_streaming: true
  ducklake_enabled: false

redis:
  enabled: true
  url: "redis://redis:6379/0"
  password: ""  # MUST set via ARROW_LAKE__REDIS__PASSWORD
  ssl: false
  semaphore_ttl_seconds: 300
  redis_pool_size: 10

hugegraph:
  enabled: true
  host: hg-server
  port: 8080
  graph_name: hugegraph
  timeout_seconds: 30.0
  build_concurrency: 10
  build_batch_delay: 1.0
