language: [zh, en]
name: legal_concept_graph
type: graph
tags: [legal, law, contract, case, compliance, concept, 法律]
description:
  zh: '法律/合规概念图 — 从法律条文、合同、判例、合规文档提取法律概念与关系（general/concept_graph 的法律领域特化：type/relation 严格枚举）'
  en: 'Legal/compliance concept graph — extract legal concepts and relations from statutes, contracts, case law, compliance docs (domain-specialized concept_graph with strict type/relation enums)'

output:
  description:
    zh: '法律文档中的核心法律概念及其规范关联'
    en: 'Core legal concepts and their normative associations in legal docs'
  entities:
    description:
      zh: '文档中的法律概念'
      en: 'Legal concepts in the document'
    fields:
      - name: name
        type: str
        description: { zh: '概念名称', en: 'Concept name' }
        required: true
      - name: type
        type: str
        description:
          zh: '按法律性质必须是以下之一：法条(法律条款/条文)/罪名(犯罪行为)/主体(自然人/机构)/权利(权益)/义务(责任)/行为(法律行为/事实行为)/客体(标的/对象)/程序(诉讼/流程)。禁止"概念"等笼统值，必须选最具体匹配。'
          en: 'Type by legal nature, MUST be one of: statute(clause/article)/charge(crime)/subject(person/entity)/right(entitlement)/obligation(duty/liability)/act(legal act/factual act)/object(subject matter)/procedure(litigation/process). Generic "concept" forbidden; pick the most specific match.'
        required: true
      - name: definition
        type: str
        description: { zh: '概念的简要定义', en: 'Brief concept definition' }
        required: false
  relations:
    description:
      zh: '法律概念之间的规范关联'
      en: 'Normative associations between legal concepts'
    fields:
      - name: source
        type: str
        description: { zh: '源概念名称', en: 'Source concept name' }
        required: true
      - name: target
        type: str
        description: { zh: '目标概念名称', en: 'Target concept name' }
        required: true
      - name: type
        type: str
        description:
          zh: '关系类型，必须是以下之一：触犯/规定/适用/禁止/属于/导致/保护/依据。禁止自创其他值或混用英文。'
          en: 'Relation type, MUST be one of: violates/stipulates/applies_to/prohibits/is_a/causes/protects/based_on. Other values forbidden.'
        required: true
      - name: description
        type: str
        description: { zh: '关系说明', en: 'Relation description' }
        required: false

guideline:
  target:
    zh: '你是一位法律知识图谱专家，擅长从法律条文、合同、判例、合规文档中提取法条、罪名、主体、权利、义务等概念及其规范关联。'
    en: 'You are a legal knowledge graph expert skilled at extracting statutes, charges, subjects, rights, obligations and their normative associations from legal documents.'
  rules_for_entities:
    zh:
      - '提取文档中明确表述的法律概念'
      - '概念名称应使用规范法律术语'
      - '同一概念在全文中保持命名一致'
      - 'type 必须按法律性质选最具体匹配（法条/罪名/主体/权利/义务/行为/客体/程序），严禁用"概念"笼统归类'
    en:
      - 'Extract legal concepts explicitly expressed in the document'
      - 'Concept names should use standard legal terminology'
      - 'Maintain consistent naming for the same concept throughout'
      - 'type must be the most specific match by legal nature; generic "concept" is forbidden'
  rules_for_relations:
    zh:
      - 'type 必须严格使用 description 列出的枚举值之一（触犯/规定/适用/禁止/属于/导致/保护/依据），禁止自创或混用英文'
      - '优先提取文档中明确规定的法律关系'
      - '不要创建隐含的常识性关联，仅提取文档中明确说明的关系'
    en:
      - 'type must be one of the enumerated values in the description; no custom values'
      - 'Prioritize explicitly stipulated legal relationships'
      - 'Do not create implicit common-sense associations, only extract explicitly stated relationships'

identifiers:
  entity_id: name
  relation_id: '{source}|{type}|{target}'
  relation_members: { source: source, target: target }

display:
  entity_label: '{name}'
  relation_label: '{type}'
