# Arrow Lake Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   - Copy .env.example to .env.production and configure
#   - Set required credentials (S3_ACCESS_KEY, S3_SECRET_KEY)
#   - docker compose -f docker-compose.prod.yml --env-file .env.production up -d

services:
  minio:
    image: minio/minio:RELEASE.2025-04-09T00-03-04Z
    container_name: arrow-lake-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${ARROW_LAKE__STORAGE__S3_ACCESS_KEY:?S3 access key is required}
      MINIO_ROOT_PASSWORD: ${ARROW_LAKE__STORAGE__S3_SECRET_KEY:?S3 secret key is required}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-07T17-41-53Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${ARROW_LAKE__STORAGE__S3_ACCESS_KEY} $${ARROW_LAKE__STORAGE__S3_SECRET_KEY};
      mc mb local/${ARROW_LAKE__STORAGE__S3_BUCKET:-arrow-lake} --ignore-existing;
      mc anonymous set download local/${ARROW_LAKE__STORAGE__S3_BUCKET:-arrow-lake};
      exit 0;
      "

  ray-head:
    image: rayproject/ray:2.54.1-py311
    container_name: arrow-lake-ray-head
    ports:
      - "6379:6379"
      - "8265:8265"
      - "8000:8000"
    environment:
      ARROW_LAKE__STORAGE__BACKEND: minio
      ARROW_LAKE__STORAGE__S3_ENDPOINT: http://minio:9000
      ARROW_LAKE__STORAGE__S3_ACCESS_KEY: ${ARROW_LAKE__STORAGE__S3_ACCESS_KEY}
      ARROW_LAKE__STORAGE__S3_SECRET_KEY: ${ARROW_LAKE__STORAGE__S3_SECRET_KEY}
      ARROW_LAKE__STORAGE__S3_BUCKET: ${ARROW_LAKE__STORAGE__S3_BUCKET:-arrow-lake}
      ARROW_LAKE__OBSERVABILITY__LOG_LEVEL: ${ARROW_LAKE__OBSERVABILITY__LOG_LEVEL:-INFO}
      ARROW_LAKE__OBSERVABILITY__METRICS_ENABLED: "true"
    volumes:
      - lake-data:/data/lake
    command: >
      ray start --head
      --port=6379
      --dashboard-host=0.0.0.0
      --block
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8265/api/status"]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      - minio
    restart: unless-stopped

  ray-worker:
    image: rayproject/ray:2.54.1-py311
    depends_on:
      ray-head:
        condition: service_started
    environment:
      ARROW_LAKE__STORAGE__S3_ENDPOINT: http://minio:9000
    volumes:
      - lake-data:/data/lake
    command: >
      ray start
      --address=ray-head:6379
      --block
    deploy:
      replicas: ${ARROW_LAKE__COMPUTE__NUM_WORKERS:-2}
    restart: unless-stopped

volumes:
  minio-data:
  lake-data:
