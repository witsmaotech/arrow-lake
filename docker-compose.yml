# DIntelliHub 本地开发环境
# 使用Docker Compose快速启动开发环境
# 注意: LanceDB作为Python库使用，不需要单独的Docker容器

services:
  # PostgreSQL 元数据库
  postgres:
    image: postgres:14-alpine
    container_name: dintellihub-postgres
    environment:
      POSTGRES_DB: gravitino
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"  # 使用15432避免与系统PostgreSQL冲突
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gravitino"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dintellihub-net

  # MinIO 对象存储 (开发环境替代S3)
  minio:
    image: minio/minio:latest
    container_name: dintellihub-minio
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - dintellihub-net

  # MinIO 初始化客户端（创建bucket）
  minio-init:
    image: minio/mc:latest
    container_name: dintellihub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set minio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb minio/dintellihub-raw --ignore-existing;
      /usr/bin/mc mb minio/dintellihub-processed --ignore-existing;
      /usr/bin/mc mb minio/dintellihub-vectors --ignore-existing;
      /usr/bin/mc mb minio/dintellihub-models --ignore-existing;
      /usr/bin/mc mb minio/dintellihub-backups --ignore-existing;
      echo 'MinIO buckets created successfully';
      "

  # Redis 缓存 (可选)
  # 注意: LanceDB作为Python库在应用代码中使用，数据存储在本地文件系统
  # 示例: db = lancedb.connect("/data/lancedb")
  redis:
    image: redis:7-alpine
    container_name: dintellihub-redis
    volumes:
      - redis_data:/data
    ports:
      - "16379:6379"  # 使用16379避免与系统Redis冲突
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - dintellihub-net

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:latest
    container_name: dintellihub-prometheus
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - dintellihub-net

  # Grafana 可视化
  grafana:
    image: grafana/grafana:latest
    container_name: dintellihub-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "13000:3000"  # 使用13000避免冲突
    depends_on:
      - prometheus
    networks:
      - dintellihub-net

  # LanceDB HTTP Service (向量数据库服务)
  lancedb-service:
    build:
      context: .
      dockerfile: python/Dockerfile.lancedb
    container_name: dintellihub-lancedb
    environment:
      - LANCEDB_URI=/data/lancedb
      - PORT=8765
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    volumes:
      - lancedb_data:/data/lancedb
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - dintellihub-net

  # Daft Processing HTTP Service (数据处理服务)
  daft-service:
    build:
      context: .
      dockerfile: python/Dockerfile.daft
    container_name: dintellihub-daft
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_USE_SSL=false
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DB=gravitino
      - LANCEDB_SERVICE_URL=http://lancedb-service:8765
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - RAY_ADDRESS=
      - DAFT_WORKERS=4
      - DAFT_MEMORY_LIMIT=16GB
    volumes:
      - ./data:/app/data
      - daft_cache:/tmp/daft_cache
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      lancedb-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - dintellihub-net

networks:
  dintellihub-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  lancedb_data:
    driver: local
  daft_cache:
    driver: local
