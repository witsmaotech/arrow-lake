name: CI

# v1.11.5-W1-2 pipeline: lint → full test suite → image build → pure-image
# smoke (health/version + six console group pages). Suite determinism is the
# W1-1 DoD (two consecutive clean runs; see docs_offline/v1115-w1-test-
# isolation-record.md) — the suite is CI-gate grade.
# NOTE: proxies. The Dockerfile defaults BUILD_PROXY to the WSL2 host relay
# (127.0.0.1:17887) — CI runners have direct internet, so we pass an empty
# build-arg. Aliyun apt/PyPI mirrors are public and reachable from runners.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install dependencies (all extras — W1 lesson, --group dev alone prunes he/document extras)
        run: uv sync --all-extras --group dev

      # Gate = high-signal error classes only (syntax + undefined names — the
      # NameError class that hid 真缺陷 #10). The full aspirational config
      # (~1.5k findings: I001/RUF001/F401/... legacy debt) runs as a
      # non-blocking visibility step below; shrink the debt, then promote rules
      # into the gate one code at a time.
      - name: Ruff gate (E9 syntax + F821 undefined names)
        run: uv run ruff check arrow_lake/ tests/ --select E9,F821

      - name: Ruff full config (debt visibility — non-blocking)
        run: uv run ruff check arrow_lake/ tests/ --statistics
        continue-on-error: true

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install dependencies (all extras)
        run: uv sync --all-extras --group dev

      # tests/conftest.py W1 anchors (env setdefault) make the suite hermetic:
      # local storage in a per-session tmpdir, no redis, no rate limit, dev
      # ADMIN api key. Live-gated groups (container_smoke/cookbook/daft) skip
      # themselves when the environment is absent. Default addopts deselect
      # benchmark/spike. Expected: 0 failed (template_generate ×2 is xfail:
      # hyperextract module-level global state, third-party).
      - name: Full test suite
        run: uv run pytest tests -q --tb=line

  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # runtime-ci target = runtime-base without the baked-model COPYs (those
      # need host-local msmodels/hfmodels named contexts; CI validates
      # deps+code+boot+console, the model bake stays a deploy-time concern).
      - name: Build image (runtime-ci target)
        run: docker build --target runtime-ci --build-arg BUILD_PROXY= -f deploy/Dockerfile -t arrow-lake:ci .

      # Pure-image smoke: one container, every external dependency disabled
      # (W1 made the LOCAL storage backend fully functional). Gate on
      # /health (readiness makedirs fix), /api/v1/version, and one page per
      # console nav group (六组首页).
      - name: Boot standalone container (externals off)
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e ARROW_LAKE__STORAGE__BACKEND=local \
            -e ARROW_LAKE__STORAGE__BASE_URI=/tmp/lake \
            -e ARROW_LAKE__SYSTEM_DB__ENABLED=false \
            -e ARROW_LAKE__REDIS__ENABLED=false \
            -e ARROW_LAKE__HUGEGRAPH__ENABLED=false \
            -e ARROW_LAKE__GRAVITINO__ENABLED=false \
            -e ARROW_LAKE__API__API_KEY=ci-smoke-key \
            arrow-lake:ci
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health || true)
            echo "health attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::container did not become healthy in 300s"
          docker logs smoke | tail -50
          exit 1

      - name: Smoke — health, version, six console group pages
        run: |
          set -e
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-API-Key: ci-smoke-key' "http://127.0.0.1:8000$1")
            echo "$1 -> $code"
            [ "$code" = "200" ]
          }
          check /health
          check /api/v1/version
          check /console/datasets-data.html   # 表格数据
          check /console/datasets-docs.html   # 文本数据
          check /console/ontology.html        # 本体与语义
          check /console/hq-guide.html        # 高质量数据集
          check /console/governance.html      # 治理运维
          check /console/tasks.html           # 管理

      - name: Container logs on failure
        if: failure()
        run: docker logs smoke | tail -80
