<text x="640" y="112" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">cited answer + sources  (async stream)</text>
<text x="60" y="540" font-size="11" fill="#64748b">cyan = primary flow  ·  violet = graph branch  ·  slate dashed = response loop</text>
