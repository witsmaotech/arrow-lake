# PgBouncer configuration for Shannon platform
# This configuration enables read-write splitting for PostgreSQL

[databases]
# Default database (routes to replica for reads)
shannon = host=postgres-replica-1 port=5432 dbname=shannon user=shannon password=shannon
# Write database (primary)
shannon_rw = host=postgres-primary port=5432 dbname=shannon user=shannon password=shannon
# Read database (replica)
shannon_ro = host=postgres-replica-1 port=5432 dbname=shannon user=shannon password=shannon

[pgbouncer]
# Listen addresses (TCP)
listen_addr = 0.0.0.0
listen_port = 6432

# Pool mode: transaction is recommended for PostgreSQL
pool_mode = transaction

# Connection pool settings
max_client_conn = 1000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 3
server_lifetime = 3600
server_idle_timeout = 600

# Performance settings
query_timeout = 300
query_wait_timeout = 120
client_idle_timeout = 600
server_connect_timeout = 15

# Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1

# Admin users
admin_users = admin
stats_users = stats

# Authentication (MD5 mode - secure for production)
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Unix socket settings (disabled - use TCP only)
# unix_socket_dir = /var/run/postgresql
# unix_socket_mode = 0777

# Compatibility
ignore_startup_parameters = extra_float_digits
