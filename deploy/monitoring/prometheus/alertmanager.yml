global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "webhook"

receivers:
  - name: "webhook"
    webhook_configs:
      - url: "http://arrow-lake-webhook:9093/alerts"
        send_resolved: true

# To enable Slack notifications, replace the webhook receiver above with:
#   - name: "slack"
#     slack_configs:
#       - api_url: "https://hooks.slack.com/services/XXX/YYY/ZZZ"
#         channel: "#alerts"
#         title: "{{ .GroupLabels.alertname }}"
#         text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
