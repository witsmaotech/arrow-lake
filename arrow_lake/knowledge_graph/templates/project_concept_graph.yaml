language: [zh, en]
name: project_concept_graph
type: graph
tags: [project, tender, contract, solution, design, procurement, biddocument, 项目, 招标, 合同, 方案, 规划设计, 产品方案]
description:
  zh: '项目/方案概念图 — 从项目招标文件、合同书、解决方案书、规划设计书、产品方案书提取项目要素（主体/项目/交付物/方案/指标/金额等）及其关联（general/concept_graph 的项目领域特化：type/relation 严格枚举）'
  en: 'Project/solution concept graph — extract project elements (parties/project/deliverables/solution/specs/amount etc.) and relations from tender docs, contracts, solution/design/product proposals (domain-specialized concept_graph with strict type/relation enums)'

output:
  description:
    zh: '项目文档中的核心项目要素及其业务/技术关联'
    en: 'Core project elements and their business/technical associations in project docs'
  entities:
    description:
      zh: '文档中的项目要素'
      en: 'Project elements in the document'
    fields:
      - name: name
        type: str
        description: { zh: '要素名称（规范术语）', en: 'Element name (standard terminology)' }
        required: true
      - name: type
        type: str
        description:
          zh: '按要素性质必须是以下 22 类之一（值=括号前的类名，不得带分组字母前缀或抄写整行）：主体(当事方如采购方承建方供应商)/组织(委办局处室项目组)/角色(人员角色如项目经理)/项目(项目子项建设目标)/场景(业务应用场景用例)/业务流程(流程工作流)/硬件(实体设备如服务器交换机GPU存储传感器摄像头)/软件(程序系统如平台中间件应用模块)/模型(AI算法如大模型OCR RAG)/数据(数据集数据流数据源)/服务(实施运维培训咨询)/区域(区县地点机房路段)/节点(工期里程碑交付节点)/指标(量化技术参数如性能数量规格)/要求(条款约束如等保质保响应)/资质(认证合规如ISO CMMI)/方案(解决方案架构技术路线)/技术(通用技术如云计算边缘区块链数字孪生5G IoT)/标准(接口协议规范国标如GB/T28181 MQTT REST)/金额(报价预算合同金额)/条款(合同条款违约知识产权保密)/安全(安全控制措施如防护等备风险)。禁止"概念""其他"等笼统值，必须选最具体匹配。易混：硬件(实体设备)vs软件(程序)；模型(AI算法)vs技术(通用如5G)；指标(量化)vs要求(条款)；资质(认证)vs安全(控制)。'
          en: 'MUST be one of 22 types (value = the class name before the paren, no group prefix): 主体(party: purchaser/builder/vendor) / 组织(org: dept/bureau) / 角色(role: pm/tech-lead) / 项目(project/subproject) / 场景(scenario/use-case) / 业务流程(process/workflow) / 硬件(hardware: server/switch/GPU/sensor) / 软件(software: system/platform/app) / 模型(model: AI algo/LLM/OCR) / 数据(data: dataset/stream) / 服务(service: ops/training) / 区域(location/region) / 节点(schedule/milestone) / 指标(spec: metric/perf) / 要求(requirement: clause like warranty) / 资质(qualification: ISO/CMMI) / 方案(solution/architecture) / 技术(technology: cloud/edge/5G) / 标准(standard: protocol/GB) / 金额(amount/budget) / 条款(clause/contract term) / 安全(security/control). Generic "concept" forbidden; pick the most specific match.'
        required: true
      - name: definition
        type: str
        description: { zh: '要素的简要定义/说明（必填）', en: 'Brief definition/description of the element (required)' }
        required: true
  relations:
    description:
      zh: '项目要素之间的业务/技术关联'
      en: 'Business/technical associations between project elements'
    fields:
      - name: source
        type: str
        description: { zh: '源要素名称', en: 'Source element name' }
        required: true
      - name: target
        type: str
        description: { zh: '目标要素名称', en: 'Target element name' }
        required: true
      - name: type
        type: str
        description:
          zh: |
            关系类型，必须是以下之一：包含(contains 整体-部分) / 属于(is_a) / 依赖(depends_on) / 提供(provides 主体→交付物) / 要求(requires 项目/交付物→要求/指标/资质) / 承担(responsible_for 主体→条款/服务) / 采用(uses 方案→技术/产品) / 集成(integrates 软件↔软件经接口) / 部署(deployed_on 软件/模型→硬件/平台) / 部署于(located_in →区域) / 训练(trained_on 模型→数据/算法) / 处理(processes 模型/流程→数据) / 报价(priced →金额) / 交付于(delivered_at →节点) / 达成(achieves →目标) / 遵循(follows →标准)。禁止自创其他值或混用英文。
          en: 'Relation type, MUST be one of: contains/is_a/depends_on/provides/requires/responsible_for/uses/integrates/deployed_on/located_in/trained_on/processes/priced/delivered_at/achieves/follows. Other values forbidden.'
        required: true
      - name: description
        type: str
        description: { zh: '关系说明', en: 'Relation description' }
        required: false

guideline:
  target:
    zh: '你是一位项目/方案知识图谱专家，擅长从项目招标文件、合同书、解决方案书、规划设计书、产品方案书中提取项目要素（主体/项目/交付物/方案/指标/金额等）及其业务、技术关联。'
    en: 'You are a project/solution knowledge graph expert skilled at extracting project elements and their business/technical associations from tender docs, contracts, solution/design/product proposals.'
  rules_for_entities:
    zh:
      - '每 chunk 最多提取 15 个最核心要素（按项目重要性精选，不穷举罗列采购清单/规格表的每一行；宁缺毋滥）'
      - '主体仅指人/机构当事方（采购方/承建方/供应商/监理/代理机构）；平台/系统/中台/引擎/门户/APP 归“软件”，AI 能力归“模型”——严禁把建设内容、子系统、模块默认归主体'
      - '提取文档中明确表述的项目要素：当事方、项目、交付物（硬件/软件/模型/数据/服务）、方案、技术、指标、要求、金额、工期、资质、条款等'
      - 'type 必须按性质选 22 类中最具体的（先定 A-G 组再选类），严禁用"概念""其他"笼统归类'
      - 'name 用规范术语，同一要素全文命名一致'
      - 'definition 必填，简要说明该要素'
      - '区分易混类：硬件(实体设备) vs 软件(程序系统)；模型(AI算法) vs 技术(通用如5G)；指标(量化参数) vs 要求(条款约束)；资质(认证) vs 安全(控制措施)'
      - '不抽取规格碎片（如"5*8""4U"除非是独立的指标实体）；优先抽结构化项目要素'
    en:
      - 'Extract explicitly stated project elements: parties, deliverables, solutions, specs, amounts, milestones, qualifications, clauses etc.'
      - 'type must be the most specific of the 22 classes; generic "concept" forbidden'
      - 'Use standard terminology; consistent naming throughout'
      - 'definition required'
      - 'Distinguish hardware vs software; model vs technology; spec vs requirement; qualification vs security'
  rules_for_relations:
    zh:
      - 'type 必须严格用枚举值之一（包含/属于/依赖/提供/要求/承担/采用/集成/部署/部署于/训练/处理/报价/交付于/达成/遵循），禁止自创或混用英文'
      - '优先提取文档中明确表述的项目关联'
      - '不创建隐含的常识性关联，仅提取文档中明确说明的关系'
    en:
      - 'type must be one of the enumerated values; no custom values'
      - 'Prioritize explicitly stated project relationships'
      - 'Do not create implicit common-sense associations'

identifiers:
  entity_id: name
  relation_id: '{source}|{type}|{target}'
  relation_members: { source: source, target: target }

display:
  entity_label: '{name}'
  relation_label: '{type}'
