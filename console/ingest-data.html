<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>数据摄入(表格) · Arrow Lake Console</title>
<link rel="stylesheet" href="assets/tokens.css"/>
<link rel="stylesheet" href="assets/app.css"/>
<link rel="stylesheet" href="assets/console.css"/>
<style>
  .file-pill{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line-soft);border-radius:var(--r-sm);margin-bottom:6px;font-size:.78rem;background:var(--ink-900)}
  .file-pill .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-hi)}
  .file-pill .sz{font-family:var(--font-mono);color:var(--fg-lo);font-size:.7rem;flex-shrink:0}
  .dropzone{border:2px dashed var(--line);border-radius:var(--r-md);padding:var(--s5);text-align:center;cursor:pointer;transition:var(--dur-2)}
  .dropzone:hover,.dropzone.drag{border-color:var(--teal);background:rgba(20,184,166,.05)}
  .blob-row{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--ink-900);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:6px;font-size:.74rem}
  .blob-row .bk{flex:1;min-width:0;font-family:var(--font-mono);color:var(--teal-bright);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
<main class="main"><div class="page">
  <div class="h-sec between">
    <div><h1>数据摄入 · 表格</h1><div class="desc">结构化数据源(CSV/Parquet/JSON/数据库/流·湖格式)→ Lance · 全异步</div></div>
    <div class="flex"><a class="btn btn-ghost btn-sm" href="ingest-docs.html">📄 文档/图像/视频摄入 →</a></div>
  </div>
  <div class="panel"><div class="panel-b">
    <div class="grid g-3">
      <div class="field"><label>目标数据集</label><input class="input mono" id="ds" placeholder="my_dataset"/></div>
      <div class="field"><label>目标表名 <span class="muted" style="font-weight:400">(可选 · 容器表)</span></label><input class="input mono" id="tbl" placeholder="segments" pattern="^[a-zA-Z_][a-zA-Z0-9_-]*$"/></div>
      <div class="field"><label>说明介绍 <span class="muted" style="font-weight:400">(可选 · 数据集描述)</span></label><input class="input" id="desc" placeholder="如:燃气管段台账 / 销售流水"/></div>
    </div>
    <div class="field" style="margin-top:var(--s3)"><label>数据源类型</label><select class="select" id="src"></select>
      <div class="muted" style="font-size:.7rem;margin-top:4px">填表名 = 多表容器数据集(<span class="mono">{数据集}.{表}</span> 二段寻址);留空 = 单表数据集。csv/parquet/json/sql/clickhouse 支持表名。</div>
    </div>
    <div id="fields" style="margin-top:var(--s3)"></div>
    <div class="flex between" style="margin-top:var(--s4)">
      <div class="flex"><button class="btn btn-primary" id="submit"><i class="placeholder" data-ic="plus"></i> 开始摄入</button></div>
      <span class="tag info" id="endpt">POST /datasets/{name}/ingest</span>
    </div>
  </div></div>
  <div class="panel flush hidden" id="resultPanel">
    <div class="panel-h"><i class="placeholder" data-ic="check"></i><h3>摄入结果</h3></div>
    <div class="panel-b" id="result"></div>
  </div>
</div></main>
</div>

<script src="assets/console-layout.js"></script>
<script type="module">
import { request } from "./src/api.js";
import { API_BASE, getAccessToken, getApiKey, isLoggedIn } from "./src/auth.js";
import { toast } from "./src/ui/toast.js";
import { watchTask } from "./src/task.js";

if (!isLoggedIn()) location.href = "login.html";
const { renderShell } = window;
renderShell({ active: "ingest-data", crumb: '<a href="datasets-data.html">数据集</a> › <b>表格摄入</b>' });
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MB = 1024 * 1024;
const MAX_TOTAL = 100 * MB;
const MAX_FILES = 20;
// 支持容器表名的源(后端 Async Request 有 table 字段;其余类型填了会被忽略并提示)
const TABLE_SRC = new Set(["csv", "parquet", "json", "sql", "clickhouse"]);

const dsParam = new URL(location.href).searchParams.get("ds");
const tblParam = new URL(location.href).searchParams.get("table");
if (dsParam) $("#ds").value = dsParam;
if (tblParam) $("#tbl").value = tblParam;
$("#ds").addEventListener("change", () => loadExistingMeta($("#ds").value.trim()));
loadExistingMeta((dsParam || $("#ds").value).trim());

let uploadedBlobs = [];
let pickedFiles = [];
const SRCS = [["csv", "CSV"], ["parquet", "Parquet"], ["json", "JSON / JSONL"], ["sql", "SQL 数据库"], ["clickhouse", "ClickHouse"], ["kafka", "Kafka"], ["iceberg", "Iceberg"], ["deltalake", "Delta Lake"], ["http", "HTTP 文件"]];
function fillSrc() {
  $("#src").innerHTML = SRCS.map(([v, t]) => `<option value="${v}">${t}</option>`).join("");
  renderFields();
}
$("#src").addEventListener("change", renderFields);
fillSrc();

// 上传文件到 MinIO(multipart)→ blobs[]
async function uploadFiles(name, files) {
  const fd = new FormData();
  files.forEach((f) => fd.append("files", f));
  const headers = {};
  const tok = getAccessToken(); if (tok) headers["Authorization"] = `Bearer ${tok}`;
  const ak = getApiKey(); if (ak) headers["X-API-Key"] = ak;
  const res = await fetch(`${API_BASE}/datasets/${encodeURIComponent(name)}/upload`, { method: "POST", headers, body: fd });
  if (!res.ok) { let d; try { d = (await res.json()).detail; } catch { d = `HTTP ${res.status}`; } throw new Error(typeof d === "string" ? d : JSON.stringify(d)); }
  return (await res.json()).blobs || [];
}

// 通用上传区 HTML
function renderUploadHTML(accept, hint) {
  return `
    <label style="font-size:.82rem;color:var(--fg-md)">上传文件(多选 / 拖拽 · <b style="color:var(--warn)">总量 ≤100MB</b> · 最多 ${MAX_FILES})</label>
    <div class="dropzone" id="dropzone" style="margin-top:6px">
      <i class="placeholder" data-ic="file" style="font-size:1.4rem;color:var(--teal-bright)"></i>
      <div style="margin-top:8px;color:var(--fg-md)">点击选择 或 拖拽文件到此处</div>
      <div class="muted" style="font-size:.7rem;margin-top:4px">${hint}</div>
    </div>
    <input type="file" id="fileInput" multiple accept="${accept}" style="display:none"/>
    <div id="fileList" style="margin:var(--s3) 0"></div>
    <div class="flex" style="gap:8px;align-items:center">
      <button class="btn btn-ghost btn-sm" id="uploadBtn" type="button">上传到 MinIO</button>
      <span id="uploadStatus" class="muted" style="font-size:.72rem"></span>
    </div>
    <div id="uploadedBlobs" style="margin-top:var(--s3)"></div>`;
}

function renderUploaded() {
  $("#uploadedBlobs").innerHTML = uploadedBlobs.length
    ? uploadedBlobs.map((b) => `<div class="blob-row"><span class="tag teal">blob</span><span class="bk" title="${esc(b.key)}">${esc(b.key)}</span><span class="sz" style="font-family:var(--font-mono);color:var(--fg-lo);font-size:.7rem">${(b.size_bytes / 1024).toFixed(0)}KB</span></div>`).join("")
    : `<div class="muted" style="font-size:.72rem">尚未上传</div>`;
}
function renderFileList(files) {
  const total = files.reduce((s, f) => s + f.size, 0);
  $("#fileList").innerHTML = files.map((f) => `<div class="file-pill"><span class="nm">${esc(f.name)}</span><span class="sz">${(f.size / MB).toFixed(2)} MB</span></div>`).join("")
    + (total > MAX_TOTAL ? `<div class="file-pill" style="border-color:var(--danger)"><span class="nm" style="color:var(--danger)">总量 ${(total / MB).toFixed(1)} MB 超 100MB</span></div>` : "")
    + (files.length > MAX_FILES ? `<div class="file-pill" style="border-color:var(--danger)"><span class="nm" style="color:var(--danger)">${files.length} 个超 ${MAX_FILES} 上限</span></div>` : "");
  $("#uploadStatus").textContent = `${files.length} 文件 / ${(total / MB).toFixed(1)} MB`;
}

// 通用上传组件绑定(文件类源共用)
function bindUpload() {
  const dz = $("#dropzone"), input = $("#fileInput");
  const onFiles = (fl) => { pickedFiles = [...fl]; renderFileList(pickedFiles); };
  if (dz) {
    dz.onclick = () => input.click();
    dz.ondragover = (e) => { e.preventDefault(); dz.classList.add("drag"); };
    dz.ondragleave = () => dz.classList.remove("drag");
    dz.ondrop = (e) => { e.preventDefault(); dz.classList.remove("drag"); onFiles(e.dataTransfer.files); };
  }
  if (input) input.onchange = () => onFiles(input.files);
  const uploadBtn = $("#uploadBtn");
  if (uploadBtn) uploadBtn.onclick = async () => {
    const ds = $("#ds").value.trim();
    if (!ds) { toast("先填目标数据集", "warn"); return; }
    const files = pickedFiles;
    if (!files.length) { toast("先选择文件", "warn"); return; }
    const total = files.reduce((s, f) => s + f.size, 0);
    if (total > MAX_TOTAL) { toast(`总量 ${(total / MB).toFixed(0)} MB 超 100MB`, "warn", 4000); return; }
    if (files.length > MAX_FILES) { toast(`最多 ${MAX_FILES} 个文件`, "warn"); return; }
    uploadBtn.disabled = true; $("#uploadStatus").textContent = "上传中…";
    try {
      const blobs = await uploadFiles(ds, files);
      uploadedBlobs = blobs;
      renderUploaded();
      $("#uploadStatus").textContent = `已上传 ${blobs.length} 个`;
      toast(`上传成功 ${blobs.length} 文件`, "ok");
    } catch (e) {
      $("#uploadStatus").textContent = "上传失败";
      toast("上传失败: " + (e.message || e), "danger", 5000);
    } finally {
      uploadBtn.disabled = false;
    }
  };
  renderUploaded();
}

// 已有数据集回填描述(从 dataset-detail "追加摄入" 带 ?ds= 进来,或手输已有名时加载)
async function loadExistingMeta(name) {
  if (!name) { $("#desc").value = ""; return; }
  try { const d = await request("GET", `/datasets/${encodeURIComponent(name)}`); $("#desc").value = d?.description || ""; }
  catch (_) { /* 新数据集尚无描述 → 留空,不阻塞 */ }
}

function renderFields() {
  const src = $("#src").value;
  const _ep = src === "clickhouse" ? "sql" : (["csv", "parquet", "json"].includes(src) ? "" : src);
  $("#endpt").textContent = `POST /datasets/{name}/ingest${_ep ? "/" + _ep : ""}/async`;
  uploadedBlobs = []; pickedFiles = []; // 切换来源重置
  if (src === "csv" || src === "parquet" || src === "json") {
    const acc = src === "csv" ? ".csv" : src === "parquet" ? ".parquet" : ".json,.jsonl,.ndjson";
    $("#fields").innerHTML = renderUploadHTML(acc, `${src.toUpperCase()} 文件 · 多选 / 拖拽`)
      + `<div class="muted" style="font-size:.7rem;margin-top:var(--s3)">结构化数据:上传后走 <code>daft.read_${src}</code> → Lance。不自动 embed;如需检索,摄入后到「索引/嵌入」建向量/FTS。</div>`;
    window.applyIcons && applyIcons($("#fields"));
    bindUpload();
  } else if (src === "sql") {
    $("#fields").innerHTML = `
      <div class="field"><label>connection_url(SQLAlchemy 连接串 · <b style="color:var(--warn)">必填</b>)</label><input class="input mono" id="connUrl" placeholder="postgresql://user:pass@host:5432/db"/></div>
      <div class="muted" style="font-size:.7rem;margin-top:4px">支持 postgresql / mysql / sqlite / mssql;<b>含凭证,生产建议只读账号</b></div>
      <div class="field" style="margin-top:var(--s3)"><label>SQL(SELECT · <b style="color:var(--warn)">必填</b>)</label><textarea class="input mono" id="sqlText" rows="4" style="font-family:var(--font-mono);resize:vertical" placeholder="SELECT id, title, content FROM articles"></textarea></div>
      <div class="grid g-2" style="margin-top:var(--s3)">
        <div class="field"><label>partition_col(可选)</label><input class="input mono" id="partCol" placeholder="id / created_at"/></div>
        <div class="field"><label>num_partitions(可选 · ≥1)</label><input class="input mono" id="numPart" type="number" min="1" placeholder="4"/></div>
      </div>`;
  } else if (src === "clickhouse") {
    $("#fields").innerHTML = `
      <div class="field"><label>connection_url(ClickHouse · <b style="color:var(--warn)">必填</b>)</label><input class="input mono" id="connUrl" placeholder="clickhouse+native://user:pass@host:9000/db 或 clickhouse://user:pass@host:8123/db"/></div>
      <div class="muted" style="font-size:.7rem;margin-top:4px">复用 <code>/ingest/sql</code>(daft <code>read_sql</code>,ConnectorX/SQLAlchemy);<b style="color:var(--warn)">SSRF 校验拒私有 IP</b>(内网 CH 须公网/NAT)</div>
      <div class="field" style="margin-top:var(--s3)"><label>SQL(SELECT · <b style="color:var(--warn)">必填</b>)</label><textarea class="input mono" id="sqlText" rows="4" style="font-family:var(--font-mono);resize:vertical" placeholder="SELECT id, event, ts FROM events WHERE dt = today()"></textarea></div>
      <div class="grid g-2" style="margin-top:var(--s3)">
        <div class="field"><label>partition_col(可选)</label><input class="input mono" id="partCol" placeholder="id / dt"/></div>
        <div class="field"><label>num_partitions(可选 · ≥1)</label><input class="input mono" id="numPart" type="number" min="1" placeholder="4"/></div>
      </div>`;
  } else if (src === "kafka") {
    $("#fields").innerHTML = `
      <div class="field"><label>bootstrap_servers(<b style="color:var(--warn)">必填</b>)</label><input class="input mono" id="brokers" placeholder="host1:9092, host2:9092"/></div>
      <div class="field" style="margin-top:var(--s3)"><label>topics(<b style="color:var(--warn)">必填</b> · 逗号分隔 · 1-10)</label><input class="input mono" id="topics" placeholder="events, logs"/></div>
      <div class="grid g-2" style="margin-top:var(--s3)">
        <div class="field"><label>start</label><select class="select" id="start"><option value="earliest">earliest</option><option value="latest">latest</option><option value="0">offset 0</option></select></div>
        <div class="field"><label>end(默认 latest)</label><input class="input mono" id="end" value="latest"/></div>
      </div>
      <label class="flex" style="gap:6px;margin-top:var(--s3);font-size:.82rem;color:var(--fg-md)"><input type="checkbox" id="jsonDecode" checked/> json_decode(自动解码 JSON)</label>`;
  } else if (src === "iceberg") {
    $("#fields").innerHTML = `<div class="field"><label>table_uri(<b style="color:var(--warn)">必填</b>)</label><input class="input mono" id="tableUri" placeholder="s3://bucket/warehouse/db.table"/></div><div class="muted" style="font-size:.7rem;margin-top:4px">从 Iceberg 表迁移;<b>不自动 embed</b></div>`;
  } else if (src === "deltalake") {
    $("#fields").innerHTML = `
      <div class="field"><label>table_uri(<b style="color:var(--warn)">必填</b>)</label><input class="input mono" id="tableUri" placeholder="s3://bucket/delta/events"/></div>
      <div class="field" style="margin-top:var(--s3)"><label>version(可选 · ≥1)</label><input class="input mono" id="version" type="number" min="1" placeholder="留空=latest"/></div>`;
  } else if (src === "http") {
    $("#fields").innerHTML = `<div class="field"><label>urls(<b style="color:var(--warn)">必填</b> · 逗号分隔 · 1-100)</label><input class="input mono" id="urls" placeholder="https://example.com/data.csv"/></div><div class="muted" style="font-size:.7rem;margin-top:4px">必须 http/https;拒私有 IP(防 SSRF)</div>`;
  }
}

// 任务进度回调:驱动按钮恢复 + 完成/失败明确提示(+ best-effort embed 回填状态)
async function handleIngestTask(t, btn) {
  const st = String(t.status || "").toUpperCase();
  const pct = Math.round(t.progress || 0);
  const resetBtn = () => { btn.disabled = false; btn.innerHTML = '<i class="placeholder" data-ic="plus"></i> 开始摄入'; };
  if (/FAIL|ERROR/.test(st)) {
    resetBtn();
    toast(`摄入失败: ${t.error || st}`, "danger", 6000);
    return;
  }
  if (/COMPLETE|SUCCESS/.test(st)) {
    resetBtn();
    toast("摄入完成", "ok", 4000);
    return;
  }
  toast(`摄入中… ${st} ${pct}%`, "ok");
}

$("#submit").addEventListener("click", async () => {
  const ds = $("#ds").value.trim();
  if (!ds) { toast("请输入目标数据集名", "warn"); return; }
  const src = $("#src").value;
  const btn = $("#submit");
  btn.disabled = true; btn.textContent = "摄入中…";
  let submitted = false;
  try {
    // 防重复提交:同数据集已有活跃摄入任务 → 拦下
    try {
      const tl = await request("GET", "/tasks");
      const tasks = Array.isArray(tl) ? tl : (tl?.tasks || []);
      const dup = tasks.find((t) =>
        /ingest/i.test(t.operation || "") &&
        t.dataset_name === ds &&
        !/COMPLETED|SUCCESS|FAILED|ERROR|CANCELL/i.test(t.status || "") &&
        (!t.created_at || (Date.now() - new Date(t.created_at).getTime()) < 2 * 60 * 60 * 1000));
      if (dup) {
        toast(`数据集「${ds}」已有摄入任务进行中,请等完成或去队列查看`, "warn", 5000);
        $("#resultPanel").classList.remove("hidden");
        $("#result").innerHTML = `<div style="padding:12px;line-height:1.9">已有进行中的摄入任务 <span class="mono" style="color:var(--teal-bright)">${esc(dup.task_id)}</span>(${esc(dup.status)})<br><a href="tasks.html?task=${encodeURIComponent(dup.task_id)}" style="color:var(--teal-bright)">在任务队列查看 →</a></div>`;
        return;
      }
    } catch (_) { /* /tasks 查询失败不阻塞提交(best-effort) */ }
    let body = {};
    // 已选文件但未点"上传到 MinIO"→ 提交时自动上传兜底
    const pendingFiles = pickedFiles;
    if (pendingFiles.length && !uploadedBlobs.length) {
      toast(`正在上传 ${pendingFiles.length} 个文件…`, "ok");
      try {
        uploadedBlobs = await uploadFiles(ds, pendingFiles);
        renderUploaded();
      } catch (e) {
        toast("上传失败: " + (e.message || e), "danger", 5000);
        return;
      }
    }
    const blobKeys = uploadedBlobs.map((b) => b.key);
    if (src === "csv" || src === "parquet" || src === "json") {
      if (!blobKeys.length) { toast("请先上传文件", "warn"); return; }
      body = { file_paths: [], blob_keys: blobKeys };
    } else if (src === "sql" || src === "clickhouse") {
      const connUrl = $("#connUrl").value.trim(), sqlText = $("#sqlText").value.trim();
      if (!connUrl || !sqlText) { toast("connection_url 和 SQL 必填", "warn"); return; }
      const numPart = parseInt($("#numPart").value, 10);
      body = { connection_url: connUrl, sql: sqlText, partition_col: $("#partCol").value.trim() || null, num_partitions: Number.isNaN(numPart) ? null : numPart };
    } else if (src === "kafka") {
      const brokers = $("#brokers").value.trim();
      const topics = $("#topics").value.split(",").map((s) => s.trim()).filter(Boolean);
      if (!brokers || !topics.length) { toast("bootstrap_servers 和 topics 必填", "warn"); return; }
      if (topics.length > 10) { toast("topics 最多 10 个", "warn"); return; }
      body = { bootstrap_servers: brokers, topics, start: $("#start").value, end: $("#end").value.trim() || "latest", json_decode: $("#jsonDecode").checked };
    } else if (src === "iceberg" || src === "deltalake") {
      const tableUri = $("#tableUri").value.trim();
      if (!tableUri) { toast("table_uri 必填", "warn"); return; }
      body = { table_uri: tableUri };
      if (src === "deltalake") { const ver = parseInt($("#version").value, 10); body.version = Number.isNaN(ver) ? null : ver; }
    } else if (src === "http") {
      const urls = $("#urls").value.split(",").map((s) => s.trim()).filter(Boolean);
      if (!urls.length) { toast("urls 必填", "warn"); return; }
      if (urls.length > 100) { toast("urls 最多 100", "warn"); return; }
      body = { urls };
    } else {
      toast(`「${src}」无表单`, "warn"); return;
    }
    // 说明介绍随摄入 payload 一起发(后端在数据集创建后持久化,治 202 后 PUT 的竞态 422)
    body.description = $("#desc").value.trim() || null;
    // 容器表名(DR14 W1.3):csv/parquet/json/sql/clickhouse 端点支持;其余类型提示忽略
    const tbl = $("#tbl").value.trim();
    if (tbl) {
      if (!/^[a-zA-Z_][a-zA-Z0-9_-]*$/.test(tbl)) { toast("表名须匹配 ^[a-zA-Z_][a-zA-Z0-9_-]*$", "warn"); return; }
      if (!TABLE_SRC.has(src)) { toast(`「${src}」源暂不支持表名(仅 csv/parquet/json/sql/clickhouse),已忽略`, "warn", 5000); }
      else body.table = tbl;
    }
    let ep;
    if (src === "clickhouse" || src === "sql") ep = "sql";
    else if (["csv", "parquet", "json"].includes(src)) ep = "";
    else ep = src;
    const url = `/datasets/${encodeURIComponent(ds)}/ingest${ep ? "/" + ep : ""}/async`;
    const res = await request("POST", url, { body });
    $("#resultPanel").classList.remove("hidden");
    const tid = res?.task_id || res?.task?.task_id;
    if (tid) {
      $("#result").innerHTML = `<div style="padding:14px;line-height:1.9">异步摄入已提交 · 任务 <span class="mono" style="color:var(--teal-bright)">${esc(tid)}</span>${tbl && TABLE_SRC.has(src) ? ` → <span class="mono">${esc(ds)}.${esc(tbl)}</span>` : ""}<br><a href="tasks.html?task=${encodeURIComponent(tid)}" style="color:var(--teal-bright)">在任务队列页查看进度 →</a></div>`;
      toast("异步摄入已提交,可在任务队列页跟踪", "ok");
      submitted = true;
      watchTask(tid, (t) => handleIngestTask(t, btn));
    } else {
      $("#result").innerHTML = `<pre style="white-space:pre-wrap;background:var(--ink-950);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s4);font-family:var(--font-mono);font-size:.78rem;color:var(--fg-md);margin:0">${esc(JSON.stringify(res, null, 2))}</pre>`;
      toast("摄入已提交", "ok");
    }
  } catch (e) {
    const msg = e?.detail || e?.message || String(e);
    toast("摄入失败: " + msg, "danger", 5000);
    $("#resultPanel").classList.remove("hidden");
    $("#result").innerHTML = `<div style="color:var(--danger);padding:12px">${esc(msg)}</div>`;
  } finally {
    if (!submitted) { btn.disabled = false; btn.innerHTML = '<i class="placeholder" data-ic="plus"></i> 开始摄入'; }
  }
});
</script>
</body>
</html>
