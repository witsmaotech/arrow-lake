name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: MyPy type check
        run: uv run mypy arrow_lake/

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --cov=arrow_lake --cov-report=term-missing

      - name: Run integration tests (CPU only)
        run: uv run pytest tests/integration/ -v --tb=short -q
