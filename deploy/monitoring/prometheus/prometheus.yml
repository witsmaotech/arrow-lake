# Prometheus 配置
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "dintellihub-server"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: "/metrics"

  - job_name: "ray-head"
    static_configs:
      - targets: ["dintellihub-ray-head:8265"]
    metrics_path: "/metrics"

  - job_name: "minio"
    static_configs:
      - targets: ["dintellihub-minio:9000"]
    metrics_path: "/minio/v2/metrics/cluster"
