<text x="1040.0" y="460.0" font-size="9.5" font-weight="600" fill="#fb7185" text-anchor="middle">8. bulk write graph</text>
<line x1="935.0" y1="508" x2="725.0" y2="508" stroke="#a78bfa" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="5,3" marker-end="url(#m-violet)"/>
<text x="830.0" y="500.0" font-size="9.5" font-weight="600" fill="#a78bfa" text-anchor="middle">9. done</text>
<line x1="725.0" y1="548" x2="515.0" y2="548" stroke="#fbbf24" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="5,3" marker-end="url(#m-amber)"/>
<text x="620.0" y="540.0" font-size="9.5" font-weight="600" fill="#fbbf24" text-anchor="middle">10. status = DONE</text>
<line x1="95.0" y1="588" x2="515.0" y2="588" stroke="#60a5fa" stroke-width="1.9" stroke-linecap="round" marker-end="url(#m-slate)"/>
<text x="305.0" y="580.0" font-size="9.5" font-weight="600" fill="#60a5fa" text-anchor="middle">11. poll kg_build_status(id)</text>
<line x1="515.0" y1="628" x2="95.0" y2="628" stroke="#60a5fa" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="5,3" marker-end="url(#m-slate)"/>
<text x="305.0" y="620.0" font-size="9.5" font-weight="600" fill="#60a5fa" text-anchor="middle">12. DONE</text></svg>