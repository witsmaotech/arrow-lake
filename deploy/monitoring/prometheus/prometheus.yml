# Prometheus configuration for Arrow Lake production
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "arrow-lake-server"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"

  - job_name: "ray-head"
    static_configs:
      - targets: ["ray-head:8265"]
    metrics_path: "/metrics"

  - job_name: "minio"
    static_configs:
      - targets: ["minio:9000"]
    metrics_path: "/minio/v2/metrics/cluster"

  # Redis metrics via redis_exporter sidecar
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # HugeGraph does not expose a native /metrics Prometheus endpoint.
  # Enable only after adding an exporter or custom metrics endpoint.
  # - job_name: "hugegraph"
  #   static_configs:
  #     - targets: ["hg-server:8080"]
