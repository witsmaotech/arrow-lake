<text x="935.0" y="140" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle">Vermeer</text>
<rect x="1085.0" y="120" width="120" height="32" rx="6" fill="#1e293b" stroke="#fb7185" stroke-width="1.6"/>
<text x="1145.0" y="140" font-size="11" font-weight="700" fill="#fb7185" text-anchor="middle">HugeGraph</text>
<line x1="95.0" y1="156" x2="95.0" y2="670" stroke="#1c2740" stroke-width="1" stroke-dasharray="3,4"/>
<line x1="305.0" y1="156" x2="305.0" y2="670" stroke="#1c2740" stroke-width="1" stroke-dasharray="3,4"/>
<line x1="515.0" y1="156" x2="515.0" y2="670" stroke="#1c2740" stroke-width="1" stroke-dasharray="3,4"/>
<line x1="725.0" y1="156" x2="725.0" y2="670" stroke="#1c2740" stroke-width="1" stroke-dasharray="3,4"/>
<line x1="935.0" y1="156" x2="935.0" y2="670" stroke="#1c2740" stroke-width="1" stroke-dasharray="3,4"/>
<line x1="1145.0" y1="156" x2="1145.0" y2="670" stroke="#1c2740" stroke-width="1" stroke-dasharray="3,4"/>
