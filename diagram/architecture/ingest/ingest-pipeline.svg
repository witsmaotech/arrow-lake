<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <!-- Arrowhead marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#64748b">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <!-- Grid pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <!-- Glow filters -->
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#34d399" flood-opacity="0.15"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-violet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#a78bfa" flood-opacity="0.15"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#fbbf24" flood-opacity="0.12"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-slate" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#94a3b8" flood-opacity="0.1"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="1200" fill="#0f172a"/>
  <rect width="900" height="1200" fill="url(#grid)"/>

  <!-- Title -->
  <text x="450" y="42" font-family="'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace" font-size="22" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">INGEST PIPELINE</text>
  <text x="450" y="62" font-family="'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace" font-size="11" fill="#64748b" text-anchor="middle" letter-spacing="1">Arrow Lake v1.3.0</text>
  <line x1="150" y1="74" x2="750" y2="74" stroke="#1e293b" stroke-width="1"/>

  <!-- ==================== ROW 1: Input Sources ==================== -->
  <!-- Files source -->
  <rect x="60" y="96" width="220" height="58" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5" filter="url(#glow-slate)"/>
  <text x="170" y="118" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Files</text>
  <text x="170" y="140" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">CSV / JSON / Parquet / PDF</text>

  <!-- HTTP source -->
  <rect x="340" y="96" width="220" height="58" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5" filter="url(#glow-slate)"/>
  <text x="450" y="118" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">HTTP URLs</text>
  <text x="450" y="140" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">HttpConnector + retry</text>

  <!-- Media source -->
  <rect x="620" y="96" width="220" height="58" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5" filter="url(#glow-slate)"/>
  <text x="730" y="118" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Media</text>
  <text x="730" y="140" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Image / Video</text>

  <!-- Arrows: Sources -> File Classifier -->
  <line x1="170" y1="154" x2="350" y2="190" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="154" x2="450" y2="190" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="730" y1="154" x2="550" y2="190" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ==================== ROW 2: File Classifier ==================== -->
  <rect x="300" y="194" width="300" height="46" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" filter="url(#glow-emerald)"/>
  <text x="450" y="213" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">File Classifier</text>
  <text x="450" y="230" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">_detect_file_type() + extension routing</text>

  <!-- Arrows: Classifier -> Processing branches -->
  <line x1="350" y1="240" x2="135" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="240" x2="345" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="240" x2="555" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="240" x2="765" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ==================== ROW 3: Processing (4 parallel branches) ==================== -->
  <!-- Text extraction -->
  <rect x="30" y="294" width="210" height="54" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" filter="url(#glow-emerald)"/>
  <text x="135" y="315" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">Text Extraction</text>
  <text x="135" y="335" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">_read_file() / _read_bytes()</text>

  <!-- Image processing -->
  <rect x="255" y="294" width="190" height="54" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" filter="url(#glow-emerald)"/>
  <text x="350" y="315" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">ImageProcessor</text>
  <text x="350" y="335" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">thumbnail + EXIF</text>

  <!-- Video processing -->
  <rect x="460" y="294" width="190" height="54" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" filter="url(#glow-emerald)"/>
  <text x="555" y="315" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">VideoProcessor</text>
  <text x="555" y="335" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">keyframe extraction</text>

  <!-- PDF / Document processing -->
  <rect x="665" y="294" width="210" height="54" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" filter="url(#glow-emerald)"/>
  <text x="770" y="315" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">DocumentParser</text>
  <text x="770" y="335" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">Kreuzberg / TurboOCR (GPU)</text>

  <!-- Arrows: Processing -> Merge point -->
  <line x1="135" y1="348" x2="350" y2="400" stroke="#64748b" stroke-width="1.5"/>
  <line x1="350" y1="348" x2="400" y2="400" stroke="#64748b" stroke-width="1.5"/>
  <line x1="555" y1="348" x2="500" y2="400" stroke="#64748b" stroke-width="1.5"/>
  <line x1="770" y1="348" x2="550" y2="400" stroke="#64748b" stroke-width="1.5"/>

  <!-- Merge dot -->
  <circle cx="450" cy="404" r="5" fill="#64748b"/>

  <!-- Arrow: Merge -> Chunking -->
  <line x1="450" y1="409" x2="450" y2="440" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ==================== ROW 4: Chunking ==================== -->
  <rect x="175" y="444" width="550" height="58" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" filter="url(#glow-emerald)"/>
  <text x="450" y="466" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">DocumentChunker</text>
  <text x="450" y="488" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">page | paragraph | recursive | semchunk | chonkie_token | chonkie_semantic | chonkie_sdpm</text>

  <!-- Arrow: Chunking -> Quality Filter -->
  <line x1="450" y1="502" x2="450" y2="544" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ==================== ROW 5: Quality Filter ==================== -->
  <rect x="225" y="548" width="450" height="58" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" filter="url(#glow-emerald)"/>
  <text x="450" y="570" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">QualityFilterRegistry</text>
  <text x="450" y="592" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">apply_all() — AND / OR filter modes</text>

  <!-- Side note for dedup -->
  <rect x="700" y="548" width="170" height="44" rx="4" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4 2" filter="url(#glow-amber)"/>
  <text x="785" y="566" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#fbbf24" text-anchor="middle">Dedup</text>
  <text x="785" y="582" font-family="'JetBrains Mono', monospace" font-size="8" fill="#fcd34d" text-anchor="middle">SHA-256 + pHash</text>
  <line x1="675" y1="572" x2="700" y2="570" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Arrow: Quality Filter -> Split -->
  <line x1="450" y1="606" x2="450" y2="650" stroke="#64748b" stroke-width="1.5"/>

  <!-- Split point for Write to Lance / Upload Media -->
  <circle cx="450" cy="654" r="5" fill="#64748b"/>

  <!-- Arrow: Split -> Write to Lance (left) -->
  <line x1="450" y1="659" x2="300" y2="710" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Arrow: Split -> Upload Media (right) -->
  <line x1="450" y1="659" x2="600" y2="710" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ==================== ROW 6: Write to Lance (cylinder) ==================== -->
  <!-- Cylinder body -->
  <path d="M 140 730 L 140 790 Q 140 810 220 810 Q 300 810 300 790 L 300 730" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow-violet)"/>
  <!-- Cylinder top ellipse -->
  <ellipse cx="220" cy="730" rx="80" ry="14" fill="rgba(76,29,149,0.5)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="220" y="764" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">LanceDB</text>
  <text x="220" y="782" font-family="'JetBrains Mono', monospace" font-size="8" fill="#c4b5fd" text-anchor="middle">metadata + vectors + text</text>

  <!-- ==================== ROW 6: Upload Media (cylinder) ==================== -->
  <!-- Cylinder body -->
  <path d="M 460 730 L 460 790 Q 460 810 540 810 Q 620 810 620 790 L 620 730" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow-violet)"/>
  <!-- Cylinder top ellipse -->
  <ellipse cx="540" cy="730" rx="80" ry="14" fill="rgba(76,29,149,0.5)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="540" y="764" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">MinIO / S3</text>
  <text x="540" y="782" font-family="'JetBrains Mono', monospace" font-size="8" fill="#c4b5fd" text-anchor="middle">large files → S3 URI ref</text>

  <!-- ==================== ROW 6b: Dead Letter Queue (side) ==================== -->
  <rect x="700" y="730" width="170" height="54" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4 2" filter="url(#glow-amber)"/>
  <text x="785" y="752" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#fbbf24" text-anchor="middle">Dead Letter Queue</text>
  <text x="785" y="770" font-family="'JetBrains Mono', monospace" font-size="8" fill="#fcd34d" text-anchor="middle">retry / permanent / resolve</text>
  <!-- Arrow from Quality Filter to DLQ -->
  <line x1="675" y1="590" x2="700" y2="720" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrowhead)"/>

  <!-- Arrows: Lance + MinIO -> Merge -->
  <line x1="220" y1="810" x2="380" y2="870" stroke="#64748b" stroke-width="1.5"/>
  <line x1="540" y1="810" x2="520" y2="870" stroke="#64748b" stroke-width="1.5"/>

  <!-- Merge dot before side branches -->
  <circle cx="450" cy="874" r="5" fill="#64748b"/>

  <!-- Arrow: Merge -> Final merge point -->
  <line x1="450" y1="879" x2="450" y2="920" stroke="#64748b" stroke-width="1.5"/>

  <!-- Split to side branches -->
  <circle cx="450" cy="924" r="5" fill="#64748b"/>

  <!-- ==================== ROW 7: Audit Trail ==================== -->
  <rect x="80" y="910" width="220" height="54" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" filter="url(#glow-emerald)"/>
  <text x="190" y="932" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">AuditTrail</text>
  <text x="190" y="950" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">HMAC-SHA256 integrity</text>
  <line x1="450" y1="924" x2="300" y2="932" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ==================== ROW 7: Lineage Record ==================== -->
  <rect x="600" y="910" width="220" height="54" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" filter="url(#glow-emerald)"/>
  <text x="710" y="932" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">LineageStore</text>
  <text x="710" y="950" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">data provenance tracking</text>
  <line x1="450" y1="924" x2="600" y2="932" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ==================== ROW 8: IngestionReport ==================== -->
  <line x1="450" y1="929" x2="450" y2="994" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="325" y="998" width="250" height="46" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5" filter="url(#glow-slate)"/>
  <text x="450" y="1020" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">IngestionReport</text>
  <text x="450" y="1036" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">row_count + file_count + stats</text>

  <!-- ==================== Legend ==================== -->
  <rect x="50" y="1080" width="800" height="90" rx="8" fill="rgba(15,23,42,0.8)" stroke="#1e293b" stroke-width="1"/>
  <text x="80" y="1102" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748b">LEGEND</text>

  <!-- Process -->
  <rect x="80" y="1112" width="20" height="14" rx="3" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="108" y="1123" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Process Step</text>

  <!-- Decision / Side note -->
  <rect x="230" y="1112" width="20" height="14" rx="3" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3 1"/>
  <text x="258" y="1123" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Side / Decision</text>

  <!-- Storage -->
  <ellipse cx="420" cy="1119" rx="14" ry="6" fill="rgba(76,29,149,0.5)" stroke="#a78bfa" stroke-width="1"/>
  <text x="442" y="1123" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Storage</text>

  <!-- External -->
  <rect x="530" y="1112" width="20" height="14" rx="3" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
  <text x="558" y="1123" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">External / Output</text>

  <!-- Arrow -->
  <line x1="700" y1="1119" x2="730" y2="1119" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="740" y="1123" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Data Flow</text>

  <!-- Subtle branding -->
  <text x="450" y="1192" font-family="'JetBrains Mono', monospace" font-size="8" fill="#334155" text-anchor="middle">arrow_lake.ingest — top-to-bottom flowchart</text>
</svg>
