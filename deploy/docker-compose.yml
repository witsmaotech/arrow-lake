# Arrow Lake — Docker Compose (Sprint 1, Story 1.9)
#
# Services: MinIO + Ray Head + Jupyter
# Usage: docker compose -f deploy/docker-compose.yml up -d
#
# Override with: deploy/docker-compose.gpu.yml (for GPU)

services:
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: arrow-lake-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
      - ./minio-init:/docker-entrypoint-init.d
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  ray-head:
    image: rayproject/ray:2.54.1-py311
    container_name: arrow-lake-ray-head
    ports:
      - "6379:6379"   # Ray GCS / Redis
      - "8265:8265"   # Ray Dashboard
      - "8000:8000"   # Prometheus metrics
    depends_on:
      minio:
        condition: service_healthy
    environment:
      RAY_ADDRESS: "0.0.0.0:6379"
      ARROW_LAKE__STORAGE__S3_ENDPOINT: "http://minio:9000"
      ARROW_LAKE__STORAGE__S3_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      ARROW_LAKE__STORAGE__S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      ARROW_LAKE__STORAGE__S3_BUCKET: "arrow-lake"
      ARROW_LAKE__STORAGE__BACKEND: "minio"
      ARROW_LAKE__OBSERVABILITY__METRICS_ENABLED: "true"
      ARROW_LAKE__OBSERVABILITY__METRICS_PORT: "8000"
      ARROW_LAKE__OBSERVABILITY__LOG_LEVEL: "INFO"
    volumes:
      - ../:/app:ro
    working_dir: /app
    command: >
      ray start
      --head
      --port=6379
      --dashboard-host=0.0.0.0
      --dashboard-port=8265
      --num-cpus=2
      --block
    healthcheck:
      test: ["CMD", "ray", "status"]
      interval: 15s
      timeout: 10s
      retries: 5

  jupyter:
    image: rayproject/ray:2.54.1-py311
    container_name: arrow-lake-jupyter
    ports:
      - "8888:8888"
    depends_on:
      ray-head:
        condition: service_healthy
    environment:
      RAY_ADDRESS: "ray://ray-head:10001"
      ARROW_LAKE__STORAGE__S3_ENDPOINT: "http://minio:9000"
      ARROW_LAKE__STORAGE__S3_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      ARROW_LAKE__STORAGE__S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      ARROW_LAKE__STORAGE__S3_BUCKET: "arrow-lake"
      ARROW_LAKE__STORAGE__BACKEND: "minio"
    volumes:
      - ../:/app
    working_dir: /app
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --NotebookApp.token=""
      --allow-root

volumes:
  minio-data:
    driver: local
