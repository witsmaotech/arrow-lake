<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>质量报告 · Arrow Lake Console</title>
<link rel="stylesheet" href="assets/tokens.css"/>
<link rel="stylesheet" href="assets/app.css"/>
<link rel="stylesheet" href="assets/console.css"/>
<style>
  .f-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .f-row label{font-size:.7rem;color:var(--fg-dim);min-width:64px}
  input.f,select.f{background:var(--ink-950);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--fg-hi);font-size:.76rem;padding:6px 9px;font-family:var(--font-mono)}
  .rep{border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:10px;background:var(--ink-950)}
  .rep .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .rep .score{font-family:var(--font-mono);font-size:1.3rem;font-weight:600;color:var(--fg-hi)}
  .pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.64rem;border:1px solid var(--line);color:var(--fg-dim)}
  .pill.ok{color:var(--teal-bright);border-color:var(--teal-bright)}
  .pill.warn{color:var(--warn);border-color:var(--warn)}
  .pill.bad{color:var(--danger);border-color:var(--danger)}
  .dims{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
  .dim{border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:6px 8px}
  .dim .n{font-size:.64rem;color:var(--fg-dim)}
  .dim .v{font-family:var(--font-mono);font-size:.95rem;color:var(--fg-hi)}
  .dim.na .v{color:var(--fg-dim)}
  .vetoes{margin-top:8px;font-size:.7rem;color:var(--danger)}
  .drift{margin-top:8px;font-size:.7rem;color:var(--fg-md);font-family:var(--font-mono)}
</style>
</head>
<body>
<script src="assets/console-layout.js"></script>
<script type="module">
const { renderShell } = window;
renderShell({ active: "quality-reports", crumb: "<b>质量报告</b>" });
</script>
<main class="console-main"><section class="panel">
  <h2 style="margin:0 0 4px">五维质量报告(MS5 F5.1)</h2>
  <p class="hint" style="margin:0 0 12px;color:var(--fg-dim);font-size:.72rem">评估→星级→准入门(85/95/98)→一票否决;相关性经标注回路,准确性=ADL 聚合 κ。</p>
  <div class="f-row">
    <label>数据集</label><input id="ds" class="f" value="" placeholder="dataset 名" style="width:220px"/>
    <button class="btn btn-primary btn-sm" id="assess">评估</button>
    <button class="btn btn-line btn-sm" id="relevance">相关性回路</button>
    <button class="btn btn-line btn-sm" id="drift">漂移检测</button>
    <button class="btn btn-line btn-sm" id="feedback">飞轮回流</button>
    <button class="btn btn-line btn-sm" id="refeed">反哺清单</button>
  </div>
  <div id="reports"><p class="hint" style="color:var(--fg-dim);font-size:.74rem">输入数据集名加载评估历史。</p></div>
</section></main>
<script type="module">
import { request } from "./src/api.js";
import { toast } from "./src/ui/toast.js";
import { promptDialog } from "./src/ui/modal.js";

const $ = (s) => document.querySelector(s);
const stars = (n) => "★".repeat(Math.max(n, 0)) + "☆".repeat(Math.max(5 - n, 0));
const esc = (s) => String(s ?? "").replace(/[<>"&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", '"': "&quot;", "&": "&amp;" }[c]));

async function load() {
  const ds = $("#ds").value.trim();
  if (!ds) return toast("输入数据集名", "warn");
  const r = await request(`/api/v1/quality/reports/${encodeURIComponent(ds)}?limit=10`);
  const box = $("#reports");
  if (!r.reports?.length) { box.innerHTML = `<p class="hint">无评估历史——点击「评估」生成首份报告。</p>`; return; }
  box.innerHTML = r.reports.map((rep) => `
    <div class="rep">
      <div class="hd">
        <span class="score">${rep.total_score ?? "—"}</span>
        <span style="color:var(--warn);letter-spacing:2px">${stars(rep.star)}</span>
        <span class="pill ${rep.admission === "none" ? "bad" : "ok"}">${esc(rep.admission)}</span>
        <span class="pill ${rep.verdict === "pass" ? "ok" : rep.verdict === "degraded" ? "warn" : "bad"}">${esc(rep.verdict)}</span>
        <span class="pill">${esc(rep.assessed_at)}</span>
        <span class="pill">#${rep.id} · ${esc(rep.assessed_by)}</span>
      </div>
      <div class="dims">${["relevance", "accuracy", "completeness", "diversity", "timeliness"].map((k) => {
        const d = rep.dimensions?.[k] || {};
        const na = d.score == null;
        return `<div class="dim ${na ? "na" : ""}"><div class="n">${k}${d.source === "llm" ? " ·llm" : ""}</div><div class="v">${na ? "—" : d.score}</div></div>`;
      }).join("")}</div>
      ${rep.vetoes?.length ? `<div class="vetoes">一票否决:${rep.vetoes.map((v) => esc(v.kind + (v.column ? `(${v.column})` : ""))).join(" · ")}</div>` : ""}
      ${rep.degraded?.length ? `<div class="vetoes" style="color:var(--fg-dim)">降级维度:${esc(rep.degraded.join(", "))}</div>` : ""}
    </div>`).join("");
}

async function assess() {
  const ds = $("#ds").value.trim();
  if (!ds) return toast("输入数据集名", "warn");
  try {
    const r = await request(`/api/v1/quality/assess/${encodeURIComponent(ds)}`, { method: "POST" });
    toast(`评估完成:${r.total_score ?? "—"} 分 · ${r.admission}`, "ok");
    if (r.drift?.status === "compared" && r.drift.drifted?.length)
      toast(`漂移超阈:${r.drift.drifted.join(", ")}`, "warn");
    load();
  } catch (e) { toast(`评估失败:${e.message}`, "bad"); }
}

async function relevance() {
  const ds = $("#ds").value.trim();
  if (!ds) return toast("输入数据集名", "warn");
  try {
    const n = await promptDialog({ title: "相关性回路", message: "抽样规模(≤500)", value: "500" });
    const r = await request(`/api/v1/quality/relevance/${encodeURIComponent(ds)}?n=${encodeURIComponent(n || 500)}`, { method: "POST" });
    toast(`已启动(${r.mode})· 抽样 ${r.sampled} 行;回收后重跑评估`, "ok");
  } catch (e) { toast(`启动失败:${e.message}`, "bad"); }
}

async function drift() {
  const ds = $("#ds").value.trim();
  if (!ds) return toast("输入数据集名", "warn");
  try {
    const r = await request(`/api/v1/quality/drift/${encodeURIComponent(ds)}`, { method: "POST" });
    if (r.status === "baseline_created") toast(`基线已建立(${r.columns} 列),再次检测开始比较`, "ok");
    else toast(r.drifted?.length ? `漂移超阈:${r.drifted.join(", ")}` : "无漂移", r.drifted?.length ? "warn" : "ok");
  } catch (e) { toast(`检测失败:${e.message}`, "bad"); }
}

async function feedback() {
  const ds = $("#ds").value.trim();
  if (!ds) return toast("输入数据集名", "warn");
  try {
    const rows = await promptDialog({ title: "飞轮回流", message: "低置信行 id(逗号分隔)", value: "" });
    if (!rows) return;
    const r = await request(`/api/v1/quality/feedback/${encodeURIComponent(ds)}`, {
      method: "POST", body: JSON.stringify({ object_rows: rows.split(",").map((x) => x.trim()).filter(Boolean) }),
    });
    toast(`入队 ${r.queued} · 已在队 ${r.already_queued} · 未找到 ${r.missing_rows?.length || 0}`, "ok");
  } catch (e) { toast(`回流失败:${e.message}`, "bad"); }
}

async function refeed() {
  const ds = $("#ds").value.trim();
  if (!ds) return toast("输入数据集名", "warn");
  try {
    const r = await request(`/api/v1/quality/relevance/${encodeURIComponent(ds)}/refeed`);
    const box = $("#reports");
    if (r.relevance_score == null) { toast(`无相关性标注:${r.note || "先跑相关性回路"}`, "warn"); return; }
    box.insertAdjacentHTML("afterbegin", `
      <div class="rep">
        <div class="hd"><span class="score">反哺清单</span>
          <span class="pill">relevance ${r.relevance_score} · ${esc(r.source)}</span></div>
        <div class="vetoes" style="color:var(--fg-dim)">过滤整改建议(${r.filter_suggestions.length}):${esc(r.filter_suggestions.join(", ") || "无")}</div>
        <div class="drift">补标优先(${r.priority_annotate.length}):${esc(r.priority_annotate.join(", ") || "无")} → 经「飞轮回流」入队</div>
      </div>`);
    toast(`反哺:过滤 ${r.filter_suggestions.length} · 补标 ${r.priority_annotate.length}`, "ok");
  } catch (e) { toast(`反哺失败:${e.message}`, "bad"); }
}

$("#ds").addEventListener("change", load);
$("#assess").onclick = assess;
$("#relevance").onclick = relevance;
$("#drift").onclick = drift;
$("#feedback").onclick = feedback;
$("#refeed").onclick = refeed;
</script>
</body>
</html>
