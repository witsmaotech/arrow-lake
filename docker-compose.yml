# DIntelliHub 本地开发环境
# 使用Docker Compose快速启动开发环境
# 注意: LanceDB作为Python库使用，不需要单独的Docker容器

services:
  # PostgreSQL 元数据库
  postgres:
    image: postgres:14-alpine
    container_name: dintellihub-postgres
    environment:
      POSTGRES_DB: gravitino
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"  # 使用15432避免与系统PostgreSQL冲突
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gravitino"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dintellihub-net

  # MinIO 对象存储 (开发环境替代S3)
  minio:
    image: minio/minio:latest
    container_name: dintellihub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - dintellihub-net

  # MinIO 初始化客户端（创建bucket）
  minio-init:
    image: minio/mc:latest
    container_name: dintellihub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set minio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb minio/dintellihub-raw --ignore-existing;
      /usr/bin/mc mb minio/dintellihub-processed --ignore-existing;
      /usr/bin/mc mb minio/dintellihub-vectors --ignore-existing;
      /usr/bin/mc mb minio/dintellihub-models --ignore-existing;
      /usr/bin/mc mb minio/dintellihub-backups --ignore-existing;
      echo 'MinIO buckets created successfully';
      "

  # Redis 缓存 (可选)
  # 注意: LanceDB作为Python库在应用代码中使用，数据存储在本地文件系统
  # 示例: db = lancedb.connect("/data/lancedb")
  redis:
    image: redis:7-alpine
    container_name: dintellihub-redis
    volumes:
      - redis_data:/data
    ports:
      - "16379:6379"  # 使用16379避免与系统Redis冲突
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - dintellihub-net

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:latest
    container_name: dintellihub-prometheus
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # 使用默认配置，避免挂载不存在的配置文件
    networks:
      - dintellihub-net

  # Grafana 可视化
  grafana:
    image: grafana/grafana:latest
    container_name: dintellihub-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "13000:3000"  # 使用13000避免冲突
    depends_on:
      - prometheus
    networks:
      - dintellihub-net

networks:
  dintellihub-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
