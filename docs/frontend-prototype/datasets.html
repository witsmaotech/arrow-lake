<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>数据集 · Arrow Lake</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css"/><link rel="stylesheet" href="assets/app.css"/>
</head>
<body>
<div id="app">
<main class="main">
  <div class="page">
    <div class="h-sec between">
      <div><h1>数据集</h1><div class="desc">48 个 Lance 数据集 · 统一 catalog · 点开进入 9-Tab 工作区</div></div>
      <div class="flex">
        <button class="btn btn-ghost btn-sm"><i class="placeholder" data-ic="filter"></i> 按 tag</button>
        <a class="btn btn-primary btn-sm" href="#ingest"><i class="placeholder" data-ic="plus"></i> 新建数据集</a>
      </div>
    </div>

    <div class="panel flush">
      <div class="panel-h"><i class="placeholder" data-ic="search"></i><input class="input grow" placeholder="搜索数据集…" style="background:none;border:none;padding:0"/>
        <div class="flex" style="gap:6px"><span class="tag">all</span><span class="tag teal">text</span><span class="tag">image</span><span class="tag">video</span><span class="tag amber">KG ✓</span></div>
      </div>
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr><th>数据集</th><th>类型</th><th class="num">行数</th><th class="num">大小</th><th>分块</th><th>嵌入</th><th>KG</th><th class="num">更新</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </div>

    <a id="ingest"></a>
    <div class="panel">
      <div class="panel-h"><i class="placeholder" data-ic="ingest"></i><h3>快速摄入 · 11 种来源</h3><span class="actions"><span class="tag" id="curSrc">documents</span></div></div>
      <div class="panel-b">
        <div class="grid g-4" id="sources"></div>
        <div class="divider" style="margin:var(--s4) 0"></div>
        <div class="grid g-3">
          <div class="field"><label>目标数据集</label><select class="select"><option>新建…</option><option>papers</option><option>regulations</option></select></div>
          <div class="field"><label>schema 模式</label><select class="select"><option>strict（拒绝非法）</option><option>lenient（尽力解析）</option></select></div>
          <div class="field"><label>死信队列</label><select class="select"><option>启用（带错误上下文）</option><option>关闭</option></select></div>
        </div>
        <div id="srcFields" style="margin-top:var(--s4)"></div>
        <div class="flex between" style="margin-top:var(--s4)"><div class="flex"><button class="btn btn-primary" onclick="alert('原型：POST /datasets/{name}/ingest/'+curSrc)">开始摄入</button><span class="lamp ok"><i></i>同步返回 report · KG 异步 fire-and-forget</span></div><span class="tag info" id="endpt">POST /datasets/{name}/ingest/documents</span></div>
      </div>
    </div>
  </div>
</main>
</div>
<script src="assets/layout.js"></script>
<script>
const {renderShell,icon}=window;
renderShell({active:'datasets',crumb:'<b>数据集</b>'});
const DS=[
['papers','text',184203,'12.4 GB','Chonkie','Qwen3 1024',true,'07-04'],
['regulations','text',52118,'4.8 GB','Paragraph','Qwen3 1024',true,'07-04'],
['knowledge_base','text',8421,'620 MB','Recursive','Qwen3',true,'07-03'],
['product_photos','image',200001,'48 GB','—','CLIP 512',false,'07-02'],
['promos','video',4821,'120 GB','keyframe','CLIP',false,'07-01'],
['training_data','tabular',2143888,'8.1 GB','—','—',false,'06-30'],
['reviews','text',98213,'2.2 GB','Semchunk','Qwen3',false,'06-29'],
['transactions','tabular',1842932,'1.4 GB','—','—',false,'06-28'],
];
const ty={text:'teal',image:'info',video:'amber',tabular:''};
$('#rows').innerHTML=DS.map(d=>`<tr>
<td><a href="dataset-detail.html" style="color:var(--fg-hi);font-weight:600">${icon('database')} ${d[0]}</a></td>
<td><span class="tag ${ty[d[1]]}">${d[1]}</span></td>
<td class="num">${d[2].toLocaleString()}</td>
<td class="num">${d[3]}</td>
<td class="mono muted">${d[4]}</td>
<td class="mono muted">${d[5]}</td>
<td>${d[6]?`<a href="kg.html"><span class="lamp ok"><i></i>kg_${d[0]}</span></a>`:'<span class="lamp"><i style="background:var(--fg-lo);box-shadow:none"></i></span>'}</td>
<td class="num mono">${d[7]}</td>
<td><button class="btn btn-icon btn-ghost btn-sm" aria-label="更多">${''}</button></td>
</tr>`).join('');
document.querySelectorAll('#rows .btn-icon').forEach(b=>b.innerHTML=icon('chevronD'));

const SRC=[['documents','文档','PDF/DOCX · OCR','file'],['images','图像','缩略图+降采样','image'],['videos','视频','关键帧','video'],['mixed','混合','多模态','quality'],['sql','SQL','JDBC 拉取','database'],['http','HTTP','API 流式','cloud'],['kafka','Kafka','流式订阅','refresh'],['iceberg','Iceberg','表迁移','database'],['deltalake','DeltaLake','表迁移','database'],['url','URL','远程抓取','cloud'],['file','文件系统','本地/挂载','file']];
let curSrc='documents';
const f=(label,val,hint)=>`<div class="field"><label>${label}</label><input class="input mono" value="${val}"/>${hint?`<div class="muted" style="font-size:.68rem;margin-top:3px">${hint}</div>`:''}</div>`;
const sel=(label,opts)=>`<div class="field"><label>${label}</label><select class="select">${opts.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
const FORM={
documents:()=>`<div class="grid g-3">${f('文件/目录','data/papers/*.pdf','glob 或路径')} ${sel('doc_type 路由',['auto','paper','report','patent','policy'])} ${sel('分块策略',['Chonkie Semantic','Page','Paragraph','Recursive','Semchunk','Chonkie Token','Chonkie SDPM'])}</div><div class="grid g-3" style="margin-top:var(--s3)">${sel('嵌入模型',['Qwen3-Embedding 0.6B','CLIP','sentence-transformers'])} ${sel('OCR 后端',['Kreuzberg (PaddleOCR)','Tesseract','EasyOCR','Docling (RapidOCR)'])} ${sel('num_sub_vectors',['32 (1024d)','64','16'])}</div><label class="flex" style="gap:6px;margin-top:var(--s3);font-size:.8rem;color:var(--fg-md)"><input type="checkbox" checked/> 扫描页走 OCR · <input type="checkbox" checked/> 摄入后异步建 KG</label>`,
images:()=>`<div class="grid g-3">${f('glob','photos/*.jpg, *.png')} ${f('缩略图分辨率','256')} ${f('降采样阈值','1024 px','大图嵌入前降采样控成本')}</div>`,
videos:()=>`<div class="grid g-3">${f('glob','videos/*.mp4')} ${f('关键帧间隔','5 s')} ${sel('嵌入模型',['CLIP (关键帧)'])}</div>`,
mixed:()=>`<div class="grid g-3">${f('文本 glob','docs/*.md, *.pdf')} ${f('图像 glob','img/*.jpg')} ${f('视频 glob','vid/*.mp4')}</div>`,
sql:()=>`<div class="grid g-2">${f('JDBC 连接','postgresql://host:5432/db')} ${f('SQL','SELECT id, content FROM records')}</div><div class="muted" style="font-size:.72rem;margin-top:8px">拉取结构化数据 · 可选分块/嵌入（仅文本列）</div>`,
http:()=>`<div class="grid g-3">${f('URL','https://api.example.com/data')} ${sel('方法',['GET','POST'])} ${f('JSON 路径','$.results[*]')}</div><div class="grid g-2" style="margin-top:var(--s3)">${f('分页参数','?page={n}')} ${f('认证 Header','Authorization: Bearer …')}</div>`,
kafka:()=>`<div class="grid g-3">${f('brokers','host:9092')} ${f('topic','events')} ${f('group_id','arrow-lake-consumer')}</div><div class="grid g-2" style="margin-top:var(--s3)">${sel('offset',['latest','earliest'])} ${f('反序列化','json')}</div>`,
iceberg:()=>`<div class="grid g-3">${f('catalog','glue')} ${f('namespace','analytics')} ${f('表标识','analytics.events')}</div><div class="muted" style="font-size:.72rem;margin-top:8px">从 Iceberg 表迁移到 Lance</div>`,
deltalake:()=>`<div class="grid g-2">${f('表路径','s3://bucket/delta/events')} ${f('版本','latest')}</div>`,
url:()=>`<div class="grid g-2">${f('URL 列表','https://a.com/1.pdf, https://b.com/2.pdf')} ${sel('内容类型',['auto-detect','文档','图像','视频'])}</div>`,
file:()=>`<div class="grid g-2">${f('路径/glob','/data/uploads/**')} ${sel('递归',['是','否'])}</div>`,
};
function setSrc(s){curSrc=s;$('#curSrc').textContent=s;$('#endpt').textContent='POST /datasets/{name}/ingest/'+s;renderSrcFields();$$('.src-card').forEach(c=>c.classList.toggle('sel',c.dataset.s===s))}
function renderSrcFields(){$('#srcFields').innerHTML=FORM[curSrc]?FORM[curSrc]():'<div class="muted">该来源使用通用参数</div>'}
$('#sources').innerHTML=SRC.map(s=>`<button class="src-card panel ${s[0]==='documents'?'sel':''}" data-s="${s[0]}" onclick="setSrc('${s[0]}')" style="text-decoration:none;color:var(--fg-hi);cursor:pointer;text-align:left"><div class="panel-b flex"><span style="width:32px;height:32px;border-radius:8px;background:var(--teal-soft);color:var(--teal-bright);display:grid;place-items:center">${icon(s[3]||'file')}</span><div style="margin-left:10px"><div style="font-weight:600;font-size:.85rem">${s[0]}</div><div class="muted" style="font-size:.7rem">${s[2]}</div></div></div></button>`).join('');
renderSrcFields();
function $$(s){return[...document.querySelectorAll(s)]}
</script>
<style>.src-card{transition:var(--dur-2)}.src-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-3)}.src-card.sel{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal),var(--shadow-2)}.src-card.sel .panel-b>span{background:var(--teal)!important;color:var(--ink-950)!important}</style>
</body>
</html>
